content=# Robot API – co je k dispozici\n\
Robot API je třída `robot.api.Robot` a její vnořené typy `Direction`, `TileType` a `ShelfType`. Poskytuje příkazy pro pohyb a manipulaci s balíky a dotazy na aktuální stav hry. Metody i konstanty rozlišují velká a malá písmena.\n\
\n\
Tato kapitola popisuje skutečně implementované veřejné metody. U každé je uvedeno, jaké parametry přijímá, co mění a co vrací. `void` znamená, že metoda žádnou hodnotu nevrací. Zápis volání metody vždy obsahuje závorky.\n\
\n\
# Import a zápis volání\n\
Statický import zpřístupní veřejné statické metody i vnořené typy:\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
Bez statického importu lze použít import třídy a kvalifikované volání:\n\
\n\
```java\n\
import robot.api.Robot;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        Robot.move(Robot.Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
Import pouze zpřístupní názvy; sám nic nevykoná. Instance `new Robot()` se nevytváří, protože konstruktor je soukromý. Metody API jsou statické.\n\
\n\
# Direction – směry pohybu\n\
`Direction` je výčtový typ se čtyřmi konstantami:\n\
\n\
`Direction.LEFT` – doleva, souřadnice X se zmenší o 1.\n\
\n\
`Direction.RIGHT` – doprava, souřadnice X se zvětší o 1.\n\
\n\
`Direction.TOP` – nahoru, souřadnice Y se zmenší o 1.\n\
\n\
`Direction.DOWN` – dolů, souřadnice Y se zvětší o 1.\n\
\n\
Samotné přiřazení směru robota neposune. Pohyb provede až metoda `move()`:\n\
\n\
```java\n\
Direction smer = Direction.RIGHT;\n\
move(smer);\n\
```\n\
\n\
# move(Direction direction) – jeden krok\n\
Parametr `direction` určuje jeden ze čtyř směrů typu `Direction`. Metoda vrací `void`.\n\
\n\
Při úspěšném pohybu změní polohu robota o jedno políčko a zvýší herní počet kroků o 1. Náklad veze s sebou; zásoby ani doručené počty pohybem nemění.\n\
\n\
```java\n\
move(Direction.RIGHT);\n\
move(Direction.DOWN);\n\
```\n\
\n\
Robot nesmí opustit mapu ani vstoupit na překážku. Chybný pohyb zastaví běh hry s chybou. Předání `null` je také chyba. Metoda nevrací `true` ani `false` a sama nevybírá jinou cestu.\n\
\n\
# pick() – vzít jeden balík\n\
Metoda nemá parametry a vrací `void`. Robot musí stát na neprázdné polici nebo na příjmu a nesmí už nést jiný balík.\n\
\n\
Na polici odebere jeden kus z její zásoby a nastaví náklad robota na sortiment této police. Na příjmu vezme čekající balík a v nekonečné úrovni se připraví další příchozí balík. Poloha robota se nemění.\n\
\n\
```java\n\
pick();\n\
ShelfType nesenyTyp = cargoType();\n\
```\n\
\n\
Balík z příjmu je nutné nejprve naskladnit do odpovídající police. Teprve po opětovném vyzvednutí z police jej lze odeslat na expedici.\n\
\n\
Volání mimo polici a příjem, vyzvednutí z prázdné police nebo pokus nést druhý balík zastaví běh s chybou.\n\
\n\
# drop() – položit nebo odeslat balík\n\
Metoda nemá parametry a vrací `void`. Robot musí nést balík. Její účinek závisí na místě a režimu úrovně.\n\
\n\
V nekonečné úrovni na polici správného typu zvýší zásobu o jeden kus a vyprázdní náklad robota. Naskladnění samo nesplní objednávku.\n\
\n\
Na expedici `TileType.DOCK` odešle balík, zvýší doručený počet jeho typu a vyprázdní náklad robota. Balík přinesený přímo z příjmu bez naskladnění odeslat nelze. V nekonečné úrovni musí aktuální zakázka daný typ ještě požadovat.\n\
\n\
```java\n\
drop();\n\
boolean bezNakladu = cargoType() == null;\n\
```\n\
\n\
Pokud se tím splní běžná úroveň, hra ji označí za dokončenou. V nekonečné úrovni po splnění zakázky ihned připraví další objednávku; mapa a zásoby zůstanou zachované.\n\
\n\
Volání bez nákladu, na nevhodném místě nebo na polici jiného typu zastaví běh s chybou. V běžných skladových úrovních se balíky odevzdávají na expedici; ukládání do polic podporuje nekonečný režim.\n\
\n\
# robotCoordinatesX() – aktuální sloupec\n\
Metoda nemá parametry a vrací `int`: aktuální souřadnici X robota. Levý sloupec má index 0, pravý `šířka mapy - 1`.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
```\n\
\n\
Souřadnici pouze přečte. Robota neposune ani nenastaví novou pozici. Při pohybu doprava X roste, při pohybu doleva klesá.\n\
\n\
# robotCoordinatesY() – aktuální řádek\n\
Metoda nemá parametry a vrací `int`: aktuální souřadnici Y robota. Horní řádek má index 0, spodní `výška mapy - 1`.\n\
\n\
```java\n\
int y = robotCoordinatesY();\n\
```\n\
\n\
Souřadnici pouze přečte. Při pohybu dolů Y roste, při pohybu nahoru klesá. Souřadnice zapisujeme v pořadí `[x, y]`; ve vlastní 2D mapě se obvykle používá `mapa[y][x]`.\n\
\n\
# TileType – typ políčka\n\
`TileType` je výčtový typ se čtyřmi konstantami:\n\
\n\
`TileType.FLOOR` – běžná podlaha.\n\
\n\
`TileType.SHELF` – police, i když má právě nulovou zásobu.\n\
\n\
`TileType.DOCK` – expedice, kde se odesílají balíky do objednávky.\n\
\n\
`TileType.INBOUND` – příjem, odkud se vyzvedávají nové balíky.\n\
\n\
Pro překážku není definována konstanta `WALL` ani `OBSTACLE`. Robot na překážce stát nemůže a API neobsahuje dotaz na typ sousedního políčka.\n\
\n\
# tileType() – políčko pod robotem\n\
Metoda nemá parametry a vrací hodnotu typu `TileType`. Zjišťuje typ políčka na aktuální pozici robota.\n\
\n\
```java\n\
TileType policko = tileType();\n\
boolean naPolici = policko == TileType.SHELF;\n\
```\n\
\n\
Nemění mapu, polohu, náklad ani zásoby. Nemá parametry X a Y, takže pomocí ní nelze přímo zkoumat libovolné místo na mapě. Typ políčka neříká, kolik balíků na polici zbývá.\n\
\n\
# ShelfType – typ zboží\n\
`ShelfType` představuje sortiment police i typ neseného balíku. Obsahuje čtyři konstanty:\n\
\n\
`ShelfType.PARTS` – součástky; konfigurační klíč `orange`, český název `Součástky`.\n\
\n\
`ShelfType.ELECTRONICS` – elektronika; klíč `purple`, název `Elektronika`.\n\
\n\
`ShelfType.TOOLS` – nástroje; klíč `tools`, název `Nástroje`.\n\
\n\
`ShelfType.MATERIALS` – materiál; klíč `materials`, název `Materiál`.\n\
\n\
Tyto konstanty pouze označují typ. Jejich přiřazení do proměnné nevytvoří balík, nezmění polici ani nenastaví náklad.\n\
\n\
# shelfType() – sortiment aktuální police\n\
Metoda nemá parametry. Vrací `ShelfType` odpovídající polici pod robotem; pokud robot nestojí na polici, vrací `null`.\n\
\n\
```java\n\
ShelfType typPolice = shelfType();\n\
boolean policeSoucastek = typPolice == ShelfType.PARTS;\n\
```\n\
\n\
Prázdná police si zachovává svůj sortiment. `shelfType() != null` tedy neznamená, že z ní lze právě teď vzít balík. Metoda nemění zásoby ani jiné části stavu hry.\n\
\n\
# cargoType() – právě nesený balík\n\
Metoda nemá parametry. Vrací `ShelfType` neseného balíku nebo `null`, pokud robot nic nenese.\n\
\n\
```java\n\
ShelfType naklad = cargoType();\n\
boolean robotJePrazdny = naklad == null;\n\
boolean vezeElektroniku = naklad == ShelfType.ELECTRONICS;\n\
```\n\
\n\
Náklad pouze přečte. Nový náklad nastaví úspěšné `pick()`, vyprázdní jej úspěšné `drop()`. Metoda `cargoType()` nemá parametr pro nastavení typu.\n\
\n\
# null – chybějící hodnota\n\
`null` je hodnota jazyka Java, kterou `shelfType()` a `cargoType()` používají pro nepřítomnost police nebo nákladu. Není to konstanta typu `ShelfType`; neexistuje `ShelfType.NONE`.\n\
\n\
```java\n\
ShelfType typ = cargoType();\n\
if (typ != null) {\n\
\    String nazev = typ.label();\n\
}\n\
```\n\
\n\
Na `null` nelze volat metodu, například `cargoType().label()` bez kontroly může způsobit `NullPointerException`. U enumů lze bezpečně porovnávat hodnoty pomocí `==` a `!=`.\n\
\n\
# orderRemaining(ShelfType type) – zbývající požadavek\n\
Parametr `type` je konkrétní typ zboží. Metoda vrací nezáporný `int`: kolik kusů daného typu ještě zbývá dodat do aktuální objednávky.\n\
\n\
```java\n\
int zbyvaSoucastek = orderRemaining(ShelfType.PARTS);\n\
int zbyvaElektroniky = orderRemaining(ShelfType.ELECTRONICS);\n\
int zbyvaNastroju = orderRemaining(ShelfType.TOOLS);\n\
int zbyvaMaterialu = orderRemaining(ShelfType.MATERIALS);\n\
```\n\
\n\
Nula znamená, že aktuální objednávka daný typ nepotřebuje nebo už byl její požadavek na tento typ splněn. Výsledek není počet kusů na polici a metoda nic nerezervuje ani nenastavuje.\n\
\n\
Po dokončení zakázky v nekonečném režimu se další dotaz vztahuje už k nové objednávce. Parametr `null` je chyba.\n\
\n\
# ShelfType.key() – konfigurační klíč\n\
Instanční metoda `String key()` nemá parametry a vrací konfigurační klíč daného typu: `orange`, `purple`, `tools` nebo `materials`.\n\
\n\
```java\n\
String klic = ShelfType.PARTS.key(); // "orange"\n\
```\n\
\n\
Nic nenastavuje. Klíče odpovídají označením zboží v konfiguraci úrovní; nejde o názvy enum konstant.\n\
\n\
# ShelfType.label() – český název\n\
Instanční metoda `String label()` nemá parametry a vrací český název daného typu zboží.\n\
\n\
```java\n\
String nazev = ShelfType.ELECTRONICS.label(); // "Elektronika"\n\
```\n\
\n\
Nic nemění a sama název nikam nevypisuje. Při volání přes výsledek `cargoType()` nebo `shelfType()` nejprve ověř, že výsledek není `null`.\n\
\n\
# ShelfType.fromKey(String key) – převod klíče\n\
Statická metoda přijímá konfigurační klíč a vrací odpovídající hodnotu `ShelfType`.\n\
\n\
```java\n\
ShelfType typ = ShelfType.fromKey("orange"); // PARTS\n\
```\n\
\n\
Platné vstupy jsou přesně `orange`, `purple`, `tools` a `materials`, včetně velikosti písmen. Neznámý klíč i `null` vyvolají `IllegalArgumentException`. Metoda nemění stav hry.\n\
\n\
# Standardní metody výčtových typů\n\
Všechny tři enumy mají standardní metody Javy. `Direction.values()`, `TileType.values()` a `ShelfType.values()` vracejí pole všech konstant příslušného typu v pořadí jejich deklarace. Každé volání vytvoří nové pole.\n\
\n\
```java\n\
Direction[] smery = Direction.values(); // LEFT, RIGHT, TOP, DOWN\n\
TileType[] policka = TileType.values(); // FLOOR, SHELF, DOCK, INBOUND\n\
ShelfType[] druhy = ShelfType.values(); // PARTS, ELECTRONICS, TOOLS, MATERIALS\n\
```\n\
\n\
`Direction.valueOf(String name)`, `TileType.valueOf(String name)` a `ShelfType.valueOf(String name)` vracejí konstantu podle přesného názvu. Neznámý název vyvolá `IllegalArgumentException`, `null` vyvolá `NullPointerException`.\n\
\n\
```java\n\
Direction smer = Direction.valueOf("RIGHT");\n\
TileType policko = TileType.valueOf("SHELF");\n\
ShelfType typ = ShelfType.valueOf("PARTS");\n\
```\n\
\n\
Každá konstanta má také standardní `String name()` s přesným názvem a `int ordinal()` s pořadovým číslem od nuly. Tyto metody nic nemění.\n\
\n\
```java\n\
String nazev = ShelfType.PARTS.name(); // "PARTS"\n\
int poradi = Direction.RIGHT.ordinal(); // 1\n\
```\n\
\n\
`ShelfType.valueOf("PARTS")` používá název enum konstanty, zatímco `ShelfType.fromKey("orange")` používá konfigurační klíč. `ShelfType.PARTS.label()` vrací český název `Součástky`. Tyto tři zápisy nezaměňuj.\n\
\n\
# Co API nastavuje a co pouze čte\n\
Polohu mění pouze `move(Direction)`, vždy o jedno políčko. `pick()` a `drop()` mění náklad a podle místa také zásoby nebo doručené počty. Žádná z těchto metod nevrací hodnotu.\n\
\n\
`robotCoordinatesX()`, `robotCoordinatesY()`, `tileType()`, `shelfType()`, `cargoType()` a `orderRemaining()` pouze vracejí aktuální stav. Nemění polohu, náklad, zásoby, objednávku ani počet pohybových kroků.\n\
\n\
API nemá veřejné proměnné pro přepsání pozice, nákladu nebo zásob ani metody pro jejich přímé nastavení. Změna lokální proměnné, například `x = 5`, nepřesune robota. Typy `Direction`, `TileType` a `ShelfType` jsou vlastní typy API; `int`, `void`, `if`, `for` nebo `while` jsou součástí jazyka Java.\n\
\n\
# Pravidla úrovně a vlastní metody\n\
`allowedKeywords` v konfiguraci úrovně určuje dostupné příkazy Robot API a řídicí konstrukce Javy. Pokud položka chybí nebo je prázdná, tyto možnosti se neomezují. Nekonečná úroveň dovoluje všechny výše uvedené příkazy.\n\
\n\
Kontrola rozlišuje skutečné metody podle třídy, které patří. Vlastní metoda může mít stejný název jako metoda API. Její tělo však stále musí používat pouze příkazy a Java konstrukce povolené v dané lekci. Komentáře, texty a názvy proměnných se jako příkazy nekontrolují.\n\
\n\
# Běh programu a chyby\n\
Herní příkazy a dotazy se vyhodnocují postupně podle skutečného stavu hry. Následující řádek hráčova programu pokračuje až po dokončení předchozího příkazu nebo vyhodnocení dotazu. Souřadnice načtené za pohybem proto odpovídají dokončenému pohybu.\n\
\n\
Dotazy na stav vyžadují živé spuštění ve hře. API omezuje počet požadavků na 2000 za jednu zakázku; počítají se i dotazy. Po přechodu na další zakázku se čítač obnoví. Dlouhý výpočet bez komunikace s hrou může narazit na časový limit.\n\
\n\
Robot API ovládá skladové úrovně. Úrovně Bubble sort a Binary search používají běžná Java pole a vlastní algoritmy; jejich canvas a výsledek popisují samostatné kapitoly. Žádné speciální metody `compare()` ani `swap()` toto Robot API neimplementuje; takové pomocné metody si může hráč vytvořit sám.
