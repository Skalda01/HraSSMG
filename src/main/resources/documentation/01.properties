content=# Struktura programu\n\
Program robota se zapisuje v programovacím jazyce Java. Každý program musí obsahovat třídu `Main` a v ní hlavní metodu `main`, která představuje vstupní bod programu.\n\
\n\
Základní struktura programu je vždy stejná. Mění se pouze příkazy, které zapisujeme do těla metody `main`.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
# Import Robot API\n\
Řádek `import static robot.api.Robot.*;` zpřístupňuje příkazy pro ovládání robota. Díky tomuto importu můžeme přímo používat například metodu `move()`, aniž bychom museli uvádět celý název třídy, ve které je definována.\n\
\n\
Samotný import žádný pohyb ani jinou akci neprovádí. Pouze umožňuje používat dostupné příkazy Robot API. Jejich podrobné vysvětlení se nachází v samostatné dokumentaci.\n\
\n\
# Třída Main\n\
Třída `Main` je základní částí programu. V jazyce Java slouží třídy k organizaci programového kódu a obsahují metody, případně další prvky programu.\n\
\n\
V tomto prostředí musí mít hlavní třída název `Main`. Uvnitř této třídy se nachází metoda `main`, ve které zapisujeme program robota.\n\
\n\
```java\n\
public class Main {\n\
\n\
}\n\
```\n\
\n\
Deklarace třídy se skládá z několika částí.\n\
\n\
`public` je modifikátor přístupu. Označuje třídu jako veřejně přístupnou, takže ji mohou používat také ostatní části programu, pokud k ní mají přístup.\n\
\n\
`class` je klíčové slovo jazyka Java, které označuje vytvoření nové třídy. Za tímto slovem musí následovat její název.\n\
\n\
`Main` je název třídy. Java rozlišuje velká a malá písmena, proto `Main` a `main` nejsou stejné názvy. Pro správné fungování našeho prostředí je nutné zachovat přesný název `Main`.\n\
\n\
Složená závorka `{` označuje začátek těla třídy a závorka `}` jeho konec. Všechny metody patřící do třídy musí být umístěny uvnitř těchto závorek.\n\
\n\
Samotná deklarace třídy neurčuje žádný pohyb robota. Vytváří pouze strukturu, do které můžeme zapisovat metody a jejich příkazy.\n\
\n\
# Metoda main\n\
Metoda `main` je hlavní metodou programu. V běžné struktuře Java programu představuje místo, odkud začíná vykonávání instrukcí.\n\
\n\
V našem prostředí se po spuštění programu vykonává kód umístěný uvnitř této metody. Příkazy se standardně provádějí postupně od prvního k poslednímu, pokud jejich pořadí nezmění například podmínka nebo cyklus.\n\
\n\
```java\n\
public static void main(String[] args) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Deklarace metody `main` obsahuje několik důležitých částí.\n\
\n\
`public` je modifikátor přístupu, který určuje, že metoda je veřejně přístupná. Díky tomu ji může spouštěcí prostředí vyvolat.\n\
\n\
`static` označuje statickou metodu. Znamená to, že metoda patří přímo třídě a k jejímu spuštění není nutné vytvářet objekt třídy `Main`.\n\
\n\
`void` je návratový typ metody. Udává, že metoda nevrací žádnou hodnotu. Metoda `main` tedy může vykonávat příkazy, ale jejím výsledkem není vrácená hodnota.\n\
\n\
`main` je název hlavní metody. Pro standardní vstupní bod programu musí být tento název zapsán přesně, včetně malých písmen.\n\
\n\
`String[] args` představuje parametr metody. Typ `String[]` označuje pole textových řetězců a `args` je název tohoto parametru. Při běžném spuštění Java programu může obsahovat argumenty předané při jeho startu. Při programování robota tento parametr zpravidla nepoužíváme, ale ponecháváme jej v předepsané deklaraci metody.\n\
\n\
Kulaté závorky `()` vymezují seznam parametrů metody. Složené závorky `{}` označují začátek a konec jejího těla.\n\
\n\
Všechny příkazy, které chceme po spuštění vykonat, zapisujeme mezi složené závorky metody `main`.\n\
\n\
# Jak spolu souvisí třída a metoda\n\
Třída `Main` a metoda `main` mají odlišnou úlohu. Třída vytváří základní strukturu programu, zatímco metoda obsahuje příkazy určené k vykonání.\n\
\n\
Metoda `main` musí být zapsána uvnitř třídy `Main`. Nelze ji umístit mimo tělo třídy, protože v Javě musí být metody deklarovány uvnitř tříd nebo jiných příslušných typů.\n\
\n\
```java\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        // Zde se zapisují příkazy programu\n\
\    }\n\
}\n\
```\n\
\n\
První otevírací složená závorka zahajuje tělo třídy `Main`. Druhá otevírací závorka zahajuje tělo metody `main`.\n\
\n\
První uzavírací závorka ukončuje metodu `main` a poslední uzavírací závorka ukončuje třídu `Main`. Každá otevírací závorka musí mít odpovídající uzavírací závorku.\n\
\n\
# Zápis a vykonávání příkazů\n\
Příkazy zapisujeme do těla metody `main`. Každý příkaz představuje určitou instrukci, kterou má program vykonat.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        move(Direction.RIGHT);\n\
\        move(Direction.RIGHT);\n\
\        move(Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
V uvedeném příkladu obsahuje metoda `main` tři příkazy. Program je postupně vykonává v pořadí, ve kterém jsou zapsány. Každý příkaz `move(Direction.RIGHT);` požaduje pohyb robota doprava. Skutečné provedení pohybu závisí na pravidlech a stavu konkrétní úrovně.\n\
\n\
Po dokončení všech příkazů metoda `main` skončí. Pokud program neobsahuje další vykonávané operace, jeho běh se ukončí.\n\
\n\
# Základní pravidla zápisu\n\
Java má přesně stanovená syntaktická pravidla, která je nutné dodržovat.\n\
\n\
Jednotlivé příkazy, například volání metody `move()`, ukončujeme středníkem `;`. Pokud středník chybí, může vzniknout syntaktická chyba, která zabrání překladu programu.\n\
\n\
Složené závorky `{}` vymezují těla tříd, metod a dalších bloků programu. Jejich správné umístění určuje strukturu programu.\n\
\n\
Kulaté závorky `()` používáme při deklarování a volání metod. Mohou obsahovat parametry nebo předávané argumenty.\n\
\n\
Java rozlišuje velká a malá písmena. Názvy `Main`, `main` a `MAIN` proto nejsou zaměnitelné.\n\
\n\
Odsazování kódu pomocí mezer zlepšuje přehlednost programu. Příkazy uvnitř metody by měly být odsazené tak, aby bylo jasné, do kterého bloku patří. Samotné odsazení však v Javě obvykle neurčuje strukturu programu, protože tu vymezují složené závorky.\n\
\n\
Řádky začínající `//` jsou jednořádkové komentáře. Slouží k vysvětlení programu a při jeho vykonávání se ignorují. Pro víceřádkový komentář lze použít zápis `/* komentář */`.\n\
\n\
# Pravidla konkrétní úrovně\n\
Každá úroveň může omezovat dostupné příkazy a programové konstrukce. Základní struktura třídy `Main` a metody `main` však zůstává stejná.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé popsané možnosti nemusí být v konkrétní lekci povolené. Vždy se řiďte zadáním aktuální úrovně.
