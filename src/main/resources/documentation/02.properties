content=# Co jsou datové typy\n\
Datový typ určuje, jaké hodnoty může proměnná uchovávat a jaké operace s nimi lze provádět. Java je staticky typovaný programovací jazyk, proto musí mít každá proměnná určený datový typ.\n\
\n\
Například celé číslo ukládáme pomocí typu `int`, desetinné číslo pomocí `double`, pravdivostní hodnotu pomocí `boolean` a text pomocí `String`.\n\
\n\
# Celá čísla – int\n\
Datový typ `int` slouží k ukládání celých čísel bez desetinné části. Může obsahovat kladná čísla, záporná čísla i nulu. Jeho rozsah je od -2 147 483 648 do 2 147 483 647.\n\
\n\
```java\n\
int x = 5;\n\
int y = -3;\n\
int pocetKroku = 10;\n\
```\n\
\n\
Klíčové slovo `int` určuje datový typ, následuje název proměnné a znak `=` přiřazuje hodnotu. Hodnotu proměnné lze později změnit.\n\
\n\
Při programování robota používáme `int` například k uchovávání souřadnic, počtu kroků nebo hodnot počítadel.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
int y = robotCoordinatesY();\n\
```\n\
\n\
# Desetinná čísla – double\n\
Datový typ `double` slouží k ukládání desetinných čísel. Používá se například při výpočtech, měření nebo práci s hodnotami, které nemusí být celými čísly.\n\
\n\
```java\n\
double rychlost = 2.5;\n\
double vzdalenost = 10.75;\n\
double prumer = 3.14;\n\
```\n\
\n\
V Javě se desetinná část zapisuje pomocí tečky, nikoliv čárky. Typ `double` pracuje s přibližnou reprezentací desetinných čísel, proto některé výpočty nemusí být zcela přesné.\n\
\n\
# Pravdivostní hodnoty – boolean\n\
Datový typ `boolean` uchovává jednu ze dvou hodnot: `true` (pravda) nebo `false` (nepravda). Používá se především při rozhodování, porovnávání hodnot a vyhodnocování podmínek.\n\
\n\
```java\n\
boolean hotovo = false;\n\
boolean splneno = true;\n\
boolean jeNaCili = false;\n\
```\n\
\n\
Hodnoty `true` a `false` se zapisují bez uvozovek. Proměnná typu `boolean` nemůže přímo obsahovat číslo ani text.\n\
\n\
Pravdivostní hodnotu můžeme získat také porovnáním dvou hodnot.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
boolean jeNaPozici = (x == 5);\n\
```\n\
\n\
Operátor `==` porovnává dvě hodnoty. Pokud je souřadnice X rovna číslu `5`, proměnná `jeNaPozici` bude obsahovat `true`. V opačném případě bude obsahovat `false`.\n\
\n\
# Jeden znak – char\n\
Datový typ `char` slouží k ukládání jednoho znaku. Může jít o písmeno, číslici, symbol nebo jiný znak reprezentovatelný jednou hodnotou `char`.\n\
\n\
```java\n\
char pismeno = 'A';\n\
char cislice = '5';\n\
char symbol = '#';\n\
```\n\
\n\
Hodnoty typu `char` zapisujeme mezi jednoduché apostrofy `' '`. Číslice uložená jako znak není číselnou hodnotou určenou přímo pro matematické výpočty.\n\
\n\
# Textové řetězce – String\n\
Typ `String` slouží k ukládání textu. Textový řetězec může obsahovat písmena, číslice, mezery i speciální znaky.\n\
\n\
```java\n\
String jmeno = "Robot";\n\
String zprava = "Ukol dokoncen";\n\
String oznaceni = "A12";\n\
```\n\
\n\
Textové hodnoty zapisujeme mezi dvojité uvozovky `" "`. Na rozdíl od typu `char` může `String` obsahovat více znaků nebo také prázdný text `""`.\n\
\n\
`String` není primitivní datový typ, ale referenční typ představující třídu pro práci s textovými řetězci.\n\
\n\
# Další číselné typy\n\
Java obsahuje také další primitivní číselné datové typy. Typy `byte`, `short` a `long` slouží k ukládání celých čísel s různými rozsahy. Typ `float` slouží podobně jako `double` k ukládání desetinných čísel, ale používá menší přesnost.\n\
\n\
```java\n\
byte maleCislo = 100;\n\
short stredniCislo = 30000;\n\
long velkeCislo = 5000000000L;\n\
float desetinneCislo = 2.5f;\n\
```\n\
\n\
Přípona `L` označuje celočíselný literál typu `long`. Přípona `f` označuje desetinný literál typu `float`. Při základním programování robota se nejčastěji setkáme s typem `int`.\n\
\n\
# Pole – int[]\n\
Pole umožňuje ukládat více hodnot stejného datového typu pod jedním názvem. Například `int[]` představuje pole celých čísel.\n\
\n\
```java\n\
int[] souradnice = {3, 5};\n\
int x = souradnice[0];\n\
int y = souradnice[1];\n\
```\n\
\n\
Jednotlivé prvky pole mají své indexy. V Javě začíná indexování od nuly, proto `souradnice[0]` představuje první hodnotu a `souradnice[1]` druhou hodnotu.\n\
\n\
Pole můžeme využít například k uchování cílových souřadnic robota.\n\
\n\
```java\n\
int[] cil = {4, 2};\n\
int cilX = cil[0];\n\
int cilY = cil[1];\n\
```\n\
\n\
# Datový typ Direction\n\
Robot API používá také typ `Direction`, který představuje směr pohybu robota. Nejedná se o základní primitivní datový typ Javy, ale o typ definovaný robotickým API.\n\
\n\
```java\n\
Direction smer = Direction.RIGHT;\n\
move(smer);\n\
```\n\
\n\
Proměnná `smer` uchovává hodnotu určující směr pohybu. Metodě `move()` ji můžeme předat jako argument.\n\
\n\
Dostupné hodnoty jsou `Direction.LEFT`, `Direction.RIGHT`, `Direction.TOP` a `Direction.DOWN`.\n\
\n\
# Proměnné a přiřazování hodnot\n\
Proměnná představuje pojmenované místo pro uchování hodnoty určitého datového typu. Při vytvoření proměnné uvádíme její datový typ a název.\n\
\n\
```java\n\
int pocet = 5;\n\
pocet = 10;\n\
```\n\
\n\
První řádek deklaruje proměnnou `pocet` a přiřazuje jí počáteční hodnotu `5`. Druhý řádek změní její hodnotu na `10`.\n\
\n\
Při změně hodnoty již datový typ znovu neuvádíme. Proměnné lze přiřadit pouze hodnotu, která je kompatibilní s jejím datovým typem.\n\
\n\
# Matematické operace\n\
S číselnými datovými typy můžeme provádět základní matematické operace. Java používá operátory `+` pro sčítání, `-` pro odčítání, `*` pro násobení, `/` pro dělení a `%` pro zbytek po dělení.\n\
\n\
```java\n\
int a = 10;\n\
int b = 3;\n\
int soucet = a + b;\n\
int rozdil = a - b;\n\
int soucin = a * b;\n\
int podil = a / b;\n\
int zbytek = a % b;\n\
```\n\
\n\
Při dělení dvou hodnot typu `int` je výsledkem celočíselné dělení. Například `10 / 3` vrátí hodnotu `3`, protože desetinná část se odstraní.\n\
\n\
Pokud potřebujeme desetinný výsledek, můžeme použít typ `double`.\n\
\n\
```java\n\
double vysledek = 10.0 / 3.0;\n\
```\n\
\n\
# Pravidla konkrétní úrovně\n\
Každá úroveň může povolovat pouze určité datové typy, proměnné nebo operace. Některé lekce mohou pracovat pouze s celými čísly, zatímco jiné mohou umožňovat také pravdivostní hodnoty, textové řetězce nebo pole.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.
