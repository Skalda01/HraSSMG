content=# Co jsou podmínky\n\
Podmínky umožňují programu rozhodovat, které příkazy se mají vykonat na základě určité situace. Díky podmínkám nemusí program vykonávat všechny příkazy postupně, ale může své chování přizpůsobit aktuálním hodnotám proměnných nebo poloze robota.\n\
\n\
Každá podmínka obsahuje výraz, jehož výsledkem je pravdivostní hodnota typu `boolean`. Výsledek může být `true` (pravda) nebo `false` (nepravda).\n\
\n\
Pokud je podmínka splněna, program vykoná příslušný blok příkazů. Pokud splněna není, tento blok přeskočí nebo pokračuje jinou větví programu.\n\
\n\
# Podmínka if\n\
Příkaz `if` představuje základní podmíněnou konstrukci jazyka Java. Umožňuje vykonat určitý blok kódu pouze v případě, že je zadaná podmínka pravdivá.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Klíčové slovo `if` označuje začátek podmínky. V kulatých závorkách `()` se nachází výraz, který program vyhodnotí.\n\
\n\
Pokud je hodnota proměnné `x` menší než `5`, podmínka bude mít hodnotu `true` a robot dostane příkaz k pohybu doprava.\n\
\n\
Pokud je hodnota `x` rovna `5` nebo je větší, podmínka bude mít hodnotu `false` a příkaz uvnitř bloku se nevykoná.\n\
\n\
Složené závorky `{}` vymezují blok příkazů, které patří k podmínce. Pokud podmínka není splněna, program přeskočí celý tento blok.\n\
\n\
# Více příkazů uvnitř if\n\
Podmínka `if` může obsahovat jeden nebo více příkazů. Pokud je splněna, vykonají se postupně všechny příkazy uvnitř jejího bloku.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 3) {\n\
\    move(Direction.RIGHT);\n\
\    move(Direction.RIGHT);\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Pokud je aktuální souřadnice X menší než `3`, program postupně vykoná dva příkazy pohybu doprava a jeden příkaz pohybu dolů.\n\
\n\
Pokud podmínka splněna není, nevykoná se žádný z těchto tří příkazů a program pokračuje za uzavírací závorkou bloku `if`.\n\
\n\
# Podmínka if a else\n\
Konstrukce `if` a `else` umožňuje programu rozhodovat mezi dvěma různými možnostmi.\n\
\n\
Blok `if` se vykoná, pokud je podmínka pravdivá. Blok `else` se vykoná, pokud je podmínka nepravdivá.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 5) {\n\
\    move(Direction.RIGHT);\n\
} else {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Program nejprve zjistí aktuální souřadnici X robota a porovná ji s číslem `5`.\n\
\n\
Pokud je souřadnice X menší než `5`, vykoná se příkaz `move(Direction.RIGHT);`.\n\
\n\
Pokud je souřadnice X rovna `5` nebo je větší, vykoná se příkaz `move(Direction.LEFT);`.\n\
\n\
Z těchto dvou bloků se při jednom vyhodnocení konstrukce vykoná vždy pouze jeden. Program nikdy nevykoná současně blok `if` i odpovídající blok `else`.\n\
\n\
Klíčové slovo `else` nemá vlastní podmínku. Představuje alternativní větev, která se vykoná tehdy, když předchozí podmínka `if` nebyla splněna.\n\
\n\
# Podmínka else if\n\
Konstrukce `else if` umožňuje postupně kontrolovat více různých podmínek. Používá se tehdy, když program potřebuje rozhodovat mezi více než dvěma možnostmi.\n\
\n\
V jazyce Java se zapisuje jako dvě samostatná klíčová slova `else if`. Zápis `elseif` nebo `elif` není v Javě platný.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 3) {\n\
\    move(Direction.RIGHT);\n\
} else if (x > 7) {\n\
\    move(Direction.LEFT);\n\
} else {\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Program nejprve vyhodnotí podmínku `x < 3`. Pokud je pravdivá, vykoná první blok a ostatní větve přeskočí.\n\
\n\
Pokud první podmínka není splněna, program přejde k podmínce `x > 7`.\n\
\n\
Jestliže je druhá podmínka pravdivá, vykoná příkaz pohybu doleva.\n\
\n\
Pokud není splněna ani jedna z předchozích podmínek, vykoná se blok `else`, který obsahuje příkaz pohybu dolů.\n\
\n\
Podmínky se vyhodnocují postupně shora dolů. Jakmile je nalezena první pravdivá podmínka, vykoná se její blok a zbývající větve stejné konstrukce se přeskočí.\n\
\n\
# Více podmínek else if\n\
V jedné podmíněné konstrukci můžeme použít libovolný počet větví `else if`. Každá větev obsahuje vlastní podmínku a blok příkazů.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x == 0) {\n\
\    move(Direction.RIGHT);\n\
} else if (x == 1) {\n\
\    move(Direction.DOWN);\n\
} else if (x == 2) {\n\
\    move(Direction.TOP);\n\
} else if (x == 3) {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Program postupně porovnává aktuální souřadnici X s hodnotami `0`, `1`, `2` a `3`.\n\
\n\
Pokud některá podmínka odpovídá aktuální hodnotě, vykoná se příslušný příkaz a další větve se již nevyhodnocují.\n\
\n\
Pokud není splněna žádná podmínka, nevykoná se žádný z uvedených pohybových příkazů.\n\
\n\
Závěrečná větev `else` není povinná. Konstrukce tedy může obsahovat pouze `if`, kombinaci `if` a `else if`, nebo také závěrečné `else`.\n\
\n\
# Porovnávací operátory\n\
Při vytváření podmínek používáme porovnávací operátory. Umožňují porovnat dvě hodnoty a zjistit, zda mezi nimi platí určitý vztah.\n\
\n\
Operátor `==` kontroluje, zda jsou dvě hodnoty stejné.\n\
\n\
Operátor `!=` kontroluje, zda jsou dvě hodnoty různé.\n\
\n\
Operátor `<` kontroluje, zda je levá hodnota menší než pravá.\n\
\n\
Operátor `>` kontroluje, zda je levá hodnota větší než pravá.\n\
\n\
Operátor `<=` kontroluje, zda je levá hodnota menší nebo rovna pravé.\n\
\n\
Operátor `>=` kontroluje, zda je levá hodnota větší nebo rovna pravé.\n\
\n\
```java\n\
int x = 5;\n\
\n\
boolean a = (x == 5);\n\
boolean b = (x != 3);\n\
boolean c = (x < 10);\n\
boolean d = (x > 7);\n\
boolean e = (x <= 5);\n\
boolean f = (x >= 6);\n\
```\n\
\n\
V uvedeném příkladu budou proměnné `a`, `b`, `c` a `e` obsahovat hodnotu `true`. Proměnné `d` a `f` budou obsahovat hodnotu `false`.\n\
\n\
Výsledkem každého porovnání je hodnota typu `boolean`, kterou můžeme přímo použít v podmínce `if` nebo `else if`.\n\
\n\
# Rozdíl mezi = a ==\n\
Při zapisování podmínek je důležité rozlišovat mezi operátory `=` a `==`.\n\
\n\
Jednoduché rovnítko `=` představuje přiřazení hodnoty do proměnné.\n\
\n\
Dvojité rovnítko `==` představuje porovnání dvou hodnot.\n\
\n\
```java\n\
int x = 5;\n\
\n\
if (x == 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Výraz `x == 5` ověřuje, zda proměnná `x` obsahuje hodnotu `5`.\n\
\n\
Pokud bychom místo porovnání napsali `if (x = 5)`, program by nebyl správný, protože přiřazení celé číselné hodnoty nevrací pravdivostní hodnotu požadovanou podmínkou `if`.\n\
\n\
# Logický operátor AND – &&\n\
Logický operátor `&&` znamená logické A. Umožňuje spojit dvě nebo více podmínek, které musí být splněny současně.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
int y = robotCoordinatesY();\n\
\n\
if (x < 5 && y < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Robot dostane příkaz k pohybu doprava pouze tehdy, pokud je souřadnice X menší než `5` a zároveň souřadnice Y menší než `5`.\n\
\n\
Pokud alespoň jedna z těchto podmínek není splněna, celý výraz bude mít hodnotu `false` a blok příkazů se nevykoná.\n\
\n\
Operátor `&&` používá zkrácené vyhodnocování. Pokud je první část nepravdivá, další část již není potřeba vyhodnocovat.\n\
\n\
# Logický operátor OR – ||\n\
Logický operátor `||` znamená logické NEBO. Celá podmínka je pravdivá, pokud je splněna alespoň jedna z jejích částí.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
int y = robotCoordinatesY();\n\
\n\
if (x == 0 || y == 0) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Příkaz se vykoná, pokud má souřadnice X hodnotu `0`, nebo pokud má souřadnice Y hodnotu `0`.\n\
\n\
Podmínka bude pravdivá také v případě, že jsou splněny obě části současně.\n\
\n\
Pokud není splněna ani jedna část, celý výraz bude mít hodnotu `false`.\n\
\n\
Také operátor `||` používá zkrácené vyhodnocování. Pokud je první část pravdivá, druhá část se již nemusí vyhodnocovat.\n\
\n\
# Logický operátor NOT – !\n\
Operátor `!` představuje logickou negaci. Obrací pravdivostní hodnotu podmínky.\n\
\n\
Pokud je původní výraz `true`, negace bude `false`. Pokud je původní výraz `false`, negace bude `true`.\n\
\n\
```java\n\
boolean hotovo = false;\n\
\n\
if (!hotovo) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Proměnná `hotovo` obsahuje hodnotu `false`. Výraz `!hotovo` proto bude mít hodnotu `true` a příkaz uvnitř podmínky se vykoná.\n\
\n\
Negaci můžeme použít také u složitějších výrazů.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (!(x == 5)) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Tato podmínka je pravdivá tehdy, když souřadnice X není rovna `5`. Stejnou podmínku lze jednodušeji zapsat pomocí operátoru `!=`.\n\
\n\
# Kombinace více podmínek\n\
Logické operátory lze kombinovat a vytvářet složitější rozhodovací výrazy.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
int y = robotCoordinatesY();\n\
\n\
if ((x >= 2 && x <= 6) && y == 3) {\n\
\    move(Direction.TOP);\n\
} else {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
První část podmínky ověřuje, zda se souřadnice X nachází v rozsahu od `2` do `6`, včetně obou hodnot.\n\
\n\
Druhá část kontroluje, zda je souřadnice Y rovna `3`.\n\
\n\
Pokud jsou splněny všechny požadavky, vykoná se příkaz pohybu nahoru. V opačném případě se vykoná příkaz pohybu doprava.\n\
\n\
Kulaté závorky používáme pro přehledné seskupení jednotlivých částí podmínky. Pomáhají určit pořadí vyhodnocování a zabraňují chybám při kombinování logických operátorů.\n\
\n\
# Vnořené podmínky\n\
Podmínky můžeme zapisovat také dovnitř jiných podmínek. Takové konstrukci říkáme vnořená podmínka.\n\
\n\
Vnitřní podmínka se vyhodnotí pouze tehdy, pokud se program dostane do bloku, ve kterém se nachází.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
int y = robotCoordinatesY();\n\
\n\
if (x < 5) {\n\
\    if (y < 3) {\n\
\        move(Direction.DOWN);\n\
\    } else {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
} else {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Program nejprve kontroluje, zda je souřadnice X menší než `5`.\n\
\n\
Pokud ano, vyhodnotí další podmínku, která kontroluje souřadnici Y. Pokud je Y menší než `3`, vykoná pohyb dolů. V opačném případě vykoná pohyb doprava.\n\
\n\
Pokud první podmínka `x < 5` není splněna, program vnitřní podmínku vůbec nevyhodnotí a přejde přímo do vnější větve `else`, která obsahuje pohyb doleva.\n\
\n\
Při vnořování podmínek je důležité správně používat složené závorky a odsazení, aby bylo jasné, ke které podmínce jednotlivé bloky patří.\n\
\n\
# Podmínky s proměnnou boolean\n\
Do podmínky `if` nemusíme zapisovat pouze porovnání čísel. Můžeme použít také proměnnou typu `boolean`.\n\
\n\
```java\n\
boolean pokracovat = true;\n\
\n\
if (pokracovat) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Protože proměnná `pokracovat` obsahuje hodnotu `true`, příkaz uvnitř podmínky se vykoná.\n\
\n\
Pokud by proměnná obsahovala hodnotu `false`, blok by se přeskočil.\n\
\n\
Podmínku není nutné zapisovat jako `if (pokracovat == true)`, protože samotná proměnná již obsahuje pravdivostní hodnotu.\n\
\n\
# Podmínky podle souřadnic robota\n\
Podmínky můžeme kombinovat s metodami `robotCoordinatesX()` a `robotCoordinatesY()`, které vracejí skutečnou aktuální polohu robota.\n\
\n\
Díky tomu může program rozhodovat o pohybu podle toho, kde se robot právě nachází.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 4) {\n\
\    move(Direction.RIGHT);\n\
} else if (x > 4) {\n\
\    move(Direction.LEFT);\n\
} else {\n\
\    // Robot je na souřadnici X = 4\n\
}\n\
```\n\
\n\
Program zjistí aktuální souřadnici X a porovná ji s cílovou hodnotou `4`.\n\
\n\
Pokud je X menší než `4`, požádá robota o pohyb doprava. Pokud je X větší než `4`, požádá o pohyb doleva.\n\
\n\
Pokud je X přesně rovno `4`, vykoná se větev `else`, která obsahuje pouze komentář, a robot se nepohne.\n\
\n\
Tento příklad ukazuje jednoduché rozhodování podle aktuální polohy. Podmínka se ale vyhodnotí pouze jednou, takže robot vykoná nejvýše jeden pohybový příkaz.\n\
\n\
# Podmínka se nevyhodnocuje opakovaně\n\
Samotný příkaz `if` není cyklus. Jeho podmínka se při průchodu danou konstrukcí vyhodnotí pouze jednou.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Pokud je souřadnice X menší než `5`, program vykoná jeden pohybový příkaz doprava.\n\
\n\
Po dokončení bloku se však automaticky nevrátí na začátek podmínky. Pokračuje následujícím příkazem za blokem `if`.\n\
\n\
Pro opakované vyhodnocování podmínky slouží cykly, například `while` nebo `for`, které jsou popsány v samostatné dokumentaci.\n\
\n\
# Pořadí podmínek\n\
U konstrukce `if`, `else if` a `else` je důležité pořadí jednotlivých větví. Program vykoná pouze první větev, jejíž podmínka je pravdivá.\n\
\n\
```java\n\
int x = 2;\n\
\n\
if (x < 10) {\n\
\    move(Direction.RIGHT);\n\
} else if (x < 5) {\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Přestože hodnota `x` splňuje obě podmínky, vykoná se pouze první větev `if`, protože výraz `x < 10` je pravdivý.\n\
\n\
Druhá podmínka `x < 5` se již nevyhodnotí.\n\
\n\
Proto je nutné při vytváření více větví pečlivě promyslet pořadí podmínek. Obvykle je vhodné zapisovat konkrétnější podmínky před obecnějšími, pokud by se jejich platnost mohla překrývat.\n\
\n\
# Samostatné podmínky if\n\
Více samostatných příkazů `if` se chová jinak než jedna konstrukce `if` s větvemi `else if`.\n\
\n\
```java\n\
int x = 2;\n\
\n\
if (x < 10) {\n\
\    move(Direction.RIGHT);\n\
}\n\
\n\
if (x < 5) {\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
V tomto případě se obě podmínky vyhodnocují nezávisle. Protože jsou obě pravdivé, program vykoná oba pohybové příkazy.\n\
\n\
U konstrukce s `else if` by se vykonal pouze blok první splněné podmínky.\n\
\n\
Samostatné podmínky `if` tedy používáme tehdy, když chceme jednotlivé situace kontrolovat nezávisle na sobě.\n\
\n\
# Nejčastější chyby při používání podmínek\n\
Jednou z častých chyb je použití operátoru `=` místo porovnávacího operátoru `==`. Při porovnávání dvou čísel je nutné použít dvojité rovnítko.\n\
\n\
Další chybou bývá nesprávný zápis `elseif`. V Javě musí být tato konstrukce zapsána jako `else if` se dvěma oddělenými klíčovými slovy.\n\
\n\
Problémy mohou vzniknout také při nesprávném umístění složených závorek. Každý blok musí být správně otevřen a uzavřen, jinak se může změnit význam programu nebo vzniknout syntaktická chyba.\n\
\n\
Podmínka v kulatých závorkách musí mít výsledek typu `boolean`. Nelze proto použít například samotné celé číslo `if (5)`, protože Java nepřevádí číselné hodnoty automaticky na pravdivostní hodnoty.\n\
\n\
Důležité je také správné pořadí větví `else if`. Pokud je první podmínka příliš obecná, mohou se pozdější větve stát nedosažitelnými pro zamýšlené hodnoty.\n\
\n\
Při práci se souřadnicemi je nutné pamatovat na to, že hodnota uložená v proměnné se po pohybu robota automaticky neaktualizuje. Pro získání nové polohy musíme metody `robotCoordinatesX()` a `robotCoordinatesY()` zavolat znovu.\n\
\n\
# Příklad kompletního programu\n\
Následující program kombinuje podmínky `if`, `else if` a `else` se zjišťováním souřadnic robota.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int x = robotCoordinatesX();\n\
\        int y = robotCoordinatesY();\n\
\n\
\        if (x < 3) {\n\
\            move(Direction.RIGHT);\n\
\        } else if (x > 3) {\n\
\            move(Direction.LEFT);\n\
\        } else if (y < 2) {\n\
\            move(Direction.DOWN);\n\
\        } else if (y > 2) {\n\
\            move(Direction.TOP);\n\
\        } else {\n\
\            // Robot je na souřadnicích [3, 2]\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
Program nejprve zjistí aktuální souřadnice robota a uloží je do proměnných `x` a `y`.\n\
\n\
Následně porovná souřadnici X s hodnotou `3`. Pokud je X menší, robot dostane příkaz k pohybu doprava. Pokud je větší, dostane příkaz k pohybu doleva.\n\
\n\
Pokud je X přesně rovno `3`, program začne kontrolovat souřadnici Y. Jestliže je Y menší než `2`, robot dostane příkaz k pohybu dolů. Pokud je větší než `2`, dostane příkaz k pohybu nahoru.\n\
\n\
Pokud se robot již nachází na souřadnicích `[3, 2]`, žádný pohybový příkaz se nevykoná.\n\
\n\
Program představuje jednoduché rozhodování směrem k cílové poloze. Protože se podmínky vyhodnotí pouze jednou, vykoná program nejvýše jeden pohyb. Zároveň automaticky neřeší případné překážky na trase.\n\
\n\
# Pravidla konkrétní úrovně\n\
Jednotlivé úrovně mohou omezovat používání podmínek, porovnávacích operátorů nebo logických výrazů. Některé lekce mohou povolovat pouze jednoduchou konstrukci `if`, zatímco jiné mohou umožňovat také `else`, `else if`, vnořené podmínky a kombinování více výrazů.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.