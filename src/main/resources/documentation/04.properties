content=# Co jsou cykly\n\
Cykly umožňují opakovaně vykonávat jeden nebo více příkazů bez nutnosti zapisovat stejný kód několikrát za sebou. Používají se například tehdy, když potřebujeme robota posunout o určitý počet políček, opakovat určitou činnost nebo vykonávat příkazy, dokud není splněna zadaná podmínka.\n\
\n\
V jazyce Java existují čtyři základní způsoby zápisu cyklů: `for`, `for-each`, `while` a `do-while`. Každý z nich má odlišný způsob řízení opakování a používá se v jiných situacích.\n\
\n\
Tělo cyklu představuje blok příkazů, který se během vykonávání programu opakuje. Jeden průchod tímto blokem se nazývá iterace.\n\
\n\
V editoru lze přes Ctrl+mezerník vložit šablony `for`, `while`, `do` a `foreach`. Zkratka `do` vloží celý cyklus do-while včetně koncového středníku. Zkratka `foreach` vloží platný Java zápis `for (int hodnota : pole)`.\n\
V algoritmických levelech canvas sleduje také prvky čtené cyklem for-each. V lekcích s omezenými konstrukcemi povolení `for` zahrnuje i for-each; pro do-while musí být povolena obě klíčová slova `do` a `while`.\n\
\n\
# Cyklus for\n\
Cyklus `for` se používá především tehdy, když předem víme, kolikrát chceme určitou část programu opakovat.\n\
\n\
Obsahuje počáteční nastavení, podmínku pokračování a výraz, který se vykonává po každé dokončené iteraci.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Tento cyklus vykoná příkaz `move(Direction.RIGHT);` celkem pětkrát. Pokud jsou všechny pohyby úspěšné, robot se posune o pět políček doprava.\n\
\n\
Proměnná `i` slouží jako počítadlo cyklu. Při každé iteraci se její hodnota zvýší o jedna, dokud přestane platit podmínka `i < 5`.\n\
\n\
# Struktura cyklu for\n\
Základní syntaxe cyklu `for` obsahuje tři části oddělené středníky.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    // Opakované příkazy\n\
}\n\
```\n\
\n\
První část `int i = 0` představuje inicializaci počítadla. Vytvoří celočíselnou proměnnou `i` a nastaví její počáteční hodnotu na `0`. Inicializace proběhne pouze jednou při vstupu do cyklu.\n\
\n\
Druhá část `i < 5` představuje podmínku pokračování. Před každou iterací program zkontroluje, zda je podmínka pravdivá. Pokud má hodnotu `true`, vykoná se tělo cyklu. Pokud má hodnotu `false`, cyklus skončí.\n\
\n\
Třetí část `i++` představuje aktualizaci počítadla. Výraz `i++` zvýší hodnotu proměnné `i` o jedna a vykonává se po dokončení každé běžné iterace.\n\
\n\
Složené závorky `{}` vymezují tělo cyklu. Příkazy uvnitř tohoto bloku se vykonávají opakovaně podle uvedených pravidel.\n\
\n\
# Postup vykonávání cyklu for\n\
Podívejme se na cyklus se třemi opakováními.\n\
\n\
```java\n\
for (int i = 0; i < 3; i++) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Na začátku se vytvoří proměnná `i` s hodnotou `0`. Program ověří podmínku `0 < 3`, která je pravdivá, a vykoná první pohyb doprava.\n\
\n\
Potom se hodnota `i` zvýší na `1`. Podmínka `1 < 3` je stále pravdivá, proto se vykoná druhý pohyb doprava.\n\
\n\
Při hodnotě `i = 2` je podmínka opět pravdivá a vykoná se třetí pohyb doprava.\n\
\n\
Po zvýšení počítadla na `3` už podmínka `3 < 3` neplatí. Cyklus se ukončí a program pokračuje za jeho tělem.\n\
\n\
Cyklus tedy proběhne pro hodnoty `0`, `1` a `2`, celkem třikrát.\n\
\n\
# Počítadlo cyklu\n\
Počítadlo je proměnná, která sleduje průběh cyklu. Nejčastěji se používají názvy `i`, `j` nebo `k`, ale můžeme zvolit také vlastní název.\n\
\n\
```java\n\
for (int krok = 0; krok < 4; krok++) {\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
V tomto příkladu se počítadlo jmenuje `krok`. Jeho hodnota začíná na nule a po každém průchodu se zvýší o jedna.\n\
\n\
Cyklus vykoná čtyři pohybové příkazy dolů.\n\
\n\
Pokud počítadlo deklarujeme přímo v záhlaví cyklu pomocí `int`, je dostupné pouze v příslušné oblasti platnosti tohoto cyklu. Po jeho skončení ho běžně nemůžeme používat mimo cyklus.\n\
\n\
# Zvyšování a snižování počítadla\n\
Počítadlo se nemusí vždy zvyšovat pouze o jedna. Můžeme použít různé způsoby aktualizace jeho hodnoty.\n\
\n\
Operátor `i++` zvyšuje hodnotu o jedna. Operátor `i--` ji naopak snižuje o jedna.\n\
\n\
Zápis `i += 2` zvyšuje hodnotu o dvě a zápis `i -= 2` ji snižuje o dvě.\n\
\n\
```java\n\
for (int i = 5; i > 0; i--) {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Počítadlo začíná na hodnotě `5` a postupně se snižuje až k hodnotě `1`. Cyklus proto vykoná pět pohybových příkazů doleva.\n\
\n\
```java\n\
for (int i = 0; i < 10; i += 2) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Ve druhém příkladu nabývá počítadlo postupně hodnot `0`, `2`, `4`, `6` a `8`. Cyklus tedy proběhne pětkrát, nikoliv desetkrát.\n\
\n\
# Více příkazů v cyklu for\n\
Tělo cyklu může obsahovat několik různých příkazů. Při každé iteraci se vykonají postupně v pořadí, v jakém jsou zapsány.\n\
\n\
```java\n\
for (int i = 0; i < 3; i++) {\n\
\    move(Direction.RIGHT);\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Při jednom průchodu se robot pokusí posunout o jedno políčko doprava a následně o jedno políčko dolů.\n\
\n\
Protože cyklus proběhne třikrát, vykoná celkem šest pohybových příkazů. Pokud jsou všechny pohyby úspěšné, robot se od počáteční polohy posune o tři políčka doprava a tři políčka dolů.\n\
\n\
# Cyklus for s proměnnou\n\
Počet opakování nemusí být zapsán přímo jako číslo v podmínce cyklu. Můžeme použít také hodnotu uloženou v proměnné.\n\
\n\
```java\n\
int pocetKroku = 4;\n\
\n\
for (int i = 0; i < pocetKroku; i++) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Proměnná `pocetKroku` určuje, kolikrát se má tělo cyklu vykonat. V tomto případě proběhnou čtyři iterace.\n\
\n\
Výhodou je, že požadovaný počet opakování můžeme změnit úpravou jediné hodnoty.\n\
\n\
# Cyklus for-each\n\
Cyklus `for-each` představuje zjednodušený způsob postupného procházení prvků pole nebo jiné podporované kolekce.\n\
\n\
Na rozdíl od běžného cyklu `for` nemusíme ručně vytvářet a aktualizovat číselné počítadlo. Cyklus postupně získává jednotlivé hodnoty ze zadaného pole nebo kolekce.\n\
\n\
V Javě se tato konstrukce označuje také jako rozšířený cyklus `for`, anglicky *enhanced for loop*.\n\
\n\
```java\n\
int[] hodnoty = {1, 2, 3, 4};\n\
\n\
for (int hodnota : hodnoty) {\n\
\    int vysledek = hodnota * 2;\n\
}\n\
```\n\
\n\
Pole `hodnoty` obsahuje čtyři celá čísla. Cyklus postupně přiřazuje jednotlivé prvky do proměnné `hodnota`.\n\
\n\
Při první iteraci bude mít proměnná hodnotu `1`, při druhé `2`, při třetí `3` a při čtvrté `4`.\n\
\n\
V každé iteraci se aktuální hodnota vynásobí dvěma a výsledek se uloží do lokální proměnné `vysledek`.\n\
\n\
# Struktura cyklu for-each\n\
Zápis cyklu `for-each` obsahuje deklaraci proměnné, dvojtečku a pole nebo kolekci, kterou chceme procházet.\n\
\n\
```java\n\
for (int cislo : hodnoty) {\n\
\    // Práce s aktuálním prvkem\n\
}\n\
```\n\
\n\
Klíčové slovo `for` označuje začátek cyklu.\n\
\n\
`int` představuje datový typ jednotlivých prvků pole.\n\
\n\
`cislo` je proměnná, do které se při každé iteraci uloží aktuální prvek.\n\
\n\
Dvojtečka `:` odděluje proměnnou od zdroje procházených hodnot.\n\
\n\
`hodnoty` představuje pole nebo kolekci, jejíž prvky chceme postupně zpracovat.\n\
\n\
Cyklus se standardně vykoná jednou pro každý prvek. Pokud pole neobsahuje žádné prvky, tělo cyklu se nevykoná ani jednou.\n\
\n\
# For-each při ovládání robota\n\
Cyklus `for-each` můžeme využít například k postupnému vykonávání předem připravených směrů pohybu.\n\
\n\
```java\n\
Direction[] trasa = {\n\
\    Direction.RIGHT,\n\
\    Direction.RIGHT,\n\
\    Direction.DOWN,\n\
\    Direction.LEFT\n\
};\n\
\n\
for (Direction smer : trasa) {\n\
\    move(smer);\n\
}\n\
```\n\
\n\
Pole `trasa` obsahuje čtyři směry pohybu. Cyklus je postupně prochází a každý směr předává metodě `move()`.\n\
\n\
Robot tak dostává příkazy v pořadí doprava, doprava, dolů a doleva.\n\
\n\
Pokud jsou všechny pohyby úspěšné, robot se nakonec nachází o jedno políčko doprava a jedno políčko dolů od počáteční polohy.\n\
\n\
# Rozdíl mezi for a for-each\n\
Cyklus `for` je vhodný především tehdy, když potřebujeme přesně řídit počet opakování, používat počítadlo nebo přistupovat k prvkům pole pomocí indexů.\n\
\n\
Cyklus `for-each` je vhodný tehdy, když potřebujeme postupně zpracovat všechny prvky pole nebo kolekce a nepotřebujeme jejich indexy.\n\
\n\
```java\n\
int[] cisla = {2, 4, 6};\n\
\n\
for (int i = 0; i < cisla.length; i++) {\n\
\    int hodnota = cisla[i];\n\
}\n\
```\n\
\n\
Tento klasický cyklus `for` používá proměnnou `i` jako index pole. Vlastnost `length` udává počet prvků pole.\n\
\n\
```java\n\
int[] cisla = {2, 4, 6};\n\
\n\
for (int hodnota : cisla) {\n\
\    // Zpracování hodnoty\n\
}\n\
```\n\
\n\
Druhý příklad používá `for-each` a získává přímo jednotlivé hodnoty bez práce s indexy.\n\
\n\
# Cyklus while\n\
Cyklus `while` opakuje příkazy tak dlouho, dokud je zadaná podmínka pravdivá.\n\
\n\
Používá se především v situacích, kdy předem nevíme přesný počet opakování, ale známe podmínku, která musí platit pro pokračování cyklu.\n\
\n\
```java\n\
while (robotCoordinatesX() < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Program před každou iterací zjistí aktuální souřadnici X robota a ověří, zda je menší než `5`.\n\
\n\
Pokud podmínka platí, vykoná se příkaz pohybu doprava. Následně se program vrátí na začátek cyklu a podmínku znovu vyhodnotí.\n\
\n\
Jakmile souřadnice X dosáhne hodnoty `5` nebo vyšší, podmínka přestane platit a cyklus skončí.\n\
\n\
Tento příklad předpokládá, že robot může postupovat doprava. Pokud pohybu brání překážka a souřadnice se nemění, podmínka může zůstat stále pravdivá.\n\
\n\
# Struktura cyklu while\n\
Cyklus `while` obsahuje klíčové slovo `while`, podmínku v kulatých závorkách a tělo cyklu ve složených závorkách.\n\
\n\
```java\n\
while (podminka) {\n\
\    // Opakované příkazy\n\
}\n\
```\n\
\n\
Podmínka musí být výrazem s výsledkem typu `boolean`. Může obsahovat porovnávání čísel, logické operátory nebo přímo pravdivostní proměnnou.\n\
\n\
Program vždy nejprve vyhodnotí podmínku. Pokud je `true`, vykoná tělo cyklu. Po jeho dokončení se vrátí na začátek a podmínku zkontroluje znovu.\n\
\n\
Pokud je podmínka `false`, cyklus se ukončí a program pokračuje následujícím příkazem.\n\
\n\
# Cyklus while s počítadlem\n\
Cyklus `while` můžeme použít také pro opakování předem určeného počtu příkazů.\n\
\n\
```java\n\
int i = 0;\n\
\n\
while (i < 4) {\n\
\    move(Direction.DOWN);\n\
\    i++;\n\
}\n\
```\n\
\n\
Nejprve vytvoříme proměnnou `i` s hodnotou `0`.\n\
\n\
Před každou iterací program ověří, zda je její hodnota menší než `4`. Pokud ano, vykoná pohyb dolů a zvýší počítadlo o jedna.\n\
\n\
Jakmile počítadlo dosáhne hodnoty `4`, podmínka přestane platit a cyklus skončí.\n\
\n\
Výsledkem jsou čtyři vykonání příkazu `move(Direction.DOWN);`.\n\
\n\
# Aktualizace podmínky ve while\n\
U cyklu `while` je velmi důležité, aby se hodnoty ovlivňující podmínku mohly během opakování měnit.\n\
\n\
```java\n\
int pocet = 0;\n\
\n\
while (pocet < 3) {\n\
\    move(Direction.RIGHT);\n\
\    pocet++;\n\
}\n\
```\n\
\n\
Proměnná `pocet` se během každé iterace zvýší, a cyklus proto může po třech průchodech skončit.\n\
\n\
Pokud bychom příkaz `pocet++;` odstranili, proměnná by zůstávala na hodnotě `0` a podmínka `pocet < 3` by byla stále pravdivá.\n\
\n\
Vznikl by nekonečný cyklus, protože by nebyla splněna podmínka potřebná k jeho ukončení.\n\
\n\
# Zjišťování aktuální polohy v cyklu\n\
Při práci s pohybem robota je důležité správně aktualizovat souřadnice používané v podmínkách.\n\
\n\
```java\n\
while (robotCoordinatesX() < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
V tomto příkladu se metoda `robotCoordinatesX()` volá při každém vyhodnocení podmínky. Program proto pracuje se skutečnou aktuální polohou robota.\n\
\n\
Pokud však souřadnici uložíme před cyklem do proměnné a její hodnotu neaktualizujeme, může vzniknout problém.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
while (x < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Tento zápis je problematický. Proměnná `x` se uvnitř cyklu nemění, a proto podmínka stále používá původní souřadnici.\n\
\n\
Pokud byla počáteční hodnota X menší než `5`, podmínka zůstane pravdivá bez ohledu na skutečný pohyb robota.\n\
\n\
Správnou variantou je znovu zjišťovat aktuální souřadnice nebo odpovídajícím způsobem aktualizovat proměnnou.\n\
\n\
# Cyklus do-while\n\
Cyklus `do-while` je podobný cyklu `while`, ale liší se pořadím vyhodnocování podmínky.\n\
\n\
U cyklu `while` se podmínka kontroluje před vykonáním těla. U cyklu `do-while` se tělo vykoná nejprve a podmínka se kontroluje až na jeho konci.\n\
\n\
To znamená, že tělo cyklu `do-while` se vykoná vždy alespoň jednou, i když je podmínka od začátku nepravdivá.\n\
\n\
```java\n\
int i = 0;\n\
\n\
do {\n\
\    move(Direction.RIGHT);\n\
\    i++;\n\
} while (i < 3);\n\
```\n\
\n\
V tomto příkladu se příkaz pohybu doprava vykoná třikrát.\n\
\n\
Nejprve proběhne tělo cyklu, následně se zvýší počítadlo a potom se vyhodnotí podmínka `i < 3`.\n\
\n\
Pokud podmínka platí, cyklus se opakuje. Pokud neplatí, jeho vykonávání skončí.\n\
\n\
# Struktura cyklu do-while\n\
Cyklus `do-while` začíná klíčovým slovem `do`, za kterým následuje tělo cyklu.\n\
\n\
Podmínka je umístěna až za uzavírací složenou závorkou a zapisuje se pomocí klíčového slova `while`.\n\
\n\
```java\n\
do {\n\
\    // Opakované příkazy\n\
} while (podminka);\n\
```\n\
\n\
`do` označuje začátek bloku, který se má vykonat.\n\
\n\
Složené závorky `{}` vymezují tělo cyklu.\n\
\n\
`while` označuje podmínku, která rozhoduje o dalším opakování.\n\
\n\
Podmínka musí mít výsledek typu `boolean`.\n\
\n\
Na rozdíl od cyklů `for` a `while` se za závěrečnou podmínkou cyklu `do-while` zapisuje středník `;`.\n\
\n\
# Rozdíl mezi while a do-while\n\
Zásadním rozdílem je okamžik, kdy se kontroluje podmínka pokračování.\n\
\n\
```java\n\
int i = 10;\n\
\n\
while (i < 5) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Podmínka `10 < 5` je nepravdivá. Tělo cyklu `while` se proto nevykoná ani jednou.\n\
\n\
```java\n\
int i = 10;\n\
\n\
do {\n\
\    move(Direction.RIGHT);\n\
} while (i < 5);\n\
```\n\
\n\
U cyklu `do-while` se nejprve vykoná jeden pohybový příkaz. Až potom program zjistí, že podmínka `10 < 5` není splněna, a cyklus ukončí.\n\
\n\
Cyklus `while` tedy může mít nula iterací, zatímco `do-while` má vždy alespoň jednu iteraci, pokud běh programu není předčasně přerušen.\n\
\n\
# Do-while při ovládání robota\n\
Cyklus `do-while` můžeme použít tehdy, když chceme nejprve vykonat určitý pohyb a následně rozhodnout, zda jej máme opakovat.\n\
\n\
```java\n\
int pocet = 0;\n\
\n\
do {\n\
\    move(Direction.DOWN);\n\
\    pocet++;\n\
} while (pocet < 4);\n\
```\n\
\n\
Robot postupně dostane čtyři příkazy k pohybu dolů.\n\
\n\
Po každém pohybovém příkazu se zvýší počítadlo `pocet`. Jakmile dosáhne hodnoty `4`, podmínka přestane platit a cyklus skončí.\n\
\n\
V tomto případě bychom mohli použít také `for` nebo `while`. Výběr cyklu závisí především na tom, zda potřebujeme kontrolovat podmínku před vykonáním příkazů, nebo až po něm.\n\
\n\
# Příkaz break\n\
Příkaz `break` umožňuje předčasně ukončit vykonávání cyklu bez ohledu na jeho běžnou podmínku pokračování.\n\
\n\
Používá se například tehdy, když během opakování zjistíme, že již není potřeba vykonávat další iterace.\n\
\n\
```java\n\
for (int i = 0; i < 10; i++) {\n\
\    if (i == 4) {\n\
\        break;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Cyklus by za běžných okolností mohl proběhnout desetkrát. Jakmile však počítadlo dosáhne hodnoty `4`, podmínka `i == 4` bude pravdivá a vykoná se příkaz `break;`.\n\
\n\
Cyklus se okamžitě ukončí. Proto se příkaz pohybu doprava vykoná pouze čtyřikrát.\n\
\n\
Program následně pokračuje prvním příkazem za ukončeným cyklem.\n\
\n\
Příkaz `break` ukončuje nejbližší obklopující cyklus nebo konstrukci `switch`, pokud není použit označený příkaz `break`.\n\
\n\
# Příkaz continue\n\
Příkaz `continue` přeskočí zbývající příkazy aktuální iterace a pokračuje další iterací cyklu, pokud jeho podmínky umožňují pokračování.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    if (i == 2) {\n\
\        continue;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Cyklus postupně pracuje s hodnotami počítadla od `0` do `4`.\n\
\n\
Jakmile počítadlo dosáhne hodnoty `2`, vykoná se `continue;`. Zbývající část aktuální iterace se přeskočí a pohybový příkaz se v tomto průchodu nevykoná.\n\
\n\
Při ostatních hodnotách počítadla se pohybový příkaz vykoná. Celkově tedy dojde ke čtyřem voláním metody `move()`.\n\
\n\
Na rozdíl od příkazu `break` neukončuje `continue` celý cyklus, ale pouze aktuální iteraci.\n\
\n\
# Vnořené cykly\n\
Cyklus můžeme zapsat také dovnitř jiného cyklu. Takové konstrukci říkáme vnořený cyklus.\n\
\n\
Vnější cyklus řídí hlavní opakování, zatímco vnitřní cyklus vykonává vlastní sérii opakovaných příkazů.\n\
\n\
```java\n\
for (int i = 0; i < 3; i++) {\n\
\    for (int j = 0; j < 2; j++) {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Vnější cyklus proběhne třikrát. Při každé jeho iteraci se nejprve spustí vnitřní cyklus, který vykoná dva pohybové příkazy doprava.\n\
\n\
Po dokončení vnitřního cyklu se vykoná jeden pohyb dolů a poté začne další iterace vnějšího cyklu.\n\
\n\
Celkově program vykoná šest příkazů pohybu doprava a tři příkazy pohybu dolů.\n\
\n\
Pokud jsou všechny pohyby úspěšné, robot skončí o šest políček doprava a tři políčka dolů od své počáteční polohy.\n\
\n\
# Kombinace cyklů a podmínek\n\
Uvnitř cyklu můžeme používat také konstrukce `if`, `else if` a `else`.\n\
\n\
Díky tomu může program při každé iteraci rozhodovat, který příkaz se má vykonat.\n\
\n\
```java\n\
for (int i = 0; i < 6; i++) {\n\
\    if (i < 3) {\n\
\        move(Direction.RIGHT);\n\
\    } else {\n\
\        move(Direction.DOWN);\n\
\    }\n\
}\n\
```\n\
\n\
Cyklus proběhne celkem šestkrát. Při prvních třech iteracích, kdy má počítadlo hodnoty `0`, `1` a `2`, se vykoná pohyb doprava.\n\
\n\
Při zbývajících třech iteracích se vykoná pohyb dolů.\n\
\n\
Kombinování cyklů a podmínek umožňuje vytvářet složitější programy, které opakovaně vykonávají příkazy podle aktuálních hodnot a situace.\n\
\n\
# Nekonečné cykly\n\
Nekonečný cyklus vznikne tehdy, když se jeho podmínka nikdy nezmění na `false` a vykonávání není ukončeno jiným způsobem.\n\
\n\
Typickým příkladem je cyklus `while (true)`.\n\
\n\
```java\n\
while (true) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Podmínka `true` je vždy pravdivá. Cyklus proto nemá vlastní podmínku ukončení a bude se pokoušet opakovat pohybový příkaz neomezeně dlouho, pokud běh nepřeruší prostředí, chyba nebo jiný mechanismus.\n\
\n\
Nekonečný cyklus může vzniknout také omylem, například pokud zapomeneme aktualizovat počítadlo nebo opakovaně kontrolujeme hodnotu, která se nemění.\n\
\n\
Při programování robota je důležité počítat také s překážkami. Pokud cyklus čeká na změnu souřadnic, ale robot nemůže vykonat požadovaný pohyb, podmínka může zůstat pravdivá a cyklus nemusí skončit.\n\
\n\
# Výběr vhodného cyklu\n\
Cyklus `for` používáme především tehdy, když chceme opakovat příkazy určitý početkrát nebo potřebujeme pracovat s počítadlem.\n\
\n\
Cyklus `for-each` používáme, když chceme postupně projít hodnoty uložené v poli nebo kolekci.\n\
\n\
Cyklus `while` používáme, když chceme příkazy vykonávat tak dlouho, dokud platí určitá podmínka. Podmínka se kontroluje ještě před prvním průchodem.\n\
\n\
Cyklus `do-while` používáme, když požadujeme alespoň jedno vykonání těla cyklu a teprve následně chceme kontrolovat podmínku pokračování.\n\
\n\
Všechny tyto konstrukce umožňují opakování příkazů, ale liší se způsobem řízení jednotlivých iterací.\n\
\n\
# Nejčastější chyby při používání cyklů\n\
Častou chybou je nesprávně nastavená podmínka pokračování. Pokud například použijeme `i <= 5` místo `i < 5` při počáteční hodnotě `i = 0`, cyklus proběhne šestkrát místo pěti.\n\
\n\
Dalším problémem je zapomenutá aktualizace počítadla. Především u cyklů `while` a `do-while` může tato chyba způsobit nekonečné opakování.\n\
\n\
Při práci se souřadnicemi může nastat problém, pokud si program uloží polohu robota pouze před cyklem a během opakování ji již neaktualizuje.\n\
\n\
U cyklu `for-each` je nutné správně určit datový typ prvků a používat pole nebo jiný objekt podporující tento způsob průchodu.\n\
\n\
U konstrukce `do-while` je častou syntaktickou chybou vynechání středníku za závěrečnou podmínkou.\n\
\n\
Při použití vnořených cyklů je důležité správné umístění složených závorek. Nesprávně uzavřený blok může změnit počet opakování nebo způsobit chybu při překladu programu.\n\
\n\
Při ovládání robota je navíc nutné ověřit, zda opakované pohyby nevedou mimo hranice skladu nebo do překážek. Samotný cyklus žádné překážky automaticky neobchází.\n\
\n\
# Příklad kompletního programu\n\
Následující program ukazuje použití cyklu `for`, `for-each`, `while` a `do-while` v jednom programu.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\n\
\        // Cyklus for\n\
\        for (int i = 0; i < 3; i++) {\n\
\            move(Direction.RIGHT);\n\
\        }\n\
\n\
\        // Cyklus for-each\n\
\        Direction[] smery = {\n\
\            Direction.DOWN,\n\
\            Direction.DOWN\n\
\        };\n\
\n\
\        for (Direction smer : smery) {\n\
\            move(smer);\n\
\        }\n\
\n\
\        // Cyklus while\n\
\        int pocet = 0;\n\
\n\
\        while (pocet < 2) {\n\
\            move(Direction.LEFT);\n\
\            pocet++;\n\
\        }\n\
\n\
\        // Cyklus do-while\n\
\        int krok = 0;\n\
\n\
\        do {\n\
\            move(Direction.TOP);\n\
\            krok++;\n\
\        } while (krok < 2);\n\
\    }\n\
}\n\
```\n\
\n\
Program nejprve vykoná cyklus `for`, který třikrát požádá robota o pohyb doprava.\n\
\n\
Následně vytvoří pole `smery`, které obsahuje dva směry dolů. Cyklus `for-each` postupně projde oba prvky pole a předá je metodě `move()`.\n\
\n\
Potom cyklus `while` pomocí počítadla vykoná dva pohybové příkazy doleva.\n\
\n\
Nakonec cyklus `do-while` vykoná dva pohybové příkazy nahoru. Jeho podmínka se kontroluje vždy až po dokončení těla cyklu.\n\
\n\
Pokud robot začíná na souřadnicích `[0, 0]` a všechny pohyby jsou možné, bude jeho konečná poloha `[1, 0]`.\n\
\n\
Tento příklad ukazuje, že stejný program může kombinovat různé typy cyklů. Každý cyklus má vlastní pravidla opakování, ale všechny mohou vykonávat příkazy Robot API.\n\
\n\
# Pravidla konkrétní úrovně\n\
Jednotlivé úrovně mohou omezovat používání cyklů, počítadel, polí nebo příkazů `break` a `continue`.\n\
\n\
Některé lekce mohou povolovat pouze cyklus `for`, zatímco jiné mohou umožňovat také `for-each`, `while`, `do-while`, vnořené cykly a kombinování cyklů s podmínkami.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.
