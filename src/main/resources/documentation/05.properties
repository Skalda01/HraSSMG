content=# Co je switch\n\
Konstrukce `switch` umožňuje programu rozhodovat mezi několika možnostmi na základě hodnoty určitého výrazu. Používá se především tehdy, když potřebujeme porovnat jednu hodnotu s několika konkrétními možnostmi a podle výsledku vykonat odpovídající příkazy.\n\
\n\
Podobně jako podmínky `if`, `else if` a `else` umožňuje `switch` měnit průběh programu. Rozdíl spočívá především ve způsobu zápisu a vyhodnocování jednotlivých možností.\n\
\n\
Namísto několika samostatných porovnání můžeme použít jednu konstrukci `switch`, která obsahuje jednotlivé větve označené klíčovým slovem `case`.\n\
\n\
# Základní zápis switch\n\
Konstrukce `switch` obsahuje výraz, jehož hodnota se vyhodnotí, a jednotlivé větve `case`, které určují, jaké příkazy se mají vykonat.\n\
\n\
```java\n\
int smer = 2;\n\
\n\
switch (smer) {\n\
\    case 1:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 3:\n\
\        move(Direction.TOP);\n\
\        break;\n\
\    case 4:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
}\n\
```\n\
\n\
Program nejprve zjistí hodnotu proměnné `smer`. Protože proměnná obsahuje číslo `2`, vybere odpovídající větev `case 2:`.\n\
\n\
Následně vykoná příkaz `move(Direction.RIGHT);` a poté příkaz `break;`, který ukončí celou konstrukci `switch`.\n\
\n\
Ostatní větve se již nevykonají.\n\
\n\
# Struktura konstrukce switch\n\
Základní konstrukce `switch` se skládá z několika částí, které společně umožňují výběr odpovídající větve programu.\n\
\n\
```java\n\
switch (hodnota) {\n\
\    case 1:\n\
\        // Příkazy pro hodnotu 1\n\
\        break;\n\
\    case 2:\n\
\        // Příkazy pro hodnotu 2\n\
\        break;\n\
\    default:\n\
\        // Příkazy pro ostatní hodnoty\n\
}\n\
```\n\
\n\
`switch` je klíčové slovo jazyka Java, které označuje začátek rozhodovací konstrukce.\n\
\n\
Kulaté závorky `()` obsahují výraz, jehož hodnota se použije pro výběr větve.\n\
\n\
`case` označuje jednu konkrétní možnost. Za tímto klíčovým slovem následuje hodnota, se kterou se porovnává výsledek výrazu `switch`.\n\
\n\
Dvojtečka `:` označuje začátek příslušné větve v klasickém zápisu konstrukce `switch`.\n\
\n\
`break` slouží k okamžitému ukončení vykonávání konstrukce `switch`.\n\
\n\
`default` představuje výchozí větev, která se použije v případě, že žádná z uvedených hodnot `case` neodpovídá vyhodnocovanému výrazu.\n\
\n\
Složené závorky `{}` vymezují tělo celé konstrukce `switch`.\n\
\n\
# Větve case\n\
Klíčové slovo `case` označuje konkrétní hodnotu, pro kterou chceme vykonat určitou skupinu příkazů.\n\
\n\
Každá větev může obsahovat jeden nebo více příkazů.\n\
\n\
```java\n\
int hodnota = 3;\n\
\n\
switch (hodnota) {\n\
\    case 1:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 3:\n\
\        move(Direction.TOP);\n\
\        move(Direction.TOP);\n\
\        break;\n\
}\n\
```\n\
\n\
Protože proměnná `hodnota` obsahuje číslo `3`, program začne vykonávat příkazy ve větvi `case 3:`.\n\
\n\
Tato větev obsahuje dva pohybové příkazy nahoru. Pokud jsou oba pohyby možné, robot se posune o dvě políčka nahoru.\n\
\n\
Příkaz `break;` následně ukončí konstrukci `switch` a program pokračuje za její uzavírací závorkou.\n\
\n\
Hodnoty jednotlivých větví musí být kompatibilní s typem výrazu `switch` a musí splňovat pravidla konstantních hodnot příslušné varianty konstrukce.\n\
\n\
# Výchozí větev default\n\
Klíčové slovo `default` označuje větev, která se použije tehdy, když žádná hodnota uvedená za `case` neodpovídá vyhodnocovanému výrazu.\n\
\n\
Funguje podobně jako závěrečná větev `else` u podmíněné konstrukce `if`.\n\
\n\
```java\n\
int smer = 8;\n\
\n\
switch (smer) {\n\
\    case 1:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    default:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
}\n\
```\n\
\n\
Proměnná `smer` obsahuje hodnotu `8`. Protože tato hodnota neodpovídá ani větvi `case 1:`, ani větvi `case 2:`, program přejde do větve `default`.\n\
\n\
Následně vykoná příkaz pohybu dolů.\n\
\n\
Větev `default` není povinná. Pokud ji neuvedeme a žádná větev `case` neodpovídá zadané hodnotě, konstrukce `switch` neprovede žádnou ze svých větví a program pokračuje za ní.\n\
\n\
U klasického zápisu se na konec větve `default` často přidává `break;`, přestože na úplném konci konstrukce není nezbytný.\n\
\n\
# Příkaz break ve switch\n\
Příkaz `break` slouží k okamžitému ukončení nejbližší obklopující konstrukce `switch` nebo cyklu.\n\
\n\
Při použití uvnitř klasického `switch` zabrání pokračování do následujících větví `case`.\n\
\n\
```java\n\
int cislo = 1;\n\
\n\
switch (cislo) {\n\
\    case 1:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
}\n\
```\n\
\n\
Program vybere větev `case 1:` a vykoná příkaz pohybu doprava.\n\
\n\
Jakmile narazí na `break;`, okamžitě ukončí konstrukci `switch`. Příkaz z větve `case 2:` se již nevykoná.\n\
\n\
Bez příkazu `break` se může program chovat jinak, protože klasický zápis `switch` umožňuje pokračování do následujících větví.\n\
\n\
# Switch bez break\n\
Pokud v klasickém zápisu `switch` vynecháme `break`, vykonávání může pokračovat do následující větve bez ohledu na hodnotu jejího označení `case`.\n\
\n\
Toto chování se nazývá *fall-through*, tedy propadnutí do další větve.\n\
\n\
```java\n\
int cislo = 1;\n\
\n\
switch (cislo) {\n\
\    case 1:\n\
\        move(Direction.RIGHT);\n\
\    case 2:\n\
\        move(Direction.DOWN);\n\
\    case 3:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
}\n\
```\n\
\n\
Program nejprve vybere větev `case 1:`, protože proměnná `cislo` obsahuje hodnotu `1`.\n\
\n\
Vykoná pohyb doprava. Protože za příkazem není uveden `break;`, pokračuje přímo do větve `case 2:` a vykoná pohyb dolů.\n\
\n\
Následně pokračuje do větve `case 3:` a vykoná pohyb doleva. Teprve příkaz `break;` konstrukci ukončí.\n\
\n\
Robot tedy dostane tři pohybové příkazy, přestože hodnota proměnné odpovídala pouze první větvi.\n\
\n\
Vynechání příkazu `break` je jednou z častých chyb při používání klasického `switch`.\n\
\n\
# Více hodnot pro stejnou větev\n\
Někdy potřebujeme vykonat stejný příkaz pro několik různých hodnot. V klasickém `switch` můžeme umístit několik označení `case` za sebe bez dalších příkazů mezi nimi.\n\
\n\
```java\n\
int cislo = 2;\n\
\n\
switch (cislo) {\n\
\    case 1:\n\
\    case 2:\n\
\    case 3:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 4:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
}\n\
```\n\
\n\
V tomto příkladu mají hodnoty `1`, `2` a `3` společný blok příkazů.\n\
\n\
Pokud proměnná obsahuje některou z těchto hodnot, robot dostane příkaz k pohybu doprava.\n\
\n\
Pokud proměnná obsahuje hodnotu `4`, vykoná se příkaz pohybu doleva.\n\
\n\
Tento způsob zápisu umožňuje omezit opakování stejného kódu v několika větvích.\n\
\n\
# Switch s celočíselnými hodnotami\n\
Konstrukci `switch` můžeme použít například s proměnnými typu `int`. Hodí se k rozhodování podle konkrétních číselných hodnot.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
switch (x) {\n\
\    case 0:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 1:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.TOP);\n\
\        break;\n\
\    default:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
}\n\
```\n\
\n\
Program nejprve zjistí aktuální vodorovnou souřadnici robota pomocí metody `robotCoordinatesX()`.\n\
\n\
Následně použije získanou hodnotu v konstrukci `switch`.\n\
\n\
Pokud je X rovno `0`, robot dostane příkaz k pohybu doprava. Pokud je X rovno `1`, dostane příkaz k pohybu dolů. Pokud je X rovno `2`, dostane příkaz k pohybu nahoru.\n\
\n\
Pro všechny ostatní hodnoty se vykoná větev `default`, která obsahuje pohyb doleva.\n\
\n\
# Switch s textovými hodnotami\n\
V Javě lze konstrukci `switch` použít také s textovými řetězci typu `String`.\n\
\n\
Jednotlivé větve `case` potom obsahují konkrétní textové hodnoty.\n\
\n\
```java\n\
String prikaz = "doprava";\n\
\n\
switch (prikaz) {\n\
\    case "doleva":\n\
\        move(Direction.LEFT);\n\
\        break;\n\
\    case "doprava":\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case "nahoru":\n\
\        move(Direction.TOP);\n\
\        break;\n\
\    case "dolu":\n\
\        move(Direction.DOWN);\n\
\        break;\n\
\    default:\n\
\        // Neznámý příkaz\n\
\        break;\n\
}\n\
```\n\
\n\
Proměnná `prikaz` obsahuje text `"doprava"`. Program proto vybere odpovídající větev a vykoná příkaz `move(Direction.RIGHT);`.\n\
\n\
Při porovnávání textových hodnot se rozlišují velká a malá písmena. Hodnoty `"doprava"` a `"Doprava"` proto nejsou stejné.\n\
\n\
Pokud žádná textová hodnota neodpovídá, vykoná se větev `default`, pokud je uvedena.\n\
\n\
# Switch s typem Direction\n\
Robot API používá typ `Direction`, který reprezentuje jednotlivé směry pohybu robota. Pokud je definován jako výčtový typ `enum`, můžeme jeho hodnoty použít přímo v konstrukci `switch`.\n\
\n\
```java\n\
Direction smer = Direction.RIGHT;\n\
\n\
switch (smer) {\n\
\    case LEFT:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
\    case RIGHT:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case TOP:\n\
\        move(Direction.TOP);\n\
\        break;\n\
\    case DOWN:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
}\n\
```\n\
\n\
Program porovnává hodnotu proměnné `smer` s jednotlivými konstantami výčtového typu.\n\
\n\
U klasického `switch` nad výčtovým typem se hodnoty `case` zapisují přímo jako `LEFT`, `RIGHT`, `TOP` a `DOWN`, bez předpony `Direction.`.\n\
\n\
Protože proměnná obsahuje hodnotu `Direction.RIGHT`, vykoná se odpovídající příkaz pohybu doprava.\n\
\n\
# Rozdíl mezi switch a if\n\
Konstrukce `switch` a podmínka `if` umožňují řídit vykonávání programu, ale mají odlišné možnosti použití.\n\
\n\
Podmínka `if` umožňuje vyhodnocovat libovolný výraz s výsledkem typu `boolean`, například porovnávání čísel, rozsahy hodnot nebo kombinace logických operátorů.\n\
\n\
Konstrukce `switch` se používá především při rozhodování podle konkrétních hodnot jednoho výrazu.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 5) {\n\
\    move(Direction.RIGHT);\n\
} else {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Tento příklad používá `if`, protože kontroluje, zda je hodnota menší než určité číslo.\n\
\n\
```java\n\
int x = robotCoordinatesX();\n\
\n\
switch (x) {\n\
\    case 1:\n\
\        move(Direction.RIGHT);\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
\    default:\n\
\        move(Direction.LEFT);\n\
\        break;\n\
}\n\
```\n\
\n\
Druhý příklad používá `switch`, protože rozhoduje podle konkrétních hodnot souřadnice X.\n\
\n\
Pro porovnávání rozsahů, například `x < 5` nebo `x >= 10`, je v základní podobě Javy vhodnější konstrukce `if`.\n\
\n\
# Moderní zápis switch pomocí šipky\n\
Novější verze Javy umožňují používat také moderní zápis konstrukce `switch`, ve kterém se místo dvojtečky používá šipka `->`.\n\
\n\
```java\n\
int smer = 2;\n\
\n\
switch (smer) {\n\
\    case 1 -> move(Direction.LEFT);\n\
\    case 2 -> move(Direction.RIGHT);\n\
\    case 3 -> move(Direction.TOP);\n\
\    case 4 -> move(Direction.DOWN);\n\
\    default -> {\n\
\        // Neznámý směr\n\
\    }\n\
}\n\
```\n\
\n\
Tento zápis je přehlednější a nevyžaduje příkaz `break` za každou větví.\n\
\n\
Po vykonání odpovídající větve program automaticky ukončí rozhodování v konstrukci `switch`, aniž by pokračoval do následujících větví.\n\
\n\
Moderní zápis také umožňuje uvést více hodnot pro jednu větev.\n\
\n\
```java\n\
int cislo = 2;\n\
\n\
switch (cislo) {\n\
\    case 1, 2, 3 -> move(Direction.RIGHT);\n\
\    case 4, 5 -> move(Direction.LEFT);\n\
\    default -> move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Pokud je hodnota proměnné `cislo` rovna `1`, `2` nebo `3`, vykoná se pohyb doprava.\n\
\n\
Pokud je hodnota rovna `4` nebo `5`, vykoná se pohyb doleva. Pro ostatní hodnoty se použije větev `default`.\n\
\n\
Dostupnost tohoto zápisu závisí na používané verzi Javy a pravidlech konkrétní úrovně.\n\
\n\
# Switch jako výraz\n\
V moderní Javě může být `switch` použit nejen jako příkaz, ale také jako výraz, který vrací určitou hodnotu.\n\
\n\
Takovou hodnotu můžeme například přiřadit do proměnné.\n\
\n\
```java\n\
int cislo = 2;\n\
\n\
String vysledek = switch (cislo) {\n\
\    case 1 -> "Doleva";\n\
\    case 2 -> "Doprava";\n\
\    case 3 -> "Nahoru";\n\
\    case 4 -> "Dolu";\n\
\    default -> "Neznamy smer";\n\
};\n\
```\n\
\n\
Program vyhodnotí proměnnou `cislo` a podle její hodnoty vybere odpovídající text.\n\
\n\
Protože hodnota proměnné je `2`, výsledkem výrazu `switch` bude řetězec `"Doprava"`, který se uloží do proměnné `vysledek`.\n\
\n\
Na rozdíl od klasického příkazu `switch` musí výraz `switch` poskytnout výslednou hodnotu pro každou možnou cestu běžného dokončení.\n\
\n\
# Příkaz yield\n\
Při používání výrazu `switch` může být potřeba vykonat více příkazů a následně vrátit výslednou hodnotu z vybrané větve.\n\
\n\
K tomu slouží klíčové slovo `yield`.\n\
\n\
```java\n\
int cislo = 2;\n\
\n\
String vysledek = switch (cislo) {\n\
\    case 1 -> {\n\
\        yield "Doleva";\n\
\    }\n\
\    case 2 -> {\n\
\        String text = "Doprava";\n\
\        yield text;\n\
\    }\n\
\    default -> {\n\
\        yield "Neznamy smer";\n\
\    }\n\
};\n\
```\n\
\n\
Klíčové slovo `yield` ukončí příslušnou větev výrazu `switch` a poskytne hodnotu jako výsledek celého výrazu.\n\
\n\
V uvedeném příkladu se do proměnné `vysledek` uloží text `"Doprava"`.\n\
\n\
Příkaz `yield` není totožný s `return`. Zatímco `yield` poskytuje hodnotu výrazu `switch`, příkaz `return` ukončuje celou metodu.\n\
\n\
Výrazy `switch` a klíčové slovo `yield` patří mezi pokročilejší možnosti novějších verzí Javy.\n\
\n\
# Co jsou skokové příkazy\n\
Skokové příkazy umožňují změnit běžný průběh vykonávání programu. Mohou například předčasně ukončit cyklus, přeskočit jeho aktuální iteraci nebo ukončit celou metodu.\n\
\n\
Mezi základní skokové příkazy v Javě patří `break`, `continue` a `return`.\n\
\n\
Každý z těchto příkazů má odlišný význam. Je proto důležité rozumět tomu, jakou část programu ovlivňuje a kam vykonávání pokračuje.\n\
\n\
# Skokový příkaz break\n\
Příkaz `break` slouží k okamžitému ukončení nejbližší obklopující konstrukce `switch` nebo cyklu.\n\
\n\
Můžeme jej použít například tehdy, když již není potřeba pokračovat v dalších iteracích.\n\
\n\
```java\n\
for (int i = 0; i < 10; i++) {\n\
\    if (i == 4) {\n\
\        break;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Cyklus by za běžných okolností mohl proběhnout desetkrát. Příkaz `break;` však způsobí jeho předčasné ukončení, jakmile počítadlo dosáhne hodnoty `4`.\n\
\n\
Pohyb doprava se tedy vykoná pouze při hodnotách počítadla `0`, `1`, `2` a `3`.\n\
\n\
Program po vykonání příkazu `break;` pokračuje za ukončeným cyklem.\n\
\n\
# Break v cyklu while\n\
Příkaz `break` lze použít také v cyklu `while`, například pokud chceme cyklus ukončit po splnění určité podmínky.\n\
\n\
```java\n\
int pocet = 0;\n\
\n\
while (true) {\n\
\    if (pocet >= 3) {\n\
\        break;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
\    pocet++;\n\
}\n\
```\n\
\n\
Podmínka `while (true)` je vždy pravdivá, takže sama o sobě neumožňuje ukončení cyklu.\n\
\n\
Uvnitř cyklu ale kontrolujeme hodnotu proměnné `pocet`. Jakmile dosáhne hodnoty `3`, vykoná se `break;` a celý cyklus skončí.\n\
\n\
Výsledkem jsou tři vykonání příkazu pohybu doprava.\n\
\n\
Příkaz `break` je tedy možné používat také k řízení cyklů, které nemají vlastní konečnou podmínku v záhlaví.\n\
\n\
# Skokový příkaz continue\n\
Příkaz `continue` slouží k přeskočení zbývající části aktuální iterace cyklu.\n\
\n\
Na rozdíl od `break` neukončuje celý cyklus, ale pokračuje jeho další iterací podle pravidel konkrétního typu cyklu.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    if (i == 2) {\n\
\        continue;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Cyklus postupně pracuje s hodnotami počítadla `0`, `1`, `2`, `3` a `4`.\n\
\n\
Jakmile počítadlo dosáhne hodnoty `2`, vykoná se příkaz `continue;`.\n\
\n\
Pohybový příkaz se v této iteraci přeskočí a cyklus pokračuje další hodnotou počítadla.\n\
\n\
Příkaz `move(Direction.RIGHT);` se tedy vykoná čtyřikrát místo pěti.\n\
\n\
# Continue v cyklu while\n\
Příkaz `continue` můžeme použít také v cyklu `while`. V takovém případě se přeskočí zbývající příkazy aktuální iterace a program se vrátí ke kontrole podmínky cyklu.\n\
\n\
```java\n\
int i = 0;\n\
\n\
while (i < 5) {\n\
\    i++;\n\
\n\
\    if (i == 3) {\n\
\        continue;\n\
\    }\n\
\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Proměnná `i` se na začátku každé iterace zvýší o jedna.\n\
\n\
Pokud dosáhne hodnoty `3`, vykoná se `continue;` a pohybový příkaz se přeskočí.\n\
\n\
Při ostatních hodnotách se pohyb doprava vykoná. Celkově se tedy vykonají čtyři pohybové příkazy.\n\
\n\
Při používání `continue` v cyklu `while` je důležité správně aktualizovat proměnné ovlivňující podmínku. Pokud bychom aktualizaci umístili až za `continue`, mohlo by dojít k nekonečnému cyklu.\n\
\n\
# Rozdíl mezi break a continue\n\
Příkazy `break` a `continue` umožňují změnit průběh cyklu, ale každý z nich funguje jinak.\n\
\n\
`break` okamžitě ukončuje celý příslušný cyklus.\n\
\n\
`continue` ukončuje pouze aktuální iteraci a umožňuje pokračovat další iterací cyklu.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    if (i == 2) {\n\
\        break;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
V tomto příkladu se pohyb doprava vykoná pouze dvakrát, protože při hodnotě `i == 2` se celý cyklus ukončí.\n\
\n\
```java\n\
for (int i = 0; i < 5; i++) {\n\
\    if (i == 2) {\n\
\        continue;\n\
\    }\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Ve druhém příkladu se pohyb doprava vykoná čtyřikrát. Pouze iterace s hodnotou `i == 2` se přeskočí a cyklus pokračuje dál.\n\
\n\
# Skokový příkaz return\n\
Příkaz `return` slouží k okamžitému ukončení aktuálně vykonávané metody.\n\
\n\
Na rozdíl od příkazů `break` a `continue` tedy neovlivňuje pouze cyklus nebo konstrukci `switch`, ale ukončuje celou metodu, ve které se nachází.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int x = robotCoordinatesX();\n\
\n\
\        if (x == 5) {\n\
\            return;\n\
\        }\n\
\n\
\        move(Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
Program nejprve zjistí aktuální souřadnici X.\n\
\n\
Pokud je souřadnice rovna `5`, vykoná se příkaz `return;` a metoda `main` okamžitě skončí.\n\
\n\
Příkaz `move(Direction.RIGHT);` se již nevykoná.\n\
\n\
Pokud hodnota X není rovna `5`, podmínka se přeskočí a program pokračuje pohybem doprava.\n\
\n\
Protože metoda `main` má návratový typ `void`, používáme v ní příkaz `return;` bez návratové hodnoty.\n\
\n\
# Return v metodách s návratovou hodnotou\n\
Metody, které mají návratový typ jiný než `void`, mohou pomocí příkazu `return` vracet vypočítanou hodnotu.\n\
\n\
```java\n\
public static int secti(int a, int b) {\n\
\    return a + b;\n\
}\n\
```\n\
\n\
Metoda `secti` přijímá dvě celá čísla typu `int` a vrací jejich součet.\n\
\n\
Příkaz `return a + b;` nejprve vyhodnotí výraz `a + b` a následně ukončí metodu s výslednou hodnotou.\n\
\n\
Metodu můžeme zavolat například takto.\n\
\n\
```java\n\
int vysledek = secti(3, 4);\n\
```\n\
\n\
Do proměnné `vysledek` se uloží číslo `7`.\n\
\n\
Typ vrácené hodnoty musí být kompatibilní s deklarovaným návratovým typem metody.\n\
\n\
V metodě s návratovým typem `void` nelze běžným příkazem `return` vracet hodnotu. Používáme pouze zápis `return;`.\n\
\n\
# Return uvnitř cyklu\n\
Příkaz `return` můžeme použít také uvnitř cyklu. V takovém případě ale neukončí pouze cyklus, nýbrž celou aktuální metodu.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        for (int i = 0; i < 10; i++) {\n\
\            if (i == 3) {\n\
\                return;\n\
\            }\n\
\            move(Direction.RIGHT);\n\
\        }\n\
\n\
\        move(Direction.DOWN);\n\
\    }\n\
}\n\
```\n\
\n\
Cyklus začne vykonávat pohybové příkazy doprava.\n\
\n\
Jakmile počítadlo dosáhne hodnoty `3`, vykoná se `return;` a celá metoda `main` se okamžitě ukončí.\n\
\n\
Robot proto dostane pouze tři příkazy k pohybu doprava. Příkaz `move(Direction.DOWN);`, který je umístěn za cyklem, se již nevykoná.\n\
\n\
Pokud bychom místo `return;` použili `break;`, ukončil by se pouze cyklus a program by následně pokračoval příkazem pohybu dolů.\n\
\n\
# Break uvnitř switch a cyklu\n\
Pokud je konstrukce `switch` umístěna uvnitř cyklu, příkaz `break` bez označení ukončuje pouze nejbližší konstrukci, kterou může být právě `switch`.\n\
\n\
```java\n\
for (int i = 0; i < 4; i++) {\n\
\    switch (i) {\n\
\        case 0:\n\
\            move(Direction.RIGHT);\n\
\            break;\n\
\        case 1:\n\
\            move(Direction.DOWN);\n\
\            break;\n\
\        default:\n\
\            move(Direction.LEFT);\n\
\            break;\n\
\    }\n\
}\n\
```\n\
\n\
V tomto příkladu se při každé iteraci cyklu vyhodnotí hodnota počítadla `i` pomocí konstrukce `switch`.\n\
\n\
Příkaz `break;` ukončí pouze konstrukci `switch`, nikoliv vnější cyklus `for`.\n\
\n\
Vnější cyklus proto pokračuje další iterací, dokud není splněna jeho ukončovací podmínka.\n\
\n\
To znamená, že se postupně vykonají čtyři pohybové příkazy podle hodnot počítadla.\n\
\n\
# Continue uvnitř switch a cyklu\n\
Příkaz `continue` nelze použít v samostatné konstrukci `switch`, pokud není současně umístěna uvnitř cyklu.\n\
\n\
Pokud se `switch` nachází uvnitř cyklu, může `continue` přeskočit zbývající část aktuální iterace tohoto cyklu.\n\
\n\
```java\n\
for (int i = 0; i < 4; i++) {\n\
\    switch (i) {\n\
\        case 2:\n\
\            continue;\n\
\        default:\n\
\            break;\n\
\    }\n\
\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Cyklus postupně pracuje s hodnotami `0`, `1`, `2` a `3`.\n\
\n\
Při hodnotě `i == 2` se vykoná `continue;`. Tím se přeskočí zbývající část aktuální iterace vnějšího cyklu, včetně příkazu pohybu doprava.\n\
\n\
Při ostatních hodnotách se vykoná `break;`, který ukončí pouze `switch`. Program následně pokračuje příkazem `move(Direction.RIGHT);`.\n\
\n\
Robot tedy dostane tři příkazy k pohybu doprava.\n\
\n\
# Skokové příkazy ve vnořených cyklech\n\
Pokud používáme více cyklů uvnitř sebe, je důležité vědět, který cyklus skokový příkaz ovlivní.\n\
\n\
Neoznačený příkaz `break` ukončuje nejbližší obklopující cyklus nebo `switch`.\n\
\n\
```java\n\
for (int i = 0; i < 3; i++) {\n\
\    for (int j = 0; j < 5; j++) {\n\
\        if (j == 2) {\n\
\            break;\n\
\        }\n\
\        move(Direction.RIGHT);\n\
\    }\n\
\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Vnější cyklus proběhne třikrát. Při každé jeho iteraci se spustí vnitřní cyklus.\n\
\n\
Vnitřní cyklus vykoná dva příkazy pohybu doprava. Jakmile počítadlo `j` dosáhne hodnoty `2`, příkaz `break;` ukončí pouze vnitřní cyklus.\n\
\n\
Program následně vykoná jeden pohyb dolů a pokračuje další iterací vnějšího cyklu.\n\
\n\
Celkově se vykoná šest pohybových příkazů doprava a tři příkazy dolů.\n\
\n\
# Označené cykly a příkaz break\n\
Java umožňuje označit cyklus vlastním názvem. Takové označení se nazývá návěští neboli *label*.\n\
\n\
Pomocí označeného příkazu `break` můžeme ukončit konkrétní vnější cyklus, a to i v případě, že se nacházíme uvnitř jiného cyklu.\n\
\n\
```java\n\
vnejsi:\n\
for (int i = 0; i < 3; i++) {\n\
\    for (int j = 0; j < 5; j++) {\n\
\        if (j == 2) {\n\
\            break vnejsi;\n\
\        }\n\
\        move(Direction.RIGHT);\n\
\    }\n\
\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Označení `vnejsi:` představuje návěští vnějšího cyklu.\n\
\n\
Příkaz `break vnejsi;` ukončí celý označený vnější cyklus, nikoliv pouze nejbližší vnitřní cyklus.\n\
\n\
Jakmile při první iteraci vnitřního cyklu dosáhne počítadlo `j` hodnoty `2`, vykonávání přeskočí za vnější cyklus.\n\
\n\
Robot tak dostane pouze dva příkazy k pohybu doprava. Příkaz pohybu dolů se již nevykoná.\n\
\n\
Označené cykly patří mezi pokročilejší konstrukce, které se používají především při složitějším vnořování.\n\
\n\
# Označený příkaz continue\n\
Podobně jako `break` může také příkaz `continue` používat označení konkrétního cyklu.\n\
\n\
Označený `continue` přeskočí na další iteraci vybraného cyklu podle jeho pravidel pokračování.\n\
\n\
```java\n\
vnejsi:\n\
for (int i = 0; i < 3; i++) {\n\
\    for (int j = 0; j < 4; j++) {\n\
\        if (j == 2) {\n\
\            continue vnejsi;\n\
\        }\n\
\        move(Direction.RIGHT);\n\
\    }\n\
\n\
\    move(Direction.DOWN);\n\
}\n\
```\n\
\n\
Příkaz `continue vnejsi;` okamžitě ukončí aktuální iteraci vnějšího cyklu a přesune vykonávání k jeho dalšímu opakování.\n\
\n\
V tomto příkladu se při každé iteraci vnějšího cyklu provedou dva pohyby doprava. Jakmile vnitřní počítadlo dosáhne hodnoty `2`, program přejde na další iteraci vnějšího cyklu.\n\
\n\
Příkaz pohybu dolů se proto nikdy nevykoná.\n\
\n\
Celkově robot dostane šest příkazů k pohybu doprava.\n\
\n\
# Kombinace switch a podmínek\n\
Uvnitř větví `case` můžeme používat také podmínky `if`, `else if` a `else`.\n\
\n\
Díky tomu lze nejprve vybrat základní skupinu příkazů pomocí `switch` a následně podrobněji rozhodovat podle dalších hodnot.\n\
\n\
```java\n\
int smer = 1;\n\
int x = robotCoordinatesX();\n\
\n\
switch (smer) {\n\
\    case 1:\n\
\        if (x < 5) {\n\
\            move(Direction.RIGHT);\n\
\        } else {\n\
\            move(Direction.LEFT);\n\
\        }\n\
\        break;\n\
\    case 2:\n\
\        move(Direction.DOWN);\n\
\        break;\n\
\    default:\n\
\        break;\n\
}\n\
```\n\
\n\
Program nejprve vybere větev podle hodnoty proměnné `smer`.\n\
\n\
Pokud má proměnná hodnotu `1`, vyhodnotí se další podmínka podle aktuální souřadnice X.\n\
\n\
Jestliže je X menší než `5`, robot dostane příkaz k pohybu doprava. V opačném případě dostane příkaz k pohybu doleva.\n\
\n\
Pokud má proměnná `smer` hodnotu `2`, provede se pohyb dolů bez dalšího rozhodování.\n\
\n\
# Kombinace switch a cyklu\n\
Konstrukci `switch` můžeme umístit také dovnitř cyklu, který opakovaně vykonává různé příkazy podle hodnoty počítadla.\n\
\n\
```java\n\
for (int i = 0; i < 4; i++) {\n\
\    switch (i) {\n\
\        case 0:\n\
\            move(Direction.RIGHT);\n\
\            break;\n\
\        case 1:\n\
\            move(Direction.DOWN);\n\
\            break;\n\
\        case 2:\n\
\            move(Direction.RIGHT);\n\
\            break;\n\
\        case 3:\n\
\            move(Direction.TOP);\n\
\            break;\n\
\    }\n\
}\n\
```\n\
\n\
Cyklus `for` postupně nastavuje hodnoty počítadla od `0` do `3`.\n\
\n\
Při každé iteraci vybere konstrukce `switch` odpovídající větev a vykoná příslušný pohybový příkaz.\n\
\n\
Robot se postupně pokusí pohybovat doprava, dolů, doprava a nahoru.\n\
\n\
Pokud jsou všechny pohyby úspěšné, jeho konečná poloha bude o dvě políčka doprava od počáteční polohy.\n\
\n\
# Nejčastější chyby při používání switch\n\
Jednou z nejčastějších chyb je vynechání příkazu `break` v klasickém zápisu konstrukce `switch`. Pokud není uveden, program může pokračovat do následujících větví `case` a vykonat více příkazů, než bylo zamýšleno.\n\
\n\
Dalším problémem bývá nesprávné použití hodnot za klíčovým slovem `case`. Tyto hodnoty musí odpovídat pravidlům datového typu použitého ve výrazu `switch`. Nelze zde například v základní podobě použít libovolné porovnání jako `case x > 5:`.\n\
\n\
Ve stejném klasickém `switch` také nelze uvést dvě totožné konstantní hodnoty `case`, protože by nebylo jednoznačné, kterou větev mají představovat.\n\
\n\
Častou chybou je rovněž záměna dvojtečky `:` a středníku `;`. V klasickém zápisu následuje za hodnotou `case` dvojtečka, zatímco jednotlivé příkazy se ukončují středníkem.\n\
\n\
Při použití textových hodnot je nutné dodržet přesný zápis včetně velkých a malých písmen.\n\
\n\
Důležité je také správné používání složených závorek a uvědomění si, že klasické větve `case` samy o sobě nevytvářejí samostatné oblasti platnosti lokálních proměnných. Pokud potřebujeme uvnitř větve deklarovat vlastní proměnné se stejnými názvy jako v jiných větvích, můžeme jednotlivé větve uzavřít do samostatných bloků `{}`.\n\
\n\
# Nejčastější chyby u skokových příkazů\n\
Při používání příkazu `break` je důležité vědět, kterou konstrukci ukončuje. Pokud se například nachází uvnitř `switch`, který je vložen do cyklu, neoznačený `break` ukončí pouze `switch`.\n\
\n\
Příkaz `continue` lze používat pouze v cyklech. Nelze jej použít jako samostatný příkaz mimo cyklus nebo přímo k pokračování další větví `switch`.\n\
\n\
Při použití `continue` v cyklu `while` může vzniknout nekonečné opakování, pokud program přeskočí aktualizaci proměnné, na které závisí podmínka pokračování.\n\
\n\
Příkaz `return` vždy ukončuje aktuální metodu. Pokud jej použijeme uvnitř metody `main`, přeskočí všechny zbývající příkazy této metody, nikoliv pouze aktuální cyklus nebo podmínku.\n\
\n\
Při práci se skokovými příkazy může také vzniknout nedosažitelný kód. Pokud například bezpodmínečně uvedeme příkaz za `return;` ve stejném bloku, Java může překlad takového programu odmítnout, protože se k následujícímu příkazu nelze dostat.\n\
\n\
# Příklad kompletního programu\n\
Následující program kombinuje konstrukci `switch`, cyklus `for`, podmínku `if` a skokové příkazy `break`, `continue` a `return`.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int x = robotCoordinatesX();\n\
\n\
\        if (x == 5) {\n\
\            return;\n\
\        }\n\
\n\
\        for (int i = 0; i < 5; i++) {\n\
\            if (i == 2) {\n\
\                continue;\n\
\            }\n\
\n\
\            switch (i) {\n\
\                case 0:\n\
\                    move(Direction.RIGHT);\n\
\                    break;\n\
\                case 1:\n\
\                    move(Direction.DOWN);\n\
\                    break;\n\
\                case 3:\n\
\                    move(Direction.RIGHT);\n\
\                    break;\n\
\                case 4:\n\
\                    move(Direction.TOP);\n\
\                    break;\n\
\                default:\n\
\                    break;\n\
\            }\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
Program nejprve zjistí aktuální souřadnici X robota. Pokud je rovna `5`, příkaz `return;` okamžitě ukončí metodu `main` a žádné další příkazy se nevykonají.\n\
\n\
Pokud souřadnice X není rovna `5`, program přejde k cyklu `for`, který postupně pracuje s hodnotami počítadla od `0` do `4`.\n\
\n\
Při hodnotě `i == 0` vykoná konstrukce `switch` příkaz pohybu doprava.\n\
\n\
Při hodnotě `i == 1` vykoná pohyb dolů.\n\
\n\
Při hodnotě `i == 2` se vykoná příkaz `continue;`, takže celá zbývající část aktuální iterace se přeskočí a konstrukce `switch` se vůbec nevyhodnotí.\n\
\n\
Při hodnotě `i == 3` vykoná robot další pohyb doprava a při hodnotě `i == 4` pohyb nahoru.\n\
\n\
Příkazy `break;` uvnitř jednotlivých větví `case` ukončují pouze konstrukci `switch`. Neovlivňují pokračování vnějšího cyklu `for`.\n\
\n\
Pokud robot nezačíná na souřadnici X rovné `5` a všechny pohyby jsou možné, vykoná celkem čtyři pohybové příkazy. Jeho výsledná poloha bude o dvě políčka doprava od počáteční polohy.\n\
\n\
Tento příklad ukazuje, že konstrukce `switch` a skokové příkazy umožňují společně řídit pořadí vykonávání jednotlivých částí programu.\n\
\n\
# Pravidla konkrétní úrovně\n\
Jednotlivé úrovně mohou omezovat používání konstrukce `switch`, jednotlivých větví `case`, výchozí větve `default` nebo skokových příkazů `break`, `continue` a `return`.\n\
\n\
Některé lekce mohou povolovat pouze klasický zápis `switch`, zatímco pokročilejší úrovně mohou umožňovat také moderní zápis pomocí `->`, výrazy `switch`, klíčové slovo `yield` nebo označené cykly.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.