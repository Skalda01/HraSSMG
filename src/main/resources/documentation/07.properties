content=# Co je ArrayList\n\
`ArrayList` je dynamický seznam v jazyce Java, který umožňuje uchovávat více hodnot pod jedním názvem. Jednotlivé hodnoty se nazývají prvky a jsou uloženy v určitém pořadí.\n\
\n\
Hlavní vlastností `ArrayList` je možnost měnit počet uložených prvků během vykonávání programu. Do seznamu můžeme přidávat nové hodnoty, upravovat existující hodnoty nebo nepotřebné prvky odstraňovat.\n\
\n\
Každý prvek má svůj index, pomocí kterého můžeme určit jeho pozici v seznamu. Indexování začíná od nuly, takže první prvek má index `0`, druhý index `1` a třetí index `2`.\n\
\n\
`ArrayList` zachovává pořadí vložených prvků a umožňuje uchovávat také opakující se hodnoty.\n\
\n\
Při programování robota můžeme `ArrayList` využít například k ukládání směrů pohybu, zaznamenávání souřadnic, vytváření seznamu úkolů nebo postupnému plánování trasy.\n\
\n\
# Import ArrayList\n\
Třída `ArrayList` je součástí standardní knihovny Javy a nachází se v balíčku `java.util`.\n\
\n\
Abychom ji mohli používat pod jednoduchým názvem `ArrayList`, musíme ji nejprve importovat.\n\
\n\
```java\n\
import java.util.ArrayList;\n\
```\n\
\n\
Klíčové slovo `import` zpřístupňuje třídu z uvedeného balíčku.\n\
\n\
`java.util` je balíček obsahující různé pomocné třídy a datové struktury.\n\
\n\
`ArrayList` je název třídy, kterou chceme používat.\n\
\n\
Import zapisujeme na začátek programu před deklaraci třídy `Main`.\n\
\n\
Pokud současně používáme příkazy Robot API, můžeme zapsat oba importy.\n\
\n\
```java\n\
import java.util.ArrayList;\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\    }\n\
}\n\
```\n\
\n\
Samotný import nevytváří žádný seznam. Pouze umožňuje používat třídu `ArrayList` v programu.\n\
\n\
# Vytvoření ArrayList\n\
Nový seznam vytváříme pomocí třídy `ArrayList` a klíčového slova `new`.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
```\n\
\n\
Tento příkaz vytvoří prázdný dynamický seznam s názvem `cisla`, který je určený k ukládání celých čísel.\n\
\n\
`ArrayList` označuje třídu dynamického seznamu.\n\
\n\
`Integer` určuje datový typ hodnot, které může seznam uchovávat.\n\
\n\
Úhlové závorky `<>` označují generický typ seznamu.\n\
\n\
`cisla` je název proměnné, která uchovává odkaz na vytvořený seznam.\n\
\n\
Klíčové slovo `new` vytváří novou instanci třídy `ArrayList`.\n\
\n\
Zápis `new ArrayList<>()` vytváří nový prázdný seznam. Java dokáže požadovaný typ odvodit z deklarace proměnné.\n\
\n\
Po vytvoření seznam neobsahuje žádné prvky a jeho velikost je `0`.\n\
\n\
# Deklarace a inicializace seznamu\n\
Proměnnou typu `ArrayList` můžeme nejprve deklarovat a teprve následně vytvořit samotný seznam.\n\
\n\
```java\n\
ArrayList<Integer> cisla;\n\
cisla = new ArrayList<>();\n\
```\n\
\n\
První řádek deklaruje proměnnou `cisla`, která může uchovávat referenci na seznam celých čísel.\n\
\n\
Druhý řádek vytvoří nový prázdný seznam a přiřadí jeho referenci do proměnné.\n\
\n\
Dokud seznam nevytvoříme a nepřiřadíme jeho referenci, nemůžeme pomocí této lokální proměnné volat metody seznamu.\n\
\n\
Obvykle je přehlednější provést deklaraci i inicializaci na jediném řádku.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
```\n\
\n\
# Datové typy v ArrayList\n\
Každý `ArrayList` má určený typ prvků, které může obsahovat. Tento typ zapisujeme do úhlových závorek za název třídy.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
ArrayList<Double> hodnoty = new ArrayList<>();\n\
ArrayList<Boolean> stavy = new ArrayList<>();\n\
ArrayList<Character> znaky = new ArrayList<>();\n\
ArrayList<String> nazvy = new ArrayList<>();\n\
```\n\
\n\
`Integer` slouží k ukládání celých čísel.\n\
\n\
`Double` slouží k ukládání desetinných čísel.\n\
\n\
`Boolean` slouží k ukládání pravdivostních hodnot `true` a `false`.\n\
\n\
`Character` slouží k ukládání jednotlivých znaků.\n\
\n\
`String` slouží k ukládání textových řetězců.\n\
\n\
Generický typ pomáhá zajistit, aby seznam obsahoval pouze hodnoty kompatibilní s jeho deklarovaným typem.\n\
\n\
Například do seznamu `ArrayList<Integer>` nemůžeme běžným způsobem vložit textový řetězec typu `String`.\n\
\n\
# Obalové datové typy\n\
Při používání `ArrayList` nemůžeme do generických závorek přímo zapisovat primitivní datové typy, například `int`, `double`, `boolean` nebo `char`.\n\
\n\
Používáme jejich odpovídající obalové třídy.\n\
\n\
Pro `int` používáme `Integer`, pro `double` používáme `Double`, pro `boolean` používáme `Boolean` a pro `char` používáme `Character`.\n\
\n\
```java\n\
ArrayList<Integer> pocetKroku = new ArrayList<>();\n\
\n\
pocetKroku.add(5);\n\
pocetKroku.add(10);\n\
```\n\
\n\
Java automaticky převádí odpovídající primitivní hodnoty na jejich obalové typy. Tento mechanismus se nazývá *autoboxing*.\n\
\n\
Při získávání hodnoty z obalového typu do odpovídající primitivní proměnné může Java použít opačný převod označovaný jako *unboxing*.\n\
\n\
```java\n\
int kroky = pocetKroku.get(0);\n\
```\n\
\n\
Proměnná `kroky` bude obsahovat hodnotu `5`.\n\
\n\
# Přidávání prvků – add\n\
Metoda `add()` slouží k přidání nového prvku do seznamu.\n\
\n\
Pokud předáme pouze jednu hodnotu, nový prvek se přidá na konec seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
```\n\
\n\
Seznam nejprve neobsahuje žádné prvky. První volání `add(10)` vloží číslo `10`, druhé vloží číslo `20` a třetí vloží číslo `30`.\n\
\n\
Po vykonání všech příkazů bude seznam obsahovat hodnoty `[10, 20, 30]`.\n\
\n\
Každým úspěšným přidáním se počet prvků zvýší o jedna.\n\
\n\
Není nutné předem určovat konečný počet prvků. Seznam si své vnitřní úložiště spravuje automaticky.\n\
\n\
# Přidávání hodnot pomocí proměnných\n\
Do seznamu nemusíme přidávat pouze konkrétní čísla nebo texty. Můžeme přidávat také hodnoty uložené v proměnných.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
int a = 5;\n\
int b = 10;\n\
\n\
cisla.add(a);\n\
cisla.add(b);\n\
cisla.add(a + b);\n\
```\n\
\n\
Program nejprve vytvoří dvě proměnné `a` a `b`.\n\
\n\
Do seznamu následně vloží jejich hodnoty a také výsledek matematického výrazu `a + b`.\n\
\n\
Výsledný seznam bude obsahovat hodnoty `[5, 10, 15]`.\n\
\n\
Hodnota se do seznamu předá při vykonání metody `add()`. Pokud později změníme primitivní proměnnou `a`, již vložená číselná hodnota se automaticky nezmění.\n\
\n\
# Vložení prvku na konkrétní index\n\
Metoda `add()` umožňuje vložit nový prvek také na konkrétní pozici seznamu.\n\
\n\
V takovém případě předáváme dva argumenty: index a hodnotu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(30);\n\
cisla.add(1, 20);\n\
```\n\
\n\
Před posledním příkazem obsahuje seznam hodnoty `[10, 30]`.\n\
\n\
Příkaz `cisla.add(1, 20);` vloží číslo `20` na index `1`.\n\
\n\
Původní hodnota na tomto indexu se automaticky posune na následující pozici.\n\
\n\
Výsledný seznam bude obsahovat `[10, 20, 30]`.\n\
\n\
Při vkládání můžeme použít index od `0` až po aktuální velikost seznamu včetně. Index rovný velikosti seznamu představuje vložení na konec.\n\
\n\
# Indexování ArrayList\n\
Každý prvek seznamu má vlastní index, který určuje jeho pozici.\n\
\n\
Indexování začíná od nuly. To znamená, že první prvek má index `0`, druhý má index `1` a třetí má index `2`.\n\
\n\
```java\n\
ArrayList<String> ukoly = new ArrayList<>();\n\
\n\
ukoly.add("Start");\n\
ukoly.add("Pohyb");\n\
ukoly.add("Cil");\n\
```\n\
\n\
Text `"Start"` se nachází na indexu `0`.\n\
\n\
Text `"Pohyb"` se nachází na indexu `1`.\n\
\n\
Text `"Cil"` se nachází na indexu `2`.\n\
\n\
Pro seznam s `N` prvky jsou platné indexy od `0` do `N - 1`.\n\
\n\
Při práci s indexy musíme vždy zkontrolovat, zda požadovaná pozice skutečně existuje.\n\
\n\
# Čtení prvků – get\n\
Metoda `get(int index)` vrací hodnotu uloženou na určité pozici seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
int a = cisla.get(0);\n\
int b = cisla.get(1);\n\
int c = cisla.get(2);\n\
```\n\
\n\
Metoda `get(0)` vrátí první hodnotu `10`.\n\
\n\
Metoda `get(1)` vrátí druhou hodnotu `20`.\n\
\n\
Metoda `get(2)` vrátí třetí hodnotu `30`.\n\
\n\
Metoda `get()` slouží pouze ke čtení hodnoty. Samotným zavoláním nedochází k odstranění ani změně prvku.\n\
\n\
Pokud požadovaný index neexistuje, vznikne výjimka `IndexOutOfBoundsException`.\n\
\n\
# Změna hodnoty – set\n\
Metoda `set()` umožňuje změnit hodnotu prvku na určitém indexu.\n\
\n\
Přijímá dva argumenty. První určuje index a druhý novou hodnotu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
cisla.set(1, 50);\n\
```\n\
\n\
Před změnou obsahuje seznam hodnoty `[10, 20, 30]`.\n\
\n\
Příkaz `set(1, 50)` nahradí druhou hodnotu číslem `50`.\n\
\n\
Výsledný seznam bude obsahovat `[10, 50, 30]`.\n\
\n\
Metoda `set()` nemění počet prvků seznamu. Pouze nahrazuje hodnotu na již existující pozici.\n\
\n\
Pokud požadovaný index neexistuje, vznikne výjimka `IndexOutOfBoundsException`.\n\
\n\
# Počet prvků – size\n\
Metoda `size()` vrací aktuální počet prvků uložených v seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
int pocet = cisla.size();\n\
```\n\
\n\
Proměnná `pocet` bude obsahovat hodnotu `3`.\n\
\n\
Metoda `size()` vrací celé číslo typu `int`.\n\
\n\
Pokud do seznamu přidáme další prvek, hodnota vrácená metodou `size()` se zvýší. Pokud prvek odstraníme, počet se sníží.\n\
\n\
Za názvem `size` musíme uvádět kulaté závorky `()`, protože se jedná o metodu.\n\
\n\
# První a poslední prvek\n\
První prvek neprázdného seznamu má vždy index `0`.\n\
\n\
Poslední prvek má index o jedna menší, než je aktuální velikost seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
int prvni = cisla.get(0);\n\
int posledni = cisla.get(cisla.size() - 1);\n\
```\n\
\n\
Proměnná `prvni` bude obsahovat hodnotu `10`.\n\
\n\
Proměnná `posledni` bude obsahovat hodnotu `30`.\n\
\n\
Výraz `cisla.size() - 1` vypočítá index posledního prvku.\n\
\n\
Pokud je seznam prázdný, žádný první ani poslední prvek neexistuje. Před získáním těchto hodnot je proto vhodné ověřit, zda seznam obsahuje alespoň jeden prvek.\n\
\n\
# Kontrola prázdného seznamu – isEmpty\n\
Metoda `isEmpty()` zjišťuje, zda je seznam prázdný.\n\
\n\
Vrací hodnotu typu `boolean`. Pokud seznam neobsahuje žádné prvky, výsledkem je `true`. V opačném případě vrací `false`.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
if (cisla.isEmpty()) {\n\
\    cisla.add(10);\n\
}\n\
```\n\
\n\
Protože je seznam na začátku prázdný, podmínka bude pravdivá a vloží se hodnota `10`.\n\
\n\
Metoda `isEmpty()` je užitečná zejména před čtením prvního nebo posledního prvku.\n\
\n\
```java\n\
if (!cisla.isEmpty()) {\n\
\    int posledni = cisla.get(cisla.size() - 1);\n\
}\n\
```\n\
\n\
Operátor `!` představuje logickou negaci. Podmínka tedy ověřuje, že seznam není prázdný.\n\
\n\
# Odstranění prvku podle indexu – remove\n\
Metoda `remove(int index)` odstraní prvek na konkrétním indexu seznamu.\n\
\n\
```java\n\
ArrayList<String> ukoly = new ArrayList<>();\n\
\n\
ukoly.add("Start");\n\
ukoly.add("Pohyb");\n\
ukoly.add("Cil");\n\
\n\
ukoly.remove(1);\n\
```\n\
\n\
Původní seznam obsahuje hodnoty `["Start", "Pohyb", "Cil"]`.\n\
\n\
Příkaz `remove(1)` odstraní druhý prvek s hodnotou `"Pohyb"`.\n\
\n\
Po odstranění bude seznam obsahovat `["Start", "Cil"]`.\n\
\n\
Všechny prvky následující za odstraněnou pozicí se automaticky posunou o jednu pozici doleva.\n\
\n\
Metoda `remove(int index)` zároveň vrací odstraněný prvek, který můžeme uložit do proměnné.\n\
\n\
# Odstranění prvku podle hodnoty\n\
Metodu `remove()` můžeme použít také k odstranění konkrétní hodnoty.\n\
\n\
```java\n\
ArrayList<String> ukoly = new ArrayList<>();\n\
\n\
ukoly.add("Start");\n\
ukoly.add("Pohyb");\n\
ukoly.add("Cil");\n\
\n\
ukoly.remove("Pohyb");\n\
```\n\
\n\
Program vyhledá první prvek odpovídající textu `"Pohyb"` a odstraní jej.\n\
\n\
Výsledný seznam bude obsahovat `["Start", "Cil"]`.\n\
\n\
Pokud se požadovaná hodnota v seznamu nenachází, žádný prvek se neodstraní.\n\
\n\
Varianta `remove(Object)` vrací hodnotu `true`, pokud byl prvek nalezen a odstraněn. Pokud nalezen nebyl, vrátí `false`.\n\
\n\
Pokud seznam obsahuje stejnou hodnotu vícekrát, odstraní se pouze první odpovídající výskyt.\n\
\n\
# Odstranění číselné hodnoty\n\
Při používání `ArrayList<Integer>` musíme rozlišovat mezi odstraněním podle indexu a odstraněním podle hodnoty.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
cisla.remove(1);\n\
```\n\
\n\
Tento příkaz odstraní prvek na indexu `1`, tedy číslo `20`.\n\
\n\
Pokud chceme odstranit konkrétní číselnou hodnotu, můžeme použít metodu `Integer.valueOf()`.\n\
\n\
```java\n\
cisla.remove(Integer.valueOf(30));\n\
```\n\
\n\
Tento příkaz odstraní první výskyt hodnoty `30`.\n\
\n\
Důvodem je existence dvou variant metody `remove()`, které se liší typem předávaného argumentu.\n\
\n\
# Vymazání seznamu – clear\n\
Metoda `clear()` odstraní všechny prvky uložené v seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
cisla.clear();\n\
```\n\
\n\
Po zavolání metody `clear()` bude seznam prázdný.\n\
\n\
Metoda `size()` vrátí hodnotu `0` a metoda `isEmpty()` vrátí `true`.\n\
\n\
Samotný objekt `ArrayList` však nadále existuje a můžeme do něj znovu přidávat další hodnoty.\n\
\n\
```java\n\
cisla.add(50);\n\
```\n\
\n\
Po tomto příkazu bude seznam obsahovat jediný prvek s hodnotou `50`.\n\
\n\
# Kontrola existence hodnoty – contains\n\
Metoda `contains()` zjišťuje, zda seznam obsahuje určitou hodnotu.\n\
\n\
Vrací pravdivostní hodnotu typu `boolean`.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
boolean existuje = cisla.contains(20);\n\
```\n\
\n\
Proměnná `existuje` bude obsahovat hodnotu `true`, protože se číslo `20` nachází v seznamu.\n\
\n\
Pokud bychom použili `cisla.contains(50)`, výsledkem by byla hodnota `false`.\n\
\n\
Metodu můžeme použít přímo také v podmínce.\n\
\n\
```java\n\
if (cisla.contains(30)) {\n\
\    move(Direction.RIGHT);\n\
}\n\
```\n\
\n\
Pokud seznam obsahuje hodnotu `30`, robot dostane příkaz k pohybu doprava.\n\
\n\
# Vyhledání indexu – indexOf\n\
Metoda `indexOf()` vrací index prvního výskytu určité hodnoty v seznamu.\n\
\n\
```java\n\
ArrayList<String> ukoly = new ArrayList<>();\n\
\n\
ukoly.add("Start");\n\
ukoly.add("Pohyb");\n\
ukoly.add("Cil");\n\
\n\
int index = ukoly.indexOf("Pohyb");\n\
```\n\
\n\
Proměnná `index` bude obsahovat hodnotu `1`, protože text `"Pohyb"` se nachází na druhé pozici seznamu.\n\
\n\
Pokud hledaná hodnota v seznamu neexistuje, metoda vrátí `-1`.\n\
\n\
Tuto vlastnost můžeme použít například při rozhodování.\n\
\n\
```java\n\
if (ukoly.indexOf("Cil") != -1) {\n\
\    // Hodnota existuje v seznamu\n\
}\n\
```\n\
\n\
Pokud se hledaná hodnota nachází v seznamu vícekrát, metoda vrátí index jejího prvního výskytu.\n\
\n\
# Poslední výskyt hodnoty – lastIndexOf\n\
Metoda `lastIndexOf()` vyhledává poslední výskyt požadované hodnoty.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(5);\n\
cisla.add(10);\n\
cisla.add(5);\n\
cisla.add(20);\n\
\n\
int index = cisla.lastIndexOf(5);\n\
```\n\
\n\
Hodnota `5` se nachází na indexech `0` a `2`.\n\
\n\
Metoda `lastIndexOf(5)` proto vrátí hodnotu `2`.\n\
\n\
Pokud hledaná hodnota neexistuje, metoda vrátí `-1`.\n\
\n\
# Procházení ArrayList pomocí for\n\
Cyklus `for` umožňuje postupně přistupovat ke všem prvkům seznamu pomocí jejich indexů.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
for (int i = 0; i < cisla.size(); i++) {\n\
\    int hodnota = cisla.get(i);\n\
}\n\
```\n\
\n\
Proměnná `i` slouží jako počítadlo cyklu a současně jako index aktuálního prvku.\n\
\n\
Cyklus začíná na hodnotě `0` a pokračuje, dokud je počítadlo menší než aktuální velikost seznamu.\n\
\n\
Při každé iteraci metoda `get(i)` vrátí odpovídající hodnotu.\n\
\n\
Tento způsob je vhodný, pokud potřebujeme znát index právě zpracovávaného prvku nebo měnit hodnoty pomocí metody `set()`.\n\
\n\
# Procházení ArrayList pomocí for-each\n\
Cyklus `for-each` umožňuje postupně procházet všechny prvky seznamu bez ručního používání indexů.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
for (int cislo : cisla) {\n\
\    int vysledek = cislo * 2;\n\
}\n\
```\n\
\n\
Při každé iteraci se do proměnné `cislo` přiřadí další hodnota ze seznamu.\n\
\n\
Postupně se tedy zpracují hodnoty `10`, `20` a `30`.\n\
\n\
Zápis `int cislo : cisla` určuje, že proměnná `cislo` postupně získává jednotlivé prvky seznamu.\n\
\n\
Cyklus `for-each` je vhodný především pro čtení hodnot, pokud nepotřebujeme pracovat s jejich indexy.\n\
\n\
# Procházení ArrayList pomocí while\n\
Dynamický seznam můžeme procházet také pomocí cyklu `while`.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(10);\n\
cisla.add(20);\n\
cisla.add(30);\n\
\n\
int i = 0;\n\
\n\
while (i < cisla.size()) {\n\
\    int hodnota = cisla.get(i);\n\
\    i++;\n\
}\n\
```\n\
\n\
Program nejprve vytvoří počítadlo `i` s hodnotou `0`.\n\
\n\
Před každou iterací ověří, zda je index menší než aktuální počet prvků.\n\
\n\
Pokud podmínka platí, získá aktuální hodnotu a následně zvýší počítadlo o jedna.\n\
\n\
Jakmile počítadlo dosáhne velikosti seznamu, cyklus skončí.\n\
\n\
# Změna hodnot pomocí cyklu\n\
Cyklus `for` můžeme kombinovat s metodami `get()` a `set()` pro postupnou úpravu všech prvků seznamu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(1);\n\
cisla.add(2);\n\
cisla.add(3);\n\
\n\
for (int i = 0; i < cisla.size(); i++) {\n\
\    int hodnota = cisla.get(i);\n\
\    cisla.set(i, hodnota * 2);\n\
}\n\
```\n\
\n\
Program postupně přečte každý prvek seznamu, vynásobí jeho hodnotu dvěma a výsledek uloží na původní index.\n\
\n\
Původní seznam `[1, 2, 3]` se změní na `[2, 4, 6]`.\n\
\n\
Počet prvků zůstane stejný, protože metoda `set()` nemění velikost seznamu.\n\
\n\
# Odstraňování prvků během cyklu\n\
Při odstraňování prvků během procházení seznamu musíme počítat s tím, že se po odstranění změní indexy následujících prvků.\n\
\n\
Jedním z možných řešení je procházet seznam od posledního prvku směrem k prvnímu.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(1);\n\
cisla.add(2);\n\
cisla.add(3);\n\
cisla.add(4);\n\
cisla.add(5);\n\
\n\
for (int i = cisla.size() - 1; i >= 0; i--) {\n\
\    if (cisla.get(i) % 2 == 0) {\n\
\        cisla.remove(i);\n\
\    }\n\
}\n\
```\n\
\n\
Program postupně kontroluje všechny hodnoty a odstraňuje sudá čísla.\n\
\n\
Operátor `%` vrací zbytek po dělení. Pokud je zbytek po dělení dvěma roven nule, jedná se o sudé číslo.\n\
\n\
Po dokončení cyklu bude seznam obsahovat hodnoty `[1, 3, 5]`.\n\
\n\
Procházení odzadu zabraňuje nechtěnému přeskočení prvků při jejich odstraňování.\n\
\n\
# Odstraňování pomocí removeIf\n\
Metoda `removeIf()` umožňuje odstranit všechny prvky, které splňují zadanou podmínku.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(1);\n\
cisla.add(2);\n\
cisla.add(3);\n\
cisla.add(4);\n\
\n\
cisla.removeIf(cislo -> cislo % 2 == 0);\n\
```\n\
\n\
Tento příkaz odstraní všechna sudá čísla.\n\
\n\
Výsledný seznam bude obsahovat hodnoty `[1, 3]`.\n\
\n\
Zápis `cislo -> cislo % 2 == 0` představuje lambda výraz. Ten určuje podmínku, podle které metoda rozhoduje, zda má být určitý prvek odstraněn.\n\
\n\
Metoda `removeIf()` patří mezi pokročilejší možnosti práce s dynamickými seznamy.\n\
\n\
# Seřazení prvků – sort\n\
Metoda `sort()` umožňuje seřadit prvky seznamu podle zadaného pravidla.\n\
\n\
Pro jednoduché vzestupné řazení čísel můžeme použít přirozené pořadí pomocí argumentu `null`.\n\
\n\
```java\n\
ArrayList<Integer> cisla = new ArrayList<>();\n\
\n\
cisla.add(30);\n\
cisla.add(10);\n\
cisla.add(20);\n\
\n\
cisla.sort(null);\n\
```\n\
\n\
Původní seznam obsahuje hodnoty `[30, 10, 20]`.\n\
\n\
Po seřazení bude obsahovat `[10, 20, 30]`.\n\
\n\
Metoda `sort()` upravuje pořadí prvků přímo v existujícím seznamu.\n\
\n\
Pokud potřebujeme jiné pořadí, například sestupné, můžeme předat vlastní porovnávací pravidlo typu `Comparator`.\n\
\n\
# Kopírování ArrayList\n\
Proměnná typu `ArrayList` uchovává referenci na objekt seznamu.\n\
\n\
Pokud existující seznam přiřadíme do další proměnné, nevytvoří se automaticky jeho nezávislá kopie.\n\
\n\
```java\n\
ArrayList<Integer> a = new ArrayList<>();\n\
\n\
a.add(10);\n\
a.add(20);\n\
\n\
ArrayList<Integer> b = a;\n\
\n\
b.add(30);\n\
```\n\
\n\
Proměnné `a` a `b` nyní odkazují na stejný seznam.\n\
\n\
Pokud pomocí proměnné `b` přidáme hodnotu `30`, změna bude viditelná také prostřednictvím proměnné `a`.\n\
\n\
Pokud potřebujeme nový samostatný seznam se stejnými prvky, můžeme použít kopírovací konstruktor.\n\
\n\
```java\n\
ArrayList<Integer> b = new ArrayList<>(a);\n\
```\n\
\n\
Tím vytvoříme nový objekt seznamu obsahující stejné prvky.\n\
\n\
Přidávání a odstraňování prvků v jednom seznamu již nebude automaticky měnit druhý seznam.\n\
\n\
U seznamů obsahujících objekty se však samotné objekty tímto způsobem hluboce nekopírují. Oba seznamy mohou nadále obsahovat reference na stejné objekty.\n\
\n\
# Vnořené ArrayList\n\
`ArrayList` může obsahovat také další seznamy typu `ArrayList`.\n\
\n\
Tímto způsobem můžeme vytvářet složitější struktury, například seznamy seznamů, které reprezentují řádky tabulky nebo jednotlivé skupiny hodnot.\n\
\n\
```java\n\
ArrayList<ArrayList<Integer>> seznamy = new ArrayList<>();\n\
```\n\
\n\
Vnější seznam obsahuje prvky typu `ArrayList<Integer>`.\n\
\n\
Každý vnitřní seznam může uchovávat vlastní posloupnost celých čísel.\n\
\n\
Jednotlivé vnitřní seznamy nemusí mít stejný počet prvků a jejich velikost můžeme nezávisle měnit.\n\
\n\
# Vytvoření vnořeného seznamu\n\
Vnořené seznamy můžeme vytvářet postupně přidáváním jednotlivých vnitřních seznamů.\n\
\n\
```java\n\
ArrayList<ArrayList<Integer>> skupiny = new ArrayList<>();\n\
\n\
ArrayList<Integer> prvni = new ArrayList<>();\n\
prvni.add(10);\n\
prvni.add(20);\n\
\n\
ArrayList<Integer> druha = new ArrayList<>();\n\
druha.add(30);\n\
druha.add(40);\n\
\n\
skupiny.add(prvni);\n\
skupiny.add(druha);\n\
```\n\
\n\
Vnější seznam `skupiny` obsahuje dva prvky, kterými jsou další seznamy.\n\
\n\
První vnitřní seznam obsahuje hodnoty `[10, 20]`.\n\
\n\
Druhý vnitřní seznam obsahuje hodnoty `[30, 40]`.\n\
\n\
Jednotlivé hodnoty můžeme získat pomocí dvou volání metody `get()`.\n\
\n\
```java\n\
int hodnota = skupiny.get(1).get(0);\n\
```\n\
\n\
První volání `get(1)` vybere druhý vnitřní seznam.\n\
\n\
Druhé volání `get(0)` získá jeho první prvek.\n\
\n\
Proměnná `hodnota` bude obsahovat číslo `30`.\n\
\n\
# Procházení vnořeného ArrayList\n\
Vnořené seznamy můžeme procházet pomocí dvou cyklů `for`.\n\
\n\
```java\n\
for (int i = 0; i < skupiny.size(); i++) {\n\
\    ArrayList<Integer> skupina = skupiny.get(i);\n\
\n\
\    for (int j = 0; j < skupina.size(); j++) {\n\
\        int hodnota = skupina.get(j);\n\
\    }\n\
}\n\
```\n\
\n\
Vnější cyklus postupně prochází všechny vnitřní seznamy.\n\
\n\
Vnitřní cyklus následně prochází jednotlivé hodnoty aktuálně vybraného seznamu.\n\
\n\
Pomocí metody `size()` vždy zjistíme skutečný počet prvků příslušného seznamu.\n\
\n\
Tento způsob je vhodný například pro zpracování více skupin dat nebo seznamu samostatných úkolů.\n\
\n\
# ArrayList při programování robota\n\
Při ovládání robota můžeme `ArrayList` využívat k uchovávání různých hodnot potřebných během programu.\n\
\n\
Jedním z nejjednodušších příkladů je seznam směrů pohybu.\n\
\n\
```java\n\
ArrayList<Direction> trasa = new ArrayList<>();\n\
\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.DOWN);\n\
trasa.add(Direction.LEFT);\n\
```\n\
\n\
Seznam `trasa` obsahuje čtyři směry pohybu, které můžeme později vykonat ve stejném pořadí.\n\
\n\
Protože jde o dynamický seznam, můžeme jednotlivé směry kdykoliv přidat, změnit nebo odstranit.\n\
\n\
# Vykonání trasy pomocí ArrayList\n\
Připravený seznam směrů můžeme projít pomocí cyklu `for-each` a jednotlivé hodnoty předávat metodě `move()`.\n\
\n\
```java\n\
ArrayList<Direction> trasa = new ArrayList<>();\n\
\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.DOWN);\n\
trasa.add(Direction.LEFT);\n\
\n\
for (Direction smer : trasa) {\n\
\    move(smer);\n\
}\n\
```\n\
\n\
Cyklus postupně získává jednotlivé hodnoty typu `Direction`.\n\
\n\
Při každé iteraci předá aktuální směr metodě `move()`.\n\
\n\
Robot se tak postupně pokusí pohybovat doprava, doprava, dolů a doleva.\n\
\n\
Pokud jsou všechny pohyby úspěšné, robot skončí o jedno políčko doprava a jedno políčko dolů od počáteční polohy.\n\
\n\
# Dynamické sestavování trasy\n\
Seznam směrů nemusíme připravit celý předem. Můžeme ho postupně vytvářet podle aktuálních hodnot nebo podmínek.\n\
\n\
```java\n\
ArrayList<Direction> trasa = new ArrayList<>();\n\
\n\
int x = robotCoordinatesX();\n\
\n\
if (x < 5) {\n\
\    trasa.add(Direction.RIGHT);\n\
} else {\n\
\    trasa.add(Direction.LEFT);\n\
}\n\
\n\
trasa.add(Direction.DOWN);\n\
```\n\
\n\
Program nejprve vytvoří prázdný seznam a zjistí aktuální souřadnici X robota.\n\
\n\
Pokud je X menší než `5`, přidá do seznamu směr doprava. V opačném případě přidá směr doleva.\n\
\n\
Následně přidá také směr dolů.\n\
\n\
Výsledná trasa obsahuje dva směry, jejichž podoba závisí na skutečné poloze robota.\n\
\n\
Tento způsob je užitečný při plánování pohybu podle aktuální situace.\n\
\n\
# Změna připravené trasy\n\
Jednotlivé hodnoty uložené v seznamu směrů můžeme před vykonáním upravit.\n\
\n\
```java\n\
ArrayList<Direction> trasa = new ArrayList<>();\n\
\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.RIGHT);\n\
trasa.add(Direction.DOWN);\n\
\n\
trasa.set(1, Direction.TOP);\n\
trasa.add(Direction.LEFT);\n\
```\n\
\n\
Původní trasa obsahuje směry doprava, doprava a dolů.\n\
\n\
Metoda `set(1, Direction.TOP)` nahradí druhý směr doprava směrem nahoru.\n\
\n\
Metoda `add(Direction.LEFT)` následně přidá nový směr na konec seznamu.\n\
\n\
Výsledná trasa bude obsahovat `RIGHT`, `TOP`, `DOWN` a `LEFT`.\n\
\n\
Po dokončení úprav můžeme seznam projít a jednotlivé pohybové příkazy vykonat.\n\
\n\
# ArrayList pro zaznamenávání souřadnic\n\
`ArrayList` můžeme využít také k zaznamenávání skutečných souřadnic robota během vykonávání programu.\n\
\n\
Pro souřadnice X a Y můžeme vytvořit dva samostatné dynamické seznamy.\n\
\n\
```java\n\
ArrayList<Integer> historieX = new ArrayList<>();\n\
ArrayList<Integer> historieY = new ArrayList<>();\n\
\n\
historieX.add(robotCoordinatesX());\n\
historieY.add(robotCoordinatesY());\n\
\n\
move(Direction.RIGHT);\n\
\n\
historieX.add(robotCoordinatesX());\n\
historieY.add(robotCoordinatesY());\n\
```\n\
\n\
Program nejprve vytvoří dva prázdné seznamy.\n\
\n\
Do seznamu `historieX` ukládá hodnoty souřadnice X a do seznamu `historieY` ukládá hodnoty souřadnice Y.\n\
\n\
Nejprve zaznamená počáteční polohu robota. Po vykonání pohybového příkazu znovu zjistí skutečnou polohu a uloží ji jako další záznam.\n\
\n\
Hodnoty na stejných indexech obou seznamů představují souřadnice získané ve stejném okamžiku záznamu.\n\
\n\
Pokud robot narazí na překážku nebo hranici mapy, hra běh zastaví s chybou. Kód za chybným pohybem se již nevykoná, takže další záznam polohy nevznikne.\n\
\n\
# Získání souřadnic ze seznamu\n\
Uložené souřadnice můžeme později znovu načíst pomocí metody `get()`.\n\
\n\
```java\n\
int x = historieX.get(0);\n\
int y = historieY.get(0);\n\
```\n\
\n\
Program získá první zaznamenanou souřadnici X a první zaznamenanou souřadnici Y.\n\
\n\
Pokud potřebujeme získat poslední zaznamenanou polohu, můžeme použít aktuální velikost seznamu.\n\
\n\
```java\n\
int index = historieX.size() - 1;\n\
\n\
int x = historieX.get(index);\n\
int y = historieY.get(index);\n\
```\n\
\n\
Tento zápis předpokládá, že oba seznamy obsahují alespoň jeden záznam a jejich hodnoty byly ukládány společně ve stejném pořadí.\n\
\n\
# Nejčastější chyby při používání ArrayList\n\
Jednou z nejčastějších chyb je nesprávné indexování. První prvek seznamu má index `0`, nikoliv `1`.\n\
\n\
Pokud se pokusíme získat prvek na neexistujícím indexu, vznikne výjimka `IndexOutOfBoundsException`.\n\
\n\
Další častou chybou je použití nekompatibilního datového typu. Například do seznamu `ArrayList<Integer>` nelze běžným způsobem vložit textovou hodnotu typu `String`.\n\
\n\
Při práci se seznamy je také nutné rozlišovat mezi metodami `add()` a `set()`. Metoda `add()` přidává nový prvek, zatímco `set()` upravuje existující hodnotu.\n\
\n\
U metody `remove()` je důležité rozlišovat odstranění podle indexu a podle hodnoty, zejména u seznamů typu `ArrayList<Integer>`.\n\
\n\
Častou chybou bývá také pokus získat první nebo poslední prvek z prázdného seznamu. Před takovou operací je vhodné ověřit stav pomocí metody `isEmpty()`.\n\
\n\
Problémy mohou vzniknout také při přidávání nebo odstraňování prvků během procházení stejného seznamu pomocí cyklu `for-each`. Takové změny mohou způsobit výjimku `ConcurrentModificationException`.\n\
\n\
Důležité je také pamatovat na to, že přiřazení jednoho seznamu do jiné proměnné nevytvoří automaticky jeho nezávislou kopii.\n\
\n\
# Příklad kompletního programu\n\
Následující program ukazuje vytvoření dynamického seznamu směrů, přidávání prvků, změnu hodnoty, procházení seznamu pomocí cyklu `for-each` a zaznamenávání skutečné polohy robota.\n\
\n\
```java\n\
import java.util.ArrayList;\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\n\
\        // Vytvoření seznamu směrů\n\
\        ArrayList<Direction> trasa = new ArrayList<>();\n\
\n\
\        // Přidání jednotlivých pohybů\n\
\        trasa.add(Direction.RIGHT);\n\
\        trasa.add(Direction.RIGHT);\n\
\        trasa.add(Direction.DOWN);\n\
\        trasa.add(Direction.LEFT);\n\
\n\
\        // Změna posledního pohybu\n\
\        trasa.set(3, Direction.TOP);\n\
\n\
\        // Seznamy pro historii souřadnic\n\
\        ArrayList<Integer> historieX = new ArrayList<>();\n\
\        ArrayList<Integer> historieY = new ArrayList<>();\n\
\n\
\        // Uložení počáteční polohy\n\
\        historieX.add(robotCoordinatesX());\n\
\        historieY.add(robotCoordinatesY());\n\
\n\
\        // Vykonání připravené trasy\n\
\        for (Direction smer : trasa) {\n\
\            move(smer);\n\
\n\
\            // Zaznamenání aktuální polohy\n\
\            historieX.add(robotCoordinatesX());\n\
\            historieY.add(robotCoordinatesY());\n\
\        }\n\
\n\
\        // Zjištění počtu zaznamenaných poloh\n\
\        int pocetPoloh = historieX.size();\n\
\n\
\        // Poslední zaznamenaná poloha\n\
\        int index = pocetPoloh - 1;\n\
\n\
\        int x = historieX.get(index);\n\
\        int y = historieY.get(index);\n\
\    }\n\
}\n\
```\n\
\n\
Program nejprve vytvoří prázdný seznam `trasa` určený k ukládání hodnot typu `Direction`.\n\
\n\
Následně do něj postupně přidá směry doprava, doprava, dolů a doleva.\n\
\n\
Metoda `set(3, Direction.TOP)` změní poslední směr doleva na směr nahoru.\n\
\n\
Výsledná trasa tak obsahuje hodnoty `RIGHT`, `RIGHT`, `DOWN` a `TOP`.\n\
\n\
Program potom vytvoří dva dynamické seznamy `historieX` a `historieY`, které slouží k zaznamenávání skutečných souřadnic robota.\n\
\n\
Do obou seznamů nejprve uloží počáteční polohu robota.\n\
\n\
Následně cyklus `for-each` postupně prochází všechny směry uložené v seznamu `trasa` a předává je metodě `move()`.\n\
\n\
Po každém pohybovém příkazu program znovu zjistí aktuální souřadnice a přidá je do příslušných seznamů.\n\
\n\
Po dokončení cyklu obsahuje každý seznam historie pět záznamů: počáteční souřadnici a čtyři souřadnice zaznamenané po jednotlivých pohybových příkazech.\n\
\n\
Metoda `size()` zjistí počet zaznamenaných poloh a program vypočítá index posledního záznamu.\n\
\n\
Pomocí metody `get()` potom získá poslední zaznamenané souřadnice X a Y.\n\
\n\
Pokud jsou všechny pohyby úspěšné, robot skončí o dvě políčka doprava od své počáteční polohy a na stejné svislé souřadnici.\n\
\n\
Příklad ukazuje, jak můžeme pomocí `ArrayList` dynamicky sestavovat posloupnost příkazů, měnit jejich pořadí a ukládat informace získané během vykonávání programu.\n\
\n\
# Pravidla konkrétní úrovně\n\
V nekonečné úrovni jsou dostupné všechny zde popsané možnosti třídy `ArrayList`, včetně generických typů, vnořených seznamů, lambda výrazů, `removeIf()` a `sort()`.\n\
\n\
Výukové úrovně mohou podle zadání omezovat příkazy robota, cykly a podmínky. Tato omezení platí i při jejich použití společně se seznamem. Samotné metody standardního `ArrayList` se neomezují.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.
