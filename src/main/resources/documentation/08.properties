content=# Co jsou modifikátory přístupu\n\
Modifikátory přístupu určují, odkud je možné přistupovat k jednotlivým částem programu. Pomocí těchto klíčových slov můžeme řídit viditelnost tříd, metod, atributů a konstruktorů.\n\
\n\
V jazyce Java existují tři základní klíčová slova pro řízení přístupu: `public`, `private` a `protected`. Čtvrtou možností je výchozí přístup označovaný jako `package-private`, který vzniká tehdy, když neuvedeme žádný modifikátor přístupu.\n\
\n\
Modifikátory přístupu jsou důležitou součástí objektově orientovaného programování. Umožňují oddělit veřejně dostupné části programu od vnitřní implementace, která nemá být přímo přístupná ostatním třídám.\n\
\n\
# Modifikátor public\n\
Klíčové slovo `public` označuje veřejně přístupný prvek programu. Takto označenou třídu, metodu nebo atribut mohou používat také jiné třídy, pokud je daný prvek dostupný v rámci ostatních pravidel Javy.\n\
\n\
```java\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        // Hlavní metoda programu\n\
\    }\n\
}\n\
```\n\
\n\
V tomto příkladu je třída `Main` označena jako `public`, což znamená, že je veřejně přístupná.\n\
\n\
Také metoda `main` je označena jako `public`, aby ji mohlo spouštěcí prostředí vyvolat jako vstupní bod programu.\n\
\n\
Veřejný přístup je vhodný především pro metody a třídy, které mají být používány ostatními částmi programu.\n\
\n\
# Public u metod\n\
Modifikátor `public` můžeme použít také při vytváření vlastních metod.\n\
\n\
```java\n\
public class Main {\n\
\    public static void pozdrav() {\n\
\        System.out.println("Ahoj");\n\
\    }\n\
\n\
\    public static void main(String[] args) {\n\
\        pozdrav();\n\
\    }\n\
}\n\
```\n\
\n\
Metoda `pozdrav()` je veřejná. Může být proto volána také z jiné třídy, pokud je tato třída schopná přistupovat ke třídě `Main`.\n\
\n\
Protože je metoda současně označena jako `static`, lze ji zavolat přímo prostřednictvím názvu třídy.\n\
\n\
```java\n\
Main.pozdrav();\n\
```\n\
\n\
Klíčové slovo `public` zde určuje přístupnost metody, zatímco `static` určuje, že metoda patří přímo třídě a nevyžaduje vytvoření její instance.\n\
\n\
# Modifikátor private\n\
Klíčové slovo `private` označuje soukromý prvek programu. Takový prvek je přímo přístupný pouze uvnitř třídy, která jej deklaruje, s výjimkami vyplývajícími z pravidel vnořených tříd a souvisejících konstrukcí Javy.\n\
\n\
Používá se především pro vnitřní proměnné a pomocné metody, které nemají být přímo dostupné ostatním třídám.\n\
\n\
```java\n\
public class Main {\n\
\    private static int pocetKroku = 0;\n\
\n\
\    public static void main(String[] args) {\n\
\        pocetKroku = 5;\n\
\    }\n\
}\n\
```\n\
\n\
Proměnná `pocetKroku` je označena jako `private`, a proto k ní mohou přímo přistupovat metody deklarované uvnitř třídy `Main`.\n\
\n\
Jiná běžná samostatná třída nemůže tuto proměnnou přímo číst ani měnit pomocí zápisu `Main.pocetKroku`.\n\
\n\
Soukromý přístup pomáhá chránit vnitřní stav objektů a zabraňuje nechtěným změnám hodnot z jiných částí programu.\n\
\n\
# Private u metod\n\
Modifikátor `private` můžeme použít také pro pomocné metody, které potřebujeme volat pouze uvnitř určité třídy.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    private static void krokDoprava() {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
\n\
\    public static void main(String[] args) {\n\
\        krokDoprava();\n\
\        krokDoprava();\n\
\    }\n\
}\n\
```\n\
\n\
Metoda `krokDoprava()` je soukromá, ale metoda `main` ji může používat, protože obě patří do stejné třídy.\n\
\n\
Program postupně dvakrát zavolá pomocnou metodu, která obsahuje příkaz pohybu doprava.\n\
\n\
Pokud se jiná samostatná třída pokusí zavolat `Main.krokDoprava()`, přístup nebude povolen, protože metoda má modifikátor `private`.\n\
\n\
Soukromé metody jsou užitečné zejména při rozdělování složitějšího programu na menší pomocné části.\n\
\n\
# Modifikátor protected\n\
Klíčové slovo `protected` poskytuje chráněný přístup. Používá se především při práci s dědičností mezi třídami.\n\
\n\
Prvky označené jako `protected` jsou přístupné uvnitř stejného balíčku a také v potomcích dané třídy za podmínek stanovených jazykem Java.\n\
\n\
```java\n\
class RobotZaklad {\n\
\    protected int energie = 100;\n\
}\n\
\n\
class RobotPomocnik extends RobotZaklad {\n\
\    public void zobrazEnergii() {\n\
\        System.out.println(energie);\n\
\    }\n\
}\n\
```\n\
\n\
Třída `RobotZaklad` obsahuje atribut `energie`, který je označen jako `protected`.\n\
\n\
Třída `RobotPomocnik` používá klíčové slovo `extends`, které označuje dědičnost. Díky tomu je potomkem třídy `RobotZaklad` a může přistupovat ke zděděnému chráněnému atributu.\n\
\n\
Na rozdíl od `private` tedy `protected` umožňuje využití členů také v potomcích. Mimo balíček však platí další omezení přístupu, zejména způsob, jakým potomek přistupuje ke zděděnému členu.\n\
\n\
# Protected u metod\n\
Chráněný přístup můžeme použít také u metod, které mají být dostupné potomkům třídy.\n\
\n\
```java\n\
class ZakladniRobot {\n\
\    protected void inicializace() {\n\
\        System.out.println("Inicializace robota");\n\
\    }\n\
}\n\
\n\
class NovyRobot extends ZakladniRobot {\n\
\    public void spusteni() {\n\
\        inicializace();\n\
\    }\n\
}\n\
```\n\
\n\
Metoda `inicializace()` je označena jako `protected`.\n\
\n\
Potomek `NovyRobot` ji může zavolat, protože ji zdědil od rodičovské třídy `ZakladniRobot`.\n\
\n\
Tento způsob přístupu se používá například při vytváření tříd, které mají společnou funkcionalitu, ale zároveň umožňují potomkům určité části rozšiřovat nebo upravovat.\n\
\n\
# Výchozí přístup package-private\n\
Pokud u třídy nebo jejího členu neuvedeme žádný modifikátor přístupu, použije Java výchozí přístup označovaný jako `package-private`.\n\
\n\
Takový prvek je přístupný pouze třídám nacházejícím se ve stejném balíčku neboli `package`.\n\
\n\
```java\n\
class Pomocnik {\n\
\    int hodnota = 10;\n\
\n\
\    void provedAkci() {\n\
\        System.out.println("Akce provedena");\n\
\    }\n\
}\n\
```\n\
\n\
Třída `Pomocnik`, atribut `hodnota` i metoda `provedAkci()` nemají uvedený žádný modifikátor přístupu.\n\
\n\
Všechny tyto prvky proto používají přístup `package-private`.\n\
\n\
Ostatní třídy ve stejném balíčku k nim mohou přistupovat. Třídy z jiných balíčků je však nemohou běžným způsobem přímo používat.\n\
\n\
Důležité je, že `package-private` není klíčové slovo Javy. Tento přístup vzniká automaticky vynecháním modifikátoru.\n\
\n\
# Co je package\n\
Balíček neboli `package` slouží v Javě k organizaci tříd a dalších typů do logických skupin.\n\
\n\
Balíčky umožňují rozdělovat rozsáhlejší programy na samostatné části a zároveň ovlivňují pravidla přístupnosti některých prvků.\n\
\n\
```java\n\
package sklad;\n\
\n\
class Pomocnik {\n\
\    int pocet = 5;\n\
}\n\
```\n\
\n\
Třída `Pomocnik` patří do balíčku `sklad`.\n\
\n\
Protože atribut `pocet` nemá uvedený modifikátor přístupu, mohou k němu přistupovat ostatní třídy ve stejném balíčku.\n\
\n\
Třída umístěná v jiném balíčku k tomuto atributu nemůže přímo přistupovat pouze na základě jeho názvu.\n\
\n\
Deklarace `package` se zapisuje na začátku zdrojového souboru před importy a deklaracemi tříd, kromě případných komentářů a dalších povolených úvodních prvků.\n\
\n\
# Přehled modifikátorů přístupu\n\
Jednotlivé modifikátory poskytují různé úrovně viditelnosti.\n\
\n\
`public` umožňuje přístup ze všech tříd, pokud jsou splněna ostatní pravidla přístupnosti.\n\
\n\
`protected` umožňuje přístup v rámci stejného balíčku a také v potomcích třídy podle pravidel dědičnosti.\n\
\n\
`package-private` umožňuje přístup pouze v rámci stejného balíčku.\n\
\n\
`private` omezuje přímý přístup na třídu, která prvek deklaruje, s pravidly platnými pro vnořené třídy.\n\
\n\
Zjednodušeně lze rozsah přístupu v běžných třídách seřadit od nejširšího po nejužší jako `public`, `protected`, `package-private` a `private`.\n\
\n\
# Přístupnost tříd\n\
Modifikátory přístupu můžeme používat také při deklaraci tříd. U běžné vrcholové třídy, tedy třídy deklarované mimo jinou třídu, jsou však povoleny pouze možnosti `public` a `package-private`.\n\
\n\
```java\n\
public class Main {\n\
}\n\
```\n\
\n\
Tento zápis vytváří veřejnou třídu `Main`.\n\
\n\
```java\n\
class PomocnaTrida {\n\
}\n\
```\n\
\n\
Druhý zápis vytváří třídu s přístupem `package-private`.\n\
\n\
Vrcholovou třídu nelze v Javě deklarovat jako `private` nebo `protected`. Tyto modifikátory se však mohou používat u příslušných vnořených tříd.\n\
\n\
Pokud je veřejná vrcholová třída uložena v běžném zdrojovém souboru Java, musí název souboru odpovídat názvu této veřejné třídy, například `Main.java`.\n\
\n\
# Přístupnost metod\n\
Metody mohou používat všechny čtyři úrovně přístupu. Výběr modifikátoru určuje, odkud lze danou metodu volat.\n\
\n\
```java\n\
public class Main {\n\
\    public static void verejnaMetoda() {\n\
\    }\n\
\n\
\    private static void soukromaMetoda() {\n\
\    }\n\
\n\
\    protected static void chranenaMetoda() {\n\
\    }\n\
\n\
\    static void balickovaMetoda() {\n\
\    }\n\
\n\
\    public static void main(String[] args) {\n\
\        verejnaMetoda();\n\
\        soukromaMetoda();\n\
\        chranenaMetoda();\n\
\        balickovaMetoda();\n\
\    }\n\
}\n\
```\n\
\n\
V uvedeném příkladu jsou všechny čtyři metody přístupné z metody `main`, protože se nacházejí uvnitř stejné třídy.\n\
\n\
Rozdíl mezi jejich modifikátory se projeví především tehdy, pokud se je pokusíme volat z jiné třídy nebo jiného balíčku.\n\
\n\
Samotný modifikátor přístupu tedy nebrání použití soukromé metody uvnitř její vlastní třídy.\n\
\n\
# Přístupnost proměnných a atributů\n\
Modifikátory přístupu lze použít také u atributů neboli členských proměnných třídy.\n\
\n\
```java\n\
public class Main {\n\
\    public static int verejnaHodnota = 10;\n\
\    private static int soukromaHodnota = 20;\n\
\    protected static int chranenaHodnota = 30;\n\
\    static int balickovaHodnota = 40;\n\
}\n\
```\n\
\n\
Atribut `verejnaHodnota` je veřejně přístupný.\n\
\n\
Atribut `soukromaHodnota` je soukromý a nelze k němu přímo přistupovat z běžné jiné samostatné třídy.\n\
\n\
Atribut `chranenaHodnota` je přístupný ve stejném balíčku a v odpovídajících případech také potomkům třídy.\n\
\n\
Atribut `balickovaHodnota` je přístupný pouze třídám nacházejícím se ve stejném balíčku.\n\
\n\
Modifikátory přístupu tím umožňují kontrolovat, které části programu mohou přímo číst nebo měnit uložené hodnoty.\n\
\n\
# Přístupnost konstruktorů\n\
Modifikátory přístupu lze použít také u konstruktorů. Konstruktor slouží k inicializaci objektu při vytváření nové instance třídy.\n\
\n\
```java\n\
class RobotData {\n\
\    private int energie;\n\
\n\
\    public RobotData(int hodnota) {\n\
\        energie = hodnota;\n\
\    }\n\
}\n\
```\n\
\n\
Konstruktor `RobotData(int hodnota)` je veřejný, takže jej mohou použít také jiné třídy, které mají přístup ke třídě `RobotData`.\n\
\n\
```java\n\
RobotData data = new RobotData(100);\n\
```\n\
\n\
Příkaz `new` vytváří novou instanci třídy a zavolá její konstruktor.\n\
\n\
Konstruktor může být také `private`, `protected` nebo `package-private`. Tím lze omezit, odkud mohou být objekty dané třídy vytvářeny.\n\
\n\
# Zapouzdření – encapsulation\n\
Zapouzdření je základní princip objektově orientovaného programování. Spočívá v oddělení vnitřních dat objektu od způsobu, jakým s nimi mohou pracovat ostatní části programu.\n\
\n\
V Javě se zapouzdření často vytváří pomocí soukromých atributů `private` a veřejných metod `public`, které poskytují kontrolovaný přístup k jejich hodnotám.\n\
\n\
```java\n\
class RobotStav {\n\
\    private int energie = 100;\n\
\n\
\    public int getEnergie() {\n\
\        return energie;\n\
\    }\n\
\n\
\    public void setEnergie(int novaEnergie) {\n\
\        if (novaEnergie >= 0) {\n\
\            energie = novaEnergie;\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
Atribut `energie` je označen jako `private`, takže jej nelze z běžné jiné samostatné třídy přímo měnit.\n\
\n\
Veřejná metoda `getEnergie()` umožňuje jeho hodnotu přečíst.\n\
\n\
Veřejná metoda `setEnergie()` umožňuje hodnotu změnit, ale pouze tehdy, pokud nová hodnota není záporná.\n\
\n\
Díky tomu může třída kontrolovat, jakým způsobem ostatní části programu pracují s jejími daty.\n\
\n\
# Metody getter a setter\n\
Metody používané ke čtení a změně soukromých atributů se často označují jako `getter` a `setter`.\n\
\n\
Getter obvykle vrací hodnotu určitého atributu, zatímco setter umožňuje jeho změnu.\n\
\n\
```java\n\
class RobotStav {\n\
\    private int pocetKroku = 0;\n\
\n\
\    public int getPocetKroku() {\n\
\        return pocetKroku;\n\
\    }\n\
\n\
\    public void setPocetKroku(int hodnota) {\n\
\        if (hodnota >= 0) {\n\
\            pocetKroku = hodnota;\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
Metoda `getPocetKroku()` vrací aktuální hodnotu soukromého atributu.\n\
\n\
Metoda `setPocetKroku()` umožňuje jeho změnu, pokud nová hodnota splňuje stanovenou podmínku.\n\
\n\
Používání těchto metod není povinné pro každý atribut. Slouží především k tomu, aby třída mohla kontrolovat přístup ke svým vnitřním datům.\n\
\n\
# Rozdíl mezi public a private\n\
Modifikátory `public` a `private` představují dvě výrazně odlišné úrovně přístupu.\n\
\n\
Veřejný prvek `public` je určen k použití také z jiných tříd. Soukromý prvek `private` je naopak součástí vnitřní implementace třídy.\n\
\n\
```java\n\
class Pocitadlo {\n\
\    private int hodnota = 0;\n\
\n\
\    public void zvys() {\n\
\        hodnota++;\n\
\    }\n\
\n\
\    public int getHodnota() {\n\
\        return hodnota;\n\
\    }\n\
}\n\
```\n\
\n\
Atribut `hodnota` nelze z jiné běžné samostatné třídy přímo změnit.\n\
\n\
Můžeme však zavolat veřejnou metodu `zvys()`, která jeho hodnotu zvýší o jedna.\n\
\n\
Tento přístup umožňuje chránit vnitřní stav objektu a současně zpřístupnit vybrané operace ostatním třídám.\n\
\n\
# Rozdíl mezi public a protected\n\
Modifikátor `public` poskytuje širší přístup než `protected`.\n\
\n\
Veřejné členy mohou být používány také z jiných balíčků, pokud je jejich deklarující typ přístupný.\n\
\n\
Chráněné členy jsou určeny především pro použití uvnitř stejného balíčku a ve třídách, které dědí od příslušné rodičovské třídy.\n\
\n\
Modifikátor `protected` je proto vhodný tehdy, když potřebujeme umožnit potomkům využívat určitou funkcionalitu, ale nechceme ji zpřístupnit všem ostatním třídám.\n\
\n\
# Rozdíl mezi protected a package-private\n\
Modifikátory `protected` a `package-private` umožňují přístup v rámci stejného balíčku.\n\
\n\
Hlavní rozdíl spočívá v dědičnosti mezi balíčky.\n\
\n\
Člen označený jako `protected` může být za stanovených podmínek přístupný také potomkovi z jiného balíčku.\n\
\n\
Člen s přístupem `package-private` je naproti tomu dostupný pouze v rámci stejného balíčku, a to i v případě, že od jeho třídy dědí jiná třída nacházející se mimo tento balíček.\n\
\n\
# Modifikátory přístupu a static\n\
Klíčové slovo `static` není modifikátorem viditelnosti. Neurčuje, odkud lze k prvku přistupovat, ale zda daný člen patří přímo třídě, nebo její instanci.\n\
\n\
Modifikátory přístupu lze s `static` kombinovat.\n\
\n\
```java\n\
public class Main {\n\
\    public static int hodnotaA = 10;\n\
\    private static int hodnotaB = 20;\n\
\n\
\    public static void main(String[] args) {\n\
\        int soucet = hodnotaA + hodnotaB;\n\
\    }\n\
}\n\
```\n\
\n\
Oba atributy jsou statické a patří přímo třídě `Main`.\n\
\n\
Atribut `hodnotaA` je veřejný, zatímco atribut `hodnotaB` je soukromý.\n\
\n\
To znamená, že `static` a modifikátory přístupu řeší dvě odlišné vlastnosti programu.\n\
\n\
Podobně ani klíčová slova `final` nebo `abstract` nejsou modifikátory viditelnosti, protože určují jiné vlastnosti deklarovaných prvků.\n\
\n\
# Lokální proměnné a viditelnost\n\
Modifikátory přístupu `public`, `private` a `protected` nelze používat u běžných lokálních proměnných uvnitř metod.\n\
\n\
```java\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int pocet = 5;\n\
\    }\n\
}\n\
```\n\
\n\
Proměnná `pocet` je lokální proměnnou metody `main`.\n\
\n\
Její dostupnost určuje oblast platnosti neboli *scope*, nikoliv modifikátor přístupu.\n\
\n\
Lokální proměnnou tedy běžně nemůžeme označit jako `public int pocet` nebo `private int pocet`, protože takový zápis není uvnitř metody povolen.\n\
\n\
Lokální proměnné jsou dostupné pouze v příslušné oblasti kódu, ve které byly deklarovány, podle pravidel platnosti proměnných v Javě.\n\
\n\
# Oblast platnosti proměnných\n\
Oblast platnosti určuje, ve které části programu můžeme používat určitou proměnnou.\n\
\n\
```java\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int x = 5;\n\
\n\
\        if (x > 0) {\n\
\            int y = 10;\n\
\            x = x + y;\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
Proměnná `x` je deklarována uvnitř metody `main` a lze ji používat také ve vnořeném bloku `if`.\n\
\n\
Proměnná `y` je však deklarována uvnitř bloku `if`, a proto ji nelze používat mimo tento blok.\n\
\n\
Viditelnost členů třídy a oblast platnosti lokálních proměnných jsou tedy dva odlišné principy.\n\
\n\
# Modifikátory přístupu v programu robota\n\
Při programování robota používáme základní strukturu obsahující veřejnou třídu `Main` a veřejnou statickou metodu `main`.\n\
\n\
```java\n\
import static robot.api.Robot.*;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        move(Direction.RIGHT);\n\
\    }\n\
}\n\
```\n\
\n\
Modifikátor `public` u třídy `Main` určuje její veřejnou přístupnost.\n\
\n\
Modifikátor `public` u metody `main` umožňuje její vyvolání jako hlavní metody programu.\n\
\n\
Příkaz `move(Direction.RIGHT);` používá metodu zpřístupněnou prostřednictvím Robot API.\n\
\n\
Pokud konkrétní úroveň umožňuje vytvářet vlastní metody nebo atributy, můžeme u nich používat také další modifikátory přístupu podle jejich účelu a pravidel Javy.\n\
\n\
# Nejčastější chyby při používání modifikátorů\n\
Častou chybou je pokus o přístup k soukromému atributu nebo metodě z jiné samostatné třídy. Pokud je člen označen jako `private`, není takový přímý přístup povolen.\n\
\n\
Další chybou bývá použití modifikátorů `private` nebo `protected` u vrcholové třídy. Běžná vrcholová třída může být pouze `public` nebo mít výchozí přístup `package-private`.\n\
\n\
Problémy mohou vzniknout také při záměně modifikátoru `protected` s přístupem `package-private`. Přestože mají podobné chování uvnitř stejného balíčku, odlišují se pravidly přístupu při dědičnosti mezi balíčky.\n\
\n\
Nesprávné je rovněž používání modifikátorů přístupu u lokálních proměnných uvnitř metod.\n\
\n\
Důležité je také nezaměňovat `public`, `private` a `protected` s klíčovým slovem `static`. Každé z nich určuje jinou vlastnost prvku programu.\n\
\n\
# Pravidla konkrétní úrovně\n\
Jednotlivé úrovně mohou omezovat vytváření vlastních tříd, metod, atributů nebo používání konkrétních modifikátorů přístupu.\n\
\n\
Základní struktura programu s třídou `Main` a metodou `main` zůstává v tomto prostředí zachována podle požadavků zadání.\n\
\n\
Dokumentace je společná pro všechny úrovně, proto některé zde popsané možnosti nemusí být v konkrétní lekci dostupné. Vždy se řiďte zadáním aktuální úrovně.