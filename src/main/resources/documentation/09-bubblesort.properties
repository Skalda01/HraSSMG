content=# Bubble sort v Javě\n\
Program obsahuje běžnou třídu Main, metodu main a vstupní pole int[]. Celý třídicí algoritmus píše hráč standardními prostředky Javy.\n\
\n\
# Práce s polem\n\
`pole.length` je počet prvků. Výraz `pole[i]` přečte hodnotu na indexu i. Přiřazení `pole[i] = hodnota;` tuto hodnotu přepíše. První index je 0, poslední `pole.length - 1`.\n\
\n\
# Porovnávání a výměna\n\
Načtené hodnoty porovnávejte Java operátory `>`, `<` nebo `==` a výsledek použijte v podmínce if. Před přepsáním prvku si původní hodnotu uložte do dočasné proměnné. Potom můžete zapsat druhou hodnotu na první index a uloženou hodnotu na druhý.\n\
\n\
Vlastní metody můžete pojmenovat například compare nebo swap, ale jejich těla musíte napsat sami. Pole jim předávejte jako parametr typu int[].\n\
\n\
# Princip algoritmu\n\
Bubble sort opakovaně prochází sousední prvky. Při nesprávném pořadí je vymění. Největší zbývající hodnota tím doputuje na konec nesetříděné části. V dalším průchodu již tento poslední prvek nemusíte zpracovávat.\n\
\n\
# Canvas a ovládání\n\
Hra automaticky sleduje operace nad původním vstupním polem. Čtení zvýrazní modře a zápis animuje oranžově. Počítadla zobrazují počet čtení a zápisů. Vaše Java pole je skutečným zdrojem dat pro canvas.\n\
F5 spouští a pozastavuje běh, F6 provede jednu operaci. Posuvník mění rychlost. Reset obnoví stejné vstupní pole a zachová váš kód.\n\
\n\
# Dokončení\n\
Program musí skončit se vzestupně seřazeným vstupním polem. Všechny původní hodnoty i jejich počty musí zůstat zachovány. Vstupní deklaraci ponechte podle zadání. Zdrojový program lze přeložit a spustit běžným javac a java i mimo hru.
