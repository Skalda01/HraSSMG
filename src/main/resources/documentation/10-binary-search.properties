id=binary-search
title=Binary search v čisté Javě
description=Seřazené pole, půlení intervalu a index nalezené hodnoty.
order=100
content=# Binární vyhledávání\n\
Binary search hledá hodnotu ve vzestupně seřazeném poli. V každém kroku zkontroluje prostřední prvek zbývajícího intervalu a podle jeho hodnoty vyřadí jednu polovinu.\n\
\n\
# Běžná Java\n\
Používejte `int[]`, přístup `pole[index]`, `pole.length`, celočíselné proměnné, cyklus a podmínky. Vlastní pomocné metody si můžete napsat sami.\n\
\n\
# Hranice a střed\n\
Počáteční levá hranice je 0, pravá je `pole.length - 1`. Prostřední index můžete spočítat jako `leva + (prava - leva) / 2`.\n\
Pokud je prostřední hodnota menší než hledaná, posuňte levou hranici za střed. Pokud je větší, posuňte pravou hranici před střed. Při shodě jste našli správný index.\n\
\n\
# Výsledek\n\
V úrovni Binary search uložte nalezený index do lokální proměnné `int vysledek` v metodě main. Pokud hledaná hodnota chybí, správný výsledek je -1. Po skončení programu hra ověří tento výsledek i zachování vstupního pole.\n\
\n\
# Canvas\n\
Zvýrazněný prvek odpovídá skutečnému čtení vašeho programu. Zelený pás ukazuje zbývající interval, tmavé prvky již vyřazenou část. Modré body ukazují kontrolované indexy. F5 spouští a pozastavuje, F6 krokuje a posuvník mění rychlost.\n\
\n\
# Časté chyby\n\
Po neúspěšném porovnání musí nová hranice střed vynechat, jinak se interval nemusí zmenšit. Indexy jsou od nuly. Když je levá hranice větší než pravá, interval je prázdný. Hledání nesmí přepisovat prvky vstupního pole.
