content=# Random a Math\n\
\n\
Ve hráčově programu můžeš používat standardní knihovny Javy. Random vytváří náhodné hodnoty, Math nabízí matematické funkce a konstanty. Fungují v robotích úrovních i v úrovních s polem. Pravidla konkrétní lekce dál omezují její řídicí konstrukce a příkazy Robot API.\n\
\n\
# Vytvoření Random\n\
Třídu Random importuj pomocí import java.util.Random;. Potom vytvoř objekt new Random(). Bez importu můžeš použít celý název java.util.Random.\n\
\n\
```java\n\
import java.util.Random;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        Random nahoda = new Random();\n\
\        int kostka = nahoda.nextInt(1, 7);\n\
\        System.out.println(kostka);\n\
\    }\n\
}\n\
```\n\
\n\
nextInt(1, 7) vrací celé číslo od 1 do 6. Spodní hranice do intervalu patří, horní už ne. nextInt(10) vrací hodnoty 0 až 9.\n\
\n\
# Běžné metody Random\n\
nextInt() vrací int z celého jeho rozsahu.\n\
nextInt(pocet) vrací int od 0 včetně do pocet bez horní hranice. Pocet musí být kladný.\n\
nextInt(od, doExclusive) vrací int z intervalu [od, doExclusive). Dolní hranice musí být menší než horní.\n\
nextDouble() vrací double od 0 včetně do 1 bez horní hranice.\n\
nextDouble(od, doExclusive) vrací double ze zadaného intervalu.\n\
nextFloat() vrací float od 0 včetně do 1 bez horní hranice.\n\
nextLong() vrací náhodný long a nextBoolean() vrací true nebo false.\n\
nextGaussian() vrací double s normálním rozdělením, průměrem 0 a směrodatnou odchylkou 1.\n\
\n\
# Stejný seed, stejná posloupnost\n\
new Random(42L) vytvoří generátor se zadaným seedem. Se stejným seedem a stejným pořadím volání dostaneš stejné hodnoty. To se hodí při ladění. setSeed(42L) nastaví seed existujícího generátoru znovu.\n\
\n\
Vytvoř generátor jednou před cyklem a opakovaně ho používej. Když uvnitř cyklu pokaždé vytvoříš new Random(42L), budeš opakovat začátek stejné posloupnosti.\n\
\n\
# Math nepotřebuje import\n\
Math je součást java.lang, který Java zpřístupňuje automaticky. Metody jsou statické: volej Math.sqrt(9), nevytvářej new Math().\n\
\n\
Math.abs(-7) vrací absolutní hodnotu 7. U Integer.MIN_VALUE a Long.MIN_VALUE se kladný výsledek nevejde do stejného typu.\n\
Math.min(3, 8) vrací 3, Math.max(3, 8) vrací 8.\n\
Math.clamp(15, 0, 10) vrací 10; hodnotu omezí na interval včetně obou hranic.\n\
Math.sqrt(9) vrací druhou odmocninu 3.0, Math.cbrt(8) třetí odmocninu 2.0.\n\
Math.pow(2, 3) vrací mocninu 8.0. Operátor ^ v Javě není mocnina; u celých čísel znamená bitové XOR.\n\
Math.hypot(3, 4) vrací délku přepony 5.0.\n\
Math.PI a Math.E jsou konstanty typu double; nepíší se za ně závorky.\n\
\n\
# Zaokrouhlování\n\
Math.round(2.6) vrací long 3. Při argumentu typu float vrací int.\n\
Math.floor(2.6) vrací double 2.0, Math.ceil(2.1) vrací double 3.0.\n\
U záporných čísel jde floor směrem k minus nekonečnu: Math.floor(-2.1) vrací -3.0. Převod (int)-2.1 místo toho odstraní desetinnou část a vrátí -2.\n\
\n\
# Úhly a další funkce\n\
Math.sin, Math.cos a Math.tan používají radiány. Stupně převedeš pomocí Math.toRadians, radiány pomocí Math.toDegrees.\n\
Math.log vrací přirozený logaritmus, Math.log10 dekadický logaritmus a Math.exp(x) vypočítá e na x.\n\
\n\
# Náhodná hodnota pomocí Math\n\
Math.random() vrací double z intervalu [0, 1). Pro náhodné celé číslo s jasně stanovenými hranicemi použij raději Random.nextInt. Pro reprodukovatelné pokusy použij Random se seedem.\n\
\n\
# Použití s polem\n\
Následující běžný Java program vytvoří a vypíše šest čísel. Při experimentování v úkolu Naplň pole vytvoř pole se šesti nulami; při zápisu náhodných hodnot uvidíš jednotlivé změny v canvasu. Pro splnění úkolu pak musí výsledné hodnoty i konzole opět odpovídat jeho zadání.\n\
\n\
```java\n\
import java.util.Random;\n\
\n\
public class Main {\n\
\    public static void main(String[] args) {\n\
\        int[] pole = new int[6];\n\
\        Random nahoda = new Random(42L);\n\
\        for (int i = 0; i < pole.length; i++) {\n\
\            pole[i] = Math.max(2, nahoda.nextInt(1, 13));\n\
\            System.out.println(pole[i]);\n\
\        }\n\
\    }\n\
}\n\
```\n\
\n\
# Našeptávač\n\
Za Math. nabídne funkce i konstanty. Za proměnnou deklarovanou jako Random nebo var s new Random() nabídne metody generátoru. Zkratka newrandom vloží deklaraci java.util.Random nahoda = new java.util.Random();. Vše zůstává standardní Java a žádné další závislosti nemusíš instalovat.
