assignment=# První směna\n\
\n\
V této úrovni používáš pouze `move`, `pick` a `drop`. Napiš vlastní příkazy do připravené metody `main`.\n\
\n\
# Cíl úrovně\n\
Přesuň robota na polici, vezmi jeden balík, přesuň se na zelený dock a odevzdej balík pomocí `drop()`.\n\
\n\
# Rozmístění skladu\n\
Sklad má rozměry 10 × 10 políček. Počáteční poloha robota je [2,3], regál se součástkami se nachází na [4,3] a expedice na [0,3]. Regál obsahuje jeden balíček. Ve skladu nejsou žádné překážky.\n\
Souřadnice se počítají od nuly z levého horního rohu. Hodnota X roste doprava a hodnota Y směrem dolů.\n\
\n\
# Povolené příkazy\n\
Používej pouze příkazy `move`, `pick` a `drop`. Cykly, podmínky a dotazy na stav robota nejsou v této úrovni povolené. Výpis do konzole se zde nepožaduje.\n\
`move(Direction.RIGHT);` přesune robota o jedno políčko doprava. Pro ostatní směry použijte `Direction.LEFT`, `Direction.TOP` nebo `Direction.DOWN`.\n\
`pick();` sebere jeden balíček z regálu na aktuálním políčku.\n\
`drop();` odevzdá nesený balíček na expedici.\n\
\n\
# Princip řešení\n\
Robot vykonává příkazy v pořadí, v jakém jsou zapsány. Každé volání `move()` provede právě jeden krok. Pro delší přesun zapište příkaz opakovaně.\n\
Jednotlivé příkazy ukončujte středníkem a zapisujte je do metody `main` třídy `Main`.\n\
\n\
```java\n\
move(Direction.RIGHT);\n\
pick();\n\
```\n\
\n\
Ukázka představuje zápis dvou příkazů. Jejich použití přizpůsobte skutečné poloze robota a regálu.\n\
\n\
# Postup řešení\n\
1. Přesuňte robota ze startu [2,3] na regál [4,3] dvěma kroky doprava.\n\
2. Na políčku regálu zavolejte `pick();`.\n\
3. Přesuňte robota na expedici [0,3] čtyřmi kroky doleva.\n\
4. Na políčku expedice zavolejte `drop();`.\n\
\n\
# Pravidla a dokončení\n\
Robot může nést nejvýše jeden balíček. Sebrání je možné pouze na regálu s dostupným zbožím; odevzdání je možné pouze na expedici. Pohyb mimo sklad není povolen.\n\
Úroveň je dokončena po doručení jednoho balíčku součástek. Poté pokračujte tlačítkem Další level.\n\
\n\
# Ovládání\n\
Program spusťte nebo pozastavte klávesou F5. Pro jednotlivé kroky použijte F6. Klávesovou zkratkou Ctrl+R obnovte počáteční stav skladu.\n\
Tlačítko Reset kódu obnoví počáteční program této úrovně. Předchozí obsah editoru lze vrátit pomocí Ctrl+Z.
