assignment=# Opakování práce\n\
\n\
Tato úroveň je zaměřena na použití cyklu `for` při opakovaném doručování zásilek.\n\
\n\
# Cíl úrovně\n\
Doruč tři balíky součástek z police na zelený dock. Doporučujeme použít cyklus `for`, který zopakuje celou cestu, vyzvednutí a odevzdání třikrát.\n\
\n\
# Rozmístění skladu\n\
Sklad má rozměry 10 × 10 políček. Robot začíná přímo na docku [0,3]. Police se součástkami je na [4,3] a obsahuje tři balíky. Objednávka požaduje doručení všech tří balíků. Ve skladu nejsou žádné překážky.\n\
Souřadnice se počítají od nuly z levého horního rohu. Hodnota X roste doprava a hodnota Y směrem dolů.\n\
\n\
# Povolené příkazy\n\
Používejte příkazy `move`, `pick` a `drop` a řídicí konstrukci `for`. Ostatní příkazy a podmínky nejsou v této úrovni povoleny.\n\
`move(Direction.RIGHT);` provede jeden krok doprava. Pro ostatní směry použijte `Direction.LEFT`, `Direction.TOP` nebo `Direction.DOWN`.\n\
`pick();` sebere jeden balíček z regálu na aktuálním políčku.\n\
`drop();` odevzdá nesený balíček na expedici.\n\
\n\
# Princip řešení\n\
Cyklus `for` opakuje příkazy uzavřené ve složených závorkách. Obsahuje počáteční nastavení počítadla, podmínku pokračování a změnu počítadla po každém opakování.\n\
\n\
```java\n\
for (int krok = 0; krok < 4; krok++) {\n\
\    move(Direction.LEFT);\n\
}\n\
```\n\
\n\
Zápis `int krok = 0` vytvoří celočíselné počítadlo s počáteční hodnotou nula. Podmínka `krok < 4` umožní opakování pro hodnoty 0, 1, 2 a 3. Výraz `krok++` zvýší počítadlo o jedna.\n\
Ukázka provede čtyři kroky doleva. Použijte ji pouze tehdy, pokud uvedená trasa z aktuální polohy zůstává uvnitř skladu.\n\
Cyklus může obsahovat další cyklus. Vnější cyklus může opakovat doručení zásilky a vnitřní cyklus jednotlivé kroky robota. Pro každý cyklus použijte vlastní počítadlo.\n\
\n\
# Postup řešení\n\
1. Robot začíná na docku. Žádný úvodní přesun před opakováním nepotřebuješ.\n\
2. Vytvoř cyklus `for` se třemi opakováními. Každé opakování začíná i končí na docku [0,3].\n\
3. V každém opakování udělej čtyři kroky doprava na polici, zavolej `pick()`, vrať se čtyřmi kroky doleva na dock a zavolej `drop()`.\n\
4. Pohyb o více políček vyjádřete vnitřním cyklem nebo opakovanými příkazy `move()`.\n\
5. Ověřte, že každé opakování končí ve stejné pozici, ze které má začít následující opakování.\n\
\n\
# Pravidla a dokončení\n\
Robot může nést nejvýše jeden balíček. Sebrání je možné pouze na regálu s dostupným zbožím; odevzdání je možné pouze na expedici. Pohyb mimo sklad není povolen.\n\
Po odevzdání balíku zůstává robot na docku [0,3], takže může ihned začít další stejné opakování. Robot se mezi opakováními nikam automaticky nepřesouvá.\n\
Úroveň je dokončena po doručení tří balíčků součástek. Poté pokračujte tlačítkem Další level.\n\
\n\
# Ovládání\n\
Program spusťte nebo pozastavte klávesou F5. Pro jednotlivé kroky použijte F6. Klávesovou zkratkou Ctrl+R obnovte počáteční stav skladu.\n\
Tlačítko Reset kódu obnoví počáteční program této úrovně. Předchozí obsah editoru lze vrátit pomocí Ctrl+Z.
