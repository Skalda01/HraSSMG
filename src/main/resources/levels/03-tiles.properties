assignment=# Obvod šachovnice\n\
Na prázdné šachovnici 5 × 5 stojí pouze robot. Začíná na [0,0], v levém horním rohu. Nejsou zde žádné police, dock ani překážky.\n\
\n\
# Tvůj úkol\n\
Obejdi celý vnější obvod šachovnice a vrať se na výchozí políčko [0,0]. Na každém políčku obvodu vypiš do konzole jeho skutečné souřadnice ve tvaru `tile(x,y)`.\n\
\n\
Počáteční políčko na začátku vypiš jako `tile(0,0)`. Když se na něj po obejití celého obvodu vrátíš, souřadnice už neopakuj. Místo duplicitního výpisu vypiš pouze `HOTOVO` a program ukonči.\n\
\n\
# Souřadnice ve výpisu\n\
Nejprve se zapisuje X (sloupec), potom Y (řádek). Na souřadnicích [2,0] proto vypíšeš `tile(2,0)`. Mezi čísly a čárkou nejsou mezery.\n\
\n\
```java\n\
System.out.println("tile(" + robotCoordinatesX() + "," + robotCoordinatesY() + ")");\n\
```\n\
\n\
Zkratka `sout` v našeptávači vloží běžné volání `System.out.println(...)`. Skutečný výstup uvidíš v záložce Konzole.\n\
\n\
# Trasa po obvodu\n\
Můžeš jet po směru hodinových ručiček nebo proti němu. Zůstaň na vnějším okraji šachovnice a postupně projeď všechny čtyři strany. Vnitřními políčky nejezdi.\n\
\n\
Na obvodu je 16 různých políček. Každé z nich vypiš právě jednou, včetně počátečního políčka při startu. Pro opakování kroků doporučujeme cyklus `for`; povolené jsou také `while`, `if` a `else`.\n\
\n\
# Návrat na začátek\n\
Jakmile obejdeš celý obvod a robot je opět na [0,0], vypiš následující řádek místo dalšího `tile(0,0)`:\n\
\n\
```java\n\
System.out.println("HOTOVO");\n\
```\n\
\n\
`HOTOVO` je poslední výpis. Za ním už nenásleduje další pohyb ani další řádek konzole.\n\
\n\
# Kontrola řešení\n\
Hra kontroluje skutečnou polohu robota u každého výpisu, návštěvu všech 16 políček obvodu i návrat na start. Pouhé vypsání souřadnic bez pohybu nestačí.\n\
\n\
Chybějící nebo opakované souřadnice, pohyb mimo obvod, předčasné `HOTOVO` a výpis `tile(0,0)` po návratu znamenají nesplněný úkol.\n\
\n\
Program musí úspěšně skončit. Import, třída `Main` a prázdná metoda `main` jsou připravené; doplň pouze vlastní řešení do těla metody.
