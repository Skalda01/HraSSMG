assignment=# Vlastní navigace\n\
\n\
V předchozích úrovních ses naučil pohybovat robotem, používat cyklus for a opakovat příkazy. Nyní se naučíš vytvářet vlastní metody, které dokážou vykonávat složitější úkoly.\n\
\n\
# Tvůj úkol\n\
Vytvoř vlastní metodu presunNa(int x, int y), která přesune robota na zadané souřadnice.\n\
\n\
Metoda musí fungovat bez ohledu na aktuální polohu robota. Nesmíš používat žádný vestavěný příkaz pro přímý přesun na souřadnice. Veškerý pohyb musí probíhat pomocí move(Direction).\n\
\n\
Jakmile metodu dokončíš, použije ji připravený program k doručení 2 balíčků součástek a 1 balíčku elektroniky.\n\
\n\
# Mapa\n\
Sklad má 10 sloupců a 10 řádků.\n\
Robot začíná na [2,3].\n\
Regál součástek je na [4,2] a obsahuje 2 balíčky.\n\
Regál elektroniky je na [4,5] a obsahuje 1 balíček.\n\
Expedice se nachází na [0,3].\n\
Ve skladu nejsou žádné překážky.\n\
\n\
# 1. Co je vlastní metoda?\n\
Metoda je pojmenovaný blok kódu, který vykonává určitou činnost.\n\
\n\
Například metoda pick() sebere balíček a metoda move() pohybuje robotem.\n\
\n\
V Javě si ale můžeš vytvořit také vlastní metodu. To znamená, že naprogramuješ několik příkazů a přiřadíš jim společný název.\n\
\n\
Potom stačí tuto metodu zavolat a její příkazy se vykonají.\n\
\n\
# 2. Jak vytvořit metodu?\n\
static void presunNa(int x, int y) { ... }\n\
\n\
static – znamená, že metoda patří třídě a může být volána z metody main bez vytvoření objektu.\n\
void – znamená, že metoda nevrací žádnou hodnotu.\n\
presunNa – název metody, který si programátor zvolil.\n\
int – datový typ pro celá čísla.\n\
x – první parametr obsahující cílovou souřadnici X.\n\
y – druhý parametr obsahující cílovou souřadnici Y.\n\
Čárka odděluje jednotlivé parametry.\n\
Kulaté závorky obsahují parametry metody.\n\
Složené závorky obsahují příkazy, které metoda vykonává.\n\
\n\
# 3. Co jsou parametry?\n\
Parametry umožňují předávat metodě různé hodnoty.\n\
\n\
Například presunNa(4, 2); zavolá metodu s hodnotami x = 4 a y = 2.\n\
\n\
Při zavolání presunNa(0, 3); dostane stejná metoda hodnoty x = 0 a y = 3.\n\
\n\
Díky parametrům nemusíš pro každou cílovou pozici vytvářet samostatnou metodu.\n\
\n\
# 4. Jak zjistit aktuální polohu robota?\n\
robotCoordinatesX() vrací aktuální souřadnici X robota.\n\
robotCoordinatesY() vrací aktuální souřadnici Y robota.\n\
\n\
Pokud robot stojí na [2,3], první metoda vrátí 2 a druhá 3.\n\
\n\
Tyto metody robota neposouvají. Pouze zjišťují jeho aktuální polohu.\n\
\n\
# 5. Jak funguje cyklus while?\n\
Cyklus while opakuje příkazy, dokud je zadaná podmínka pravdivá.\n\
\n\
Například:\n\
while (robotCoordinatesX() < 4) { move(Direction.RIGHT); }\n\
\n\
Tento cyklus bude posouvat robota doprava, dokud nedosáhne souřadnice X = 4.\n\
\n\
while – klíčové slovo pro opakování příkazů.\n\
robotCoordinatesX() – zjistí aktuální souřadnici X.\n\
< – operátor znamenající menší než.\n\
4 – hodnota, se kterou porovnáváme aktuální souřadnici.\n\
move(Direction.RIGHT) – posune robota o jedno políčko doprava.\n\
\n\
Před každým opakováním se podmínka znovu vyhodnotí. Jakmile přestane platit, cyklus skončí.\n\
\n\
# 6. Jak naprogramovat navigaci?\n\
Nejprve zjisti, jestli se robot nachází vlevo nebo vpravo od cílové pozice.\n\
\n\
Pokud je aktuální X menší než cílové x, musí se robot pohybovat doprava.\n\
Pokud je aktuální X větší než cílové x, musí se pohybovat doleva.\n\
\n\
Potom vyřeš svislý pohyb.\n\
\n\
Pokud je aktuální Y menší než cílové y, robot se musí pohybovat dolů.\n\
Pokud je aktuální Y větší než cílové y, musí se pohybovat nahoru.\n\
\n\
Každý směr můžeš vyřešit pomocí samostatného cyklu while.\n\
\n\
# 7. Proč je vlastní metoda užitečná?\n\
Bez vlastní metody bys musel pokaždé zapisovat několik pohybových příkazů.\n\
\n\
S vlastní metodou stačí napsat presunNa(4, 2); nebo presunNa(0, 3); a program automaticky vykoná potřebné pohyby.\n\
\n\
Metodu můžeš používat opakovaně a pro různé cílové souřadnice.\n\
\n\
# 8. Jak splnit úroveň?\n\
V editoru najdi nedokončenou metodu presunNa(int x, int y).\n\
\n\
Doplň do ní cykly while pro pohyb doprava, doleva, nahoru a dolů.\n\
\n\
Používej metody robotCoordinatesX(), robotCoordinatesY() a příkaz move(Direction).\n\
\n\
Potom spusť program a sleduj, jestli robot správně doručí všechny tři zásilky.\n\
\n\
# Výzva\n\
Tvoje metoda musí zvládnout pohyb ve všech čtyřech směrech.\n\
Musí fungovat z libovolné počáteční pozice na mapě bez překážek.\n\
Pokud robot už stojí na cílovém políčku, metoda nesmí vykonat žádný pohyb.\n\
\n\
# Dokončení\n\
Úroveň je splněná po doručení 2 balíčků součástek a 1 balíčku elektroniky.\n\
\n\
F5 spustí program, F6 provede krok a Ctrl+R resetuje sklad.

documentation=# Dokumentace\n\
\n\
# Vlastní metoda\n\
V Javě můžeš definovat vlastní metody, které potom voláš z jiných částí programu.\n\
\n\
# Deklarace metody\n\
static void presunNa(int x, int y) { ... }\n\
\n\
static – metoda patří třídě.\n\
void – metoda nevrací hodnotu.\n\
presunNa – název metody.\n\
int x – první celočíselný parametr.\n\
int y – druhý celočíselný parametr.\n\
{ } – tělo metody.\n\
\n\
# Volání metody\n\
presunNa(4, 2);\n\
Předá hodnotu 4 do parametru x a hodnotu 2 do parametru y.\n\
\n\
# Aktuální souřadnice robota\n\
robotCoordinatesX() – vrací aktuální X.\n\
robotCoordinatesY() – vrací aktuální Y.\n\
\n\
# Cyklus while\n\
while (podminka) { ... }\n\
Opakuje příkazy, dokud podmínka platí.\n\
\n\
# Ukázka pohybu\n\
while (robotCoordinatesX() < 5) { move(Direction.RIGHT); }\n\
Robot se pohybuje doprava, dokud nedosáhne sloupce 5.\n\
\n\
# Směry pohybu\n\
Direction.RIGHT – doprava, X se zvyšuje.\n\
Direction.LEFT – doleva, X se snižuje.\n\
Direction.DOWN – dolů, Y se zvyšuje.\n\
Direction.TOP – nahoru, Y se snižuje.\n\
\n\
# Porovnávací operátory\n\
< – menší než.\n\
> – větší než.\n\
== – rovná se.\n\
!= – nerovná se.\n\
\n\
# Manipulace\n\
pick() – sebere jeden balíček z aktuálního regálu.\n\
drop() – odevzdá nesený balíček na expedici.\n\
\n\
# Důležité\n\
Robot API nabízí pro pohyb pouze move(Direction).\n\
Jedná se o vlastní metodu definovanou ve třídě Main.\n\
Pohyb robota musí být realizován výhradně pomocí move(Direction).\n\
\n\
# Časté chyby\n\
Pokud zapomeneš na některý směr, robot nemusí dosáhnout všech cílů.\n\
Pokud špatně nastavíš podmínku while, robot se může pohybovat nesprávně nebo se program nemusí ukončit.\n\
Pokud porovnáváš X místo Y, robot se může pohybovat špatným směrem.\n\
\n\
# Ovládání\n\
F5 – spuštění a pozastavení.\n\
F6 – vykonání jednoho kroku.\n\
Ctrl+R – reset skladu.\n\
Reset kódu – obnovení počátečního programu.\n\
F1 – dokumentace.\n\
\n\
# Další úroveň\n\
V další úrovni využiješ vlastní navigační metodu při řešení složitějšího skladového úkolu.
