assignment=# Bludiště se switch\n\
\n\
Robot stojí na [0,0]. Dostaň ho jedinou průchozí cestou do modrého políčka CÍL na [2,4]. Souřadnice zapisujeme jako [x,y].\n\
\n\
# Pravidla\n\
Směr pohybu vybírej pomocí konstrukce switch. Hra kontroluje, že je v programu opravdu použitý switch; zmínka v komentáři nebo řetězci nestačí.\n\
\n\
Cyklus for je povolený pro opakování kroků. Konstrukce if, else, while a do-while v této úrovni povolené nejsou. Pro pohyb použij move(Direction). Žádné balíky nesbíráš ani neodevzdáváš.\n\
\n\
# Jak začít\n\
Prohlédni si chodbu a rozděl cestu na rovné úseky. Celá cesta ze startu do cíle měří 30 kroků a obsahuje sedm rovných úseků.\n\
\n\
Můžeš použít for a switch nad číslem úseku. Každý case vybere směr a počet kroků úseku; vnitřní for potom provede pohyb. Jinou možností je switch nad číslem kroku nebo aktuální polohou.\n\
\n\
# Zápis switch v Javě\n\
```java\n\
switch (usek) {\n\
\    case 0 -> {\n\
\        // Příkazy prvního úseku.\n\
\    }\n\
\    default -> {\n\
\        // Ostatní hodnoty.\n\
\    }\n\
}\n\
```\n\
\n\
U zápisu case ... -> není potřeba break. Při použití klasického case ... : ukonči větev pomocí break, aby program nepokračoval další větví.\n\
\n\
# Směry a souřadnice\n\
Direction.RIGHT zvyšuje x, Direction.LEFT snižuje x. Direction.DOWN zvyšuje y, Direction.TOP snižuje y. Polohu zjistíš pomocí robotCoordinatesX() a robotCoordinatesY().\n\
\n\
# Dokončení\n\
Program musí úspěšně skončit s robotem na [2,4]. Nesmíš projít zdí ani opustit mapu. Výpis do konzole není potřeba. F5 spustí program, F6 provede jeden krok a Ctrl+R vrátí robota na start.
