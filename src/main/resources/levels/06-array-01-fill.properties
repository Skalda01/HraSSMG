assignment=# 1. Naplň pole\n\
\n\
# Zadání\n\
Vytvoř pole šesti celých čísel a naplň ho postupně hodnotami 3, 6, 9, 12, 15, 18. Potom vypiš všechny jeho prvky.\n\
\n\
# Vstup\n\
V editoru je kostra třídy Main s metodou main.\n\
```java\n\
int[] pole = new int[6];\n\
```\n\
\n\
# Požadovaný výsledek\n\
Výsledek vypiš do konzole pomocí System.out.println přesně v tomto tvaru:\n\
```text\n\
3\n\
6\n\
9\n\
12\n\
15\n\
18\n\
```\n\
Dodrž text, mezery a pořadí řádků. Metoda main nic nevrací.\n\
\n\
# Podmínky splnění\n\
Program musí úspěšně skončit. Hra zkontroluje výsledný obsah pole [3, 6, 9, 12, 15, 18] a požadovaný výpis.
