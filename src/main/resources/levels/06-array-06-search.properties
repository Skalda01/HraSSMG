assignment=# 6. Hledání čísla\n\
\n\
# Zadání\n\
Zjisti, zda vstupní pole obsahuje číslo 12, a vypiš index jeho prvního výskytu. Indexy začínají od 0. Pokud hledané číslo v poli není, výsledný index má být -1.\n\
\n\
# Vstup\n\
V metodě main je připravené toto pole:\n\
```java\n\
int[] pole = {3, 6, 9, 12, 15, 18};\n\
```\n\
\n\
# Požadovaný výsledek\n\
Výsledek vypiš do konzole pomocí System.out.println přesně v tomto tvaru:\n\
```text\n\
Index: 3\n\
```\n\
Dodrž text, mezery a pořadí řádků. Desetinná čísla zapisuj s tečkou. Metoda main nic nevrací.\n\
\n\
# Podmínky splnění\n\
Program musí úspěšně skončit. Hra zkontroluje požadovaný výpis a to, že vstupní pole zůstalo beze změny.
