assignment=# 8. Posuň hodnoty\n\
\n\
# Zadání\n\
Posuň všechny prvky vstupního pole o jednu pozici doprava. Poslední prvek přesuň na začátek. Změň přímo původní pole.\n\
\n\
# Vstup\n\
V metodě main je připravené toto pole:\n\
```java\n\
int[] pole = {3, 6, 9, 12, 15, 18};\n\
```\n\
\n\
# Požadovaný výsledek\n\
Po skončení programu musí původní pole obsahovat:\n\
```text\n\
[18, 3, 6, 9, 12, 15]\n\
```\n\
Výsledkem je změna původního pole. Výpis do konzole se nevyhodnocuje a metoda main nic nevrací.\n\
\n\
# Podmínky splnění\n\
Program musí úspěšně skončit. Hra zkontroluje výsledný obsah původního pole; vytvoření jiného pole se správnými hodnotami úkol nesplní.
