assignment=# Sandbox\n\
\n\
# Zadání\n\
Piš vlastní Java programy a experimentuj s poli. Velikost i hodnoty pole int[] určuje tvůj kód. Můžeš vytvářet další pole, měnit odkazy na ně, předávat je metodám, počítat, řadit i vypisovat výsledky.\n\
\n\
# Vstup\n\
Editor obsahuje kostru třídy Main s metodou main. Vytvoř pole pomocí new int[pocet] nebo zápisem hodnot do složených závorek. Délka není předepsaná konfigurací úrovně.\n\
\n\
# Zobrazení v canvasu\n\
Canvas zobrazuje aktuálně používané int[] a přizpůsobí se jeho skutečné délce. Každé pole má své číslo. Při práci s jiným polem se zobrazení přepne; přiřazení nového pole nebo Arrays.copyOf může délku změnit.\n\
\n\
Modrá označuje čtení, oranžová zápis. Velká pole procházej šipkami pod canvasem nebo kolečkem myši nad ním. Při provádění kódu se automaticky zobrazí stránka s právě používaným indexem.\n\
\n\
# Výsledek\n\
Sandbox nemá předepsaný výsledek ani kontrolovaný výpis. Metoda main nic nevrací. Konzole zobrazuje to, co tvůj program vypíše. Po skončení programu zůstane poslední stav pole na canvasu.\n\
\n\
# Ovládání\n\
F5 spustí nebo pozastaví program. F6 provede další operaci nad polem. Posuvník upravuje rychlost animace. Ctrl+R vymaže canvas a zachová kód. Používej běžnou Javu včetně vlastních metod, Random, Math a knihovních operací s poli.
