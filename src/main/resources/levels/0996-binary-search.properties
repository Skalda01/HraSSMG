assignment=# Binary Search – Binární vyhledávání\n\
\n\
Vaším úkolem je implementovat **Binary Search (binární vyhledávání)** v čisté Javě. V metodě `main` máte připravené vzestupně seřazené pole `int[]` a hledanou hodnotu uloženou v proměnné `cil`.\n\
\n\
Cílem je najít index hledané hodnoty, aniž byste museli postupně kontrolovat všechny prvky pole.\n\
\n\
# Co je Binary Search?\n\
\n\
Binární vyhledávání je efektivní algoritmus pro hledání hodnot v **seřazeném poli**.\n\
\n\
Na rozdíl od lineárního vyhledávání, které kontroluje prvky postupně jeden po druhém, Binary Search při každém kroku rozdělí zbývající oblast hledání přibližně na dvě poloviny.\n\
\n\
Podle hodnoty prostředního prvku rozhodne, ve které polovině může být hledaná hodnota. Druhou polovinu okamžitě vyřadí.\n\
\n\
Díky tomu dokáže vyhledávat velmi rychle i v rozsáhlých polích.\n\
\n\
**Základní podmínka:** Pole musí být seřazené podle stejného pravidla, které algoritmus používá při porovnávání. V této úloze je seřazené vzestupně.\n\
\n\
# Jak algoritmus funguje?\n\
\n\
Představte si následující pole:\n\
\n\
`[2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35, 38, 41, 44]`\n\
\n\
Naším cílem je najít hodnotu `38`.\n\
\n\
Na začátku nastavíme levou hranici na první index pole a pravou hranici na poslední index.\n\
\n\
**První krok:**\n\
\n\
Prohledávaný interval obsahuje indexy 0 až 14.\n\
\n\
Prostřední index je 7 a na něm se nachází hodnota 23.\n\
\n\
Protože `23 < 38`, víme, že hledaná hodnota nemůže ležet v levé polovině ani na prostředním indexu.\n\
\n\
Pokračujeme pouze na indexech 8 až 14.\n\
\n\
**Druhý krok:**\n\
\n\
Nový prostřední index je 11. Nachází se na něm hodnota 35.\n\
\n\
Protože `35 < 38`, znovu vyřadíme levou část aktuálního intervalu.\n\
\n\
Zbývají indexy 12 až 14.\n\
\n\
**Třetí krok:**\n\
\n\
Prostřední index je 13. Hodnota na tomto indexu je 41.\n\
\n\
Protože `41 > 38`, hledaná hodnota musí být vlevo od prostředního indexu.\n\
\n\
Zbývá pouze index 12.\n\
\n\
**Čtvrtý krok:**\n\
\n\
Na indexu 12 se nachází hodnota 38.\n\
\n\
Hledaná hodnota byla nalezena. Algoritmus uloží index `12` a ukončí hledání.\n\
\n\
**Výsledek:** `vysledek = 12`\n\
\n\
Algoritmus našel hledanou hodnotu pomocí pouhých **4 kontrolovaných prvků**, přestože pole obsahuje 15 hodnot.\n\
\n\
# Princip půlení intervalu\n\
\n\
Binary Search pracuje se třemi důležitými indexy:\n\
\n\
**Levá hranice** označuje začátek oblasti, ve které se hledaná hodnota ještě může nacházet.\n\
\n\
**Pravá hranice** označuje konec této oblasti.\n\
\n\
**Prostřední index** označuje prvek, který algoritmus v aktuálním kroku kontroluje.\n\
\n\
Po každém porovnání nastane jedna ze tří situací.\n\
\n\
Pokud je prostřední hodnota **rovna cíli**, hledání je úspěšně dokončeno.\n\
\n\
Pokud je prostřední hodnota **menší než cíl**, pokračujeme v pravé polovině. Nová levá hranice bude o jeden index za prostředním prvkem.\n\
\n\
Pokud je prostřední hodnota **větší než cíl**, pokračujeme v levé polovině. Nová pravá hranice bude o jeden index před prostředním prvkem.\n\
\n\
V každém kroku se tedy vyřadí přibližně polovina zbývajících kandidátů.\n\
\n\
# Vstup a výsledek\n\
\n\
Pracujte s běžným Java polem `int[] pole`.\n\
\n\
Počet prvků zjistíte pomocí `pole.length`. K jednotlivým hodnotám přistupujete prostřednictvím `pole[index]`.\n\
\n\
Hledaná hodnota se nachází v proměnné `cil`.\n\
\n\
Do již připravené lokální proměnné `int vysledek` uložte index nalezeného prvku.\n\
\n\
Pokud hledaná hodnota v poli neexistuje, musí být výsledkem `-1`.\n\
\n\
Například pokud hledáme hodnotu 38, výsledkem je index 12. Pokud bychom hledali hodnotu 100, výsledkem by bylo -1.\n\
\n\
Pozor na rozdíl mezi **indexem** a **hodnotou**. Výsledkem není nalezené číslo, ale jeho pozice v poli.\n\
\n\
Pole ani hledanou hodnotu podle zadání neměňte.\n\
\n\
# Vaše implementace\n\
\n\
Výchozí kód obsahuje pouze deklaraci pole, hledané hodnoty a proměnné pro výsledek.\n\
\n\
Vaším úkolem je samostatně vytvořit proměnné pro levou a pravou hranici intervalu, cyklus pro opakované hledání, výpočet prostředního indexu a podmínky pro porovnávání.\n\
\n\
Prostřední index lze vypočítat například jako:\n\
\n\
`int stred = levy + (pravy - levy) / 2;`\n\
\n\
Tento výpočet je bezpečnější než `(levy + pravy) / 2`, protože předchází možnému přetečení při sčítání velkých indexů.\n\
\n\
Používejte standardní Java cykly, podmínky, operátory a proměnné.\n\
\n\
Můžete také napsat vlastní pomocnou metodu, které předáte pole a hledanou hodnotu a která vrátí nalezený index.\n\
\n\
Hledání musí správně fungovat i v situaci, kdy hledaná hodnota v poli není.\n\
\n\
# Kdy algoritmus skončí?\n\
\n\
Binární vyhledávání může skončit dvěma způsoby.\n\
\n\
**Úspěšné hledání:** Prostřední hodnota odpovídá hledanému cíli. Algoritmus uloží nalezený index a hledání ukončí.\n\
\n\
**Neúspěšné hledání:** Levá hranice překročí pravou hranici. To znamená, že již neexistuje žádný prvek, ve kterém by se hledaná hodnota mohla nacházet.\n\
\n\
V takovém případě ponechte nebo nastavte `vysledek = -1`.\n\
\n\
Správné ukončení cyklu je důležité. Při chybné aktualizaci hranic může program opakovaně kontrolovat stejný prvek a nikdy neskončit.\n\
\n\
# Časová složitost – Big O notace\n\
\n\
**Big O notace** popisuje, jak roste potřebné množství práce algoritmu v závislosti na velikosti vstupu.\n\
\n\
Počet prvků označujeme písmenem `n`.\n\
\n\
U Binary Search rozlišujeme následující případy:\n\
\n\
**Nejlepší případ – O(1)**\n\
\n\
Hledaná hodnota se nachází přesně uprostřed pole. Algoritmus ji najde hned při prvním porovnání.\n\
\n\
Počet potřebných kroků nezávisí na velikosti pole.\n\
\n\
**Průměrný případ – O(log n)**\n\
\n\
Hledaná hodnota se nachází na různých pozicích v poli nebo v poli vůbec není.\n\
\n\
Algoritmus opakovaně zmenšuje prohledávaný interval přibližně na polovinu.\n\
\n\
**Nejhorší případ – O(log n)**\n\
\n\
Hledaná hodnota se nachází na pozici, ke které se algoritmus dostane až po maximálním počtu půlení, případně v poli neexistuje.\n\
\n\
I v tomto případě je počet potřebných kroků velmi malý vzhledem k velikosti pole.\n\
\n\
# Co znamená O(log n)?\n\
\n\
Zápis `O(log n)` označuje **logaritmickou časovou složitost**.\n\
\n\
Protože Binary Search v každém kroku přibližně půlí interval, používáme logaritmus o základu 2.\n\
\n\
Například:\n\
\n\
`16 → 8 → 4 → 2 → 1`\n\
\n\
`1024 → 512 → 256 → ... → 1`\n\
\n\
Pro pole obsahující přibližně 1 000 prvků stačí v nejhorším případě asi 10 kontrolovaných prvků.\n\
\n\
Pro přibližně 1 000 000 prvků je potřeba asi 20 kontrol.\n\
\n\
Pro přibližně 1 000 000 000 prvků stačí asi 30 kontrol.\n\
\n\
To je hlavní výhoda logaritmické složitosti: při výrazném zvětšení vstupu roste počet kroků velmi pomalu.\n\
\n\
Pokud například zdvojnásobíme počet prvků, maximální počet potřebných porovnání se zvýší nejvýše o jeden.\n\
\n\
# Porovnání s lineárním vyhledáváním\n\
\n\
**Linear Search – O(n)**\n\
\n\
Lineární vyhledávání postupně kontroluje jednotlivé prvky pole. V nejhorším případě musí projít celé pole.\n\
\n\
Pro pole s 1 000 000 prvky tak může potřebovat až 1 000 000 kontrol.\n\
\n\
**Binary Search – O(log n)**\n\
\n\
Binární vyhledávání využívá seřazenost pole a opakovaně zmenšuje interval.\n\
\n\
Pro stejné pole s 1 000 000 prvky stačí nejvýše přibližně 20 kontrol.\n\
\n\
Binary Search je proto velmi efektivní při vyhledávání v rozsáhlých seřazených datech.\n\
\n\
Jeho nevýhodou je požadavek na seřazené vstupní pole. Pokud data nejsou seřazená, je potřeba je nejprve seřadit nebo zvolit jiný vyhledávací algoritmus.\n\
\n\
# Paměťová složitost – O(1)\n\
\n\
Při použití běžného cyklu má Binary Search pomocnou paměťovou složitost **O(1)**, tedy konstantní.\n\
\n\
Algoritmus nepotřebuje vytvářet další pole. Stačí mu několik proměnných pro hranice intervalu, prostřední index a případný výsledek.\n\
\n\
Paměťová náročnost těchto pomocných proměnných se s počtem prvků nezvyšuje.\n\
\n\
Existuje také rekurzivní varianta Binary Search, při které metoda opakovaně volá sama sebe. Ta má kvůli zásobníku volání pomocnou paměťovou složitost O(log n).\n\
\n\
V této úloze je vhodnější implementace pomocí cyklu.\n\
\n\
# Další vlastnosti algoritmu\n\
\n\
Binary Search je **vyhledávací algoritmus založený na porovnávání hodnot**.\n\
\n\
Při hledání pouze čte prvky pole a nemění jejich pořadí ani hodnoty.\n\
\n\
Využívá strategii **rozděl a panuj (Divide and Conquer)**. Rozdělí problém na menší části a pokračuje pouze v té části, která může obsahovat řešení.\n\
\n\
Stejný princip se používá také v dalších algoritmech, například při třídění Merge Sort.\n\
\n\
Pokud se v seřazeném poli některá hodnota vyskytuje vícekrát, běžný Binary Search může vrátit libovolný index s touto hodnotou. Nemusí tedy automaticky najít první nebo poslední výskyt.\n\
\n\
V aktuálním zadání se každá hodnota vyskytuje právě jednou.\n\
\n\
# Na co si dát pozor?\n\
\n\
**Správné hranice intervalu:** První index pole je 0 a poslední index je `pole.length - 1`. Pokud omylem použijete `pole.length` jako poslední platný index, můžete přistoupit mimo pole.\n\
\n\
**Správný výpočet středu:** Prostřední index musí být celé číslo. Při dělení dvou hodnot typu `int` Java automaticky použije celočíselné dělení.\n\
\n\
**Aktualizace hranic:** Pokud prostřední hodnota neodpovídá cíli, musíte prostřední index ze zbývajícího intervalu vyřadit. Jinak může algoritmus opakovaně kontrolovat stejné místo.\n\
\n\
**Správný směr hledání:** Pokud je prostřední hodnota menší než hledaná hodnota, pokračujte doprava. Pokud je větší, pokračujte doleva.\n\
\n\
**Nenalezená hodnota:** Nezapomeňte na situaci, kdy se hledaná hodnota v poli nevyskytuje. Výsledkem musí zůstat -1.\n\
\n\
**Seřazenost pole:** Algoritmus předpokládá vzestupně seřazená data. Pokud hodnoty nebudou seřazené, rozhodování o vyřazení poloviny pole nemusí být správné.\n\
\n\
# Živý canvas\n\
\n\
Canvas automaticky sleduje každé skutečné čtení prvku vstupního pole.\n\
\n\
**Modré zvýraznění** označuje právě kontrolovaný prvek. Modré body ukazují indexy, které již algoritmus během hledání navštívil.\n\
\n\
Po porovnání kontrolované hodnoty s cílem se animuje zúžení intervalu. Prvky, které již nemohou obsahovat hledanou hodnotu, postupně ztmavnou.\n\
\n\
**Zelené zvýraznění** označuje úspěšné nalezení hledané hodnoty.\n\
\n\
Sledujte především to, jak se po každé kontrole zmenšuje počet zbývajících kandidátů.\n\
\n\
Na rozdíl od algoritmů pro řazení zde nedochází k přesouvání nebo přepisování hodnot. Binary Search pracuje pouze se čtením a porovnáváním.\n\
\n\
# Dokončení úlohy\n\
\n\
Úroveň je splněna po skončení programu, pokud proměnná `vysledek` obsahuje správný index hledané hodnoty.\n\
\n\
Pokud se hledaná hodnota v poli nenachází, musí být výsledek -1.\n\
\n\
Původní pole musí zůstat beze změny a hledaná hodnota uložená v proměnné `cil` se nesmí změnit.\n\
\n\
Používejte pouze standardní Javu. Celý zdrojový kód musí být přeložitelný běžným `javac` i mimo hru.\n\
\n\
# Ovládání\n\
\n\
**F5** spustí nebo pozastaví program.\n\
\n\
**F6** provede další operaci nad polem.\n\
\n\
Posuvník upravuje rychlost animace vyhledávání.\n\
\n\
**Ctrl+R** obnoví stav canvasu a zachová váš zdrojový kód.\n\
\n\
**Reset kódu** obnoví pouze původní deklarace pole, hledané hodnoty a výsledku.\n\
\n\
# Výzva navíc\n\
\n\
Po dokončení úlohy zkuste algoritmus upravit tak, aby dokázal najít **první výskyt opakující se hodnoty** v seřazeném poli.\n\
\n\
Zamyslete se, proč běžný Binary Search nemusí vrátit první výskyt a jak by bylo možné změnit práci s hranicemi intervalu.\n\
\n\
Další výzvou je vytvořit rekurzivní variantu algoritmu a porovnat její časovou a paměťovou složitost s implementací pomocí cyklu.
