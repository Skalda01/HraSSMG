assignment=# Bubble sort\n\
\n\
Vaším úkolem je implementovat **Bubble sort (bublinkové řazení)** v čisté Javě. V metodě `main` máte připravené nesetříděné pole `int[]`. Celý algoritmus napište sami pomocí cyklů, podmínek a proměnných.\n\
\n\
Cílem je seřadit všechna čísla **vzestupně**, tedy od nejmenšího po největší, přímo v původním poli.\n\
\n\
# Co je Bubble sort?\n\
\n\
Bubble sort patří mezi nejjednodušší řadicí algoritmy. Funguje na principu **opakovaného porovnávání sousedních prvků**. Pokud jsou dva sousední prvky ve špatném pořadí, algoritmus jejich pozice prohodí.\n\
\n\
Název Bubble sort vychází z toho, že větší hodnoty postupně „probublávají“ směrem ke konci pole.\n\
\n\
Algoritmus je vhodný především pro pochopení základních principů řazení, práce s poli a vnořených cyklů. Pro velká pole existují výrazně efektivnější algoritmy.\n\
\n\
# Jak algoritmus funguje?\n\
\n\
Představte si pole:\n\
\n\
`[5, 2, 4, 1]`\n\
\n\
**První průchod:**\n\
\n\
Porovnáme hodnoty 5 a 2. Protože 5 > 2, prohodíme je.\n\
\n\
`[2, 5, 4, 1]`\n\
\n\
Následně porovnáme 5 a 4. Opět je prohodíme.\n\
\n\
`[2, 4, 5, 1]`\n\
\n\
Nakonec porovnáme 5 a 1 a provedeme další výměnu.\n\
\n\
`[2, 4, 1, 5]`\n\
\n\
Po prvním průchodu se největší hodnota 5 dostala na konec pole. Její pozice je definitivní a v dalších průchodech ji už nemusíme porovnávat.\n\
\n\
**Druhý průchod:**\n\
\n\
Pokračujeme stejným způsobem, ale poslední prvek už vynecháme.\n\
\n\
`[2, 1, 4, 5]`\n\
\n\
**Třetí průchod:**\n\
\n\
Zbývající neseřazené hodnoty znovu porovnáme a případně prohodíme.\n\
\n\
`[1, 2, 4, 5]`\n\
\n\
Pole je nyní seřazené.\n\
\n\
# Princip jednotlivých průchodů\n\
\n\
Při každém úplném průchodu neseřazenou částí pole se její největší prvek přesune na konec této části.\n\
\n\
Po prvním průchodu je správně umístěn poslední prvek. Po druhém průchodu jsou správně umístěny poslední dva prvky. Po třetím poslední tři a tak dále.\n\
\n\
Proto můžeme každý následující průchod zkrátit o jeden prvek. Není potřeba znovu kontrolovat část pole, která už je seřazená.\n\
\n\
Pro pole o 12 prvcích první průchod provede nejvýše 11 porovnání, druhý 10, třetí 9 a tak dále.\n\
\n\
# Běžné Java pole\n\
\n\
Pracujte přímo s proměnnou `pole`. Počet prvků získáte pomocí `pole.length`. Hodnotu přečtete výrazem `pole[index]` a změníte přiřazením `pole[index] = novaHodnota;`.\n\
\n\
Indexy začínají nulou a končí na hodnotě `pole.length - 1`.\n\
\n\
```java\n\
int pocet = pole.length;\n\
int prvni = pole[0];\n\
pole[0] = prvni;\n\
```\n\
\n\
Pro Bubble sort budete potřebovat přistupovat ke dvěma sousedním prvkům, například `pole[j]` a `pole[j + 1]`. Dejte pozor, aby index `j + 1` nikdy nepřekročil konec pole.\n\
\n\
# Váš algoritmus\n\
\n\
Použijte standardní Java cykly, podmínky, operátory a proměnné.\n\
\n\
Projděte pole zleva doprava a porovnávejte sousední hodnoty. Pokud je levá hodnota větší než pravá, prohoďte je.\n\
\n\
Výměnu proveďte pomocí dočasné proměnné, abyste při přepisování neztratili původní hodnotu.\n\
\n\
Algoritmus musí obsahovat opakované průchody polem, protože jediný průchod obecně nestačí k jeho úplnému seřazení.\n\
\n\
V každém dalším průchodu zmenšete procházenou část pole. Vlastní pomocné metody můžete napsat sami a předat jim pole jako parametr.\n\
\n\
# Časová složitost – Big O notace\n\
\n\
**Big O notace** popisuje, jak roste množství práce algoritmu při zvětšování počtu vstupních prvků.\n\
\n\
Počet prvků označujeme písmenem `n`.\n\
\n\
U Bubble sortu rozlišujeme tři základní případy:\n\
\n\
**Nejlepší případ – O(n)**\n\
\n\
Pole je již seřazené. Pokud algoritmus používá optimalizaci, která sleduje, zda během průchodu proběhla alespoň jedna výměna, může po prvním průchodu skončit. Stačí tedy přibližně `n - 1` porovnání.\n\
\n\
Bez této optimalizace zůstává časová složitost i pro seřazené pole O(n²).\n\
\n\
**Průměrný případ – O(n²)**\n\
\n\
Hodnoty jsou v náhodném pořadí. Algoritmus musí opakovaně procházet pole a provádět porovnání i výměny.\n\
\n\
**Nejhorší případ – O(n²)**\n\
\n\
Pole je seřazené v opačném pořadí. Algoritmus musí provést mnoho porovnání a výměn, aby všechny hodnoty přesunul na správná místa.\n\
\n\
Při standardním zkracování průchodů je maximální počet porovnání:\n\
\n\
`n × (n - 1) / 2`\n\
\n\
Například pro 12 prvků:\n\
\n\
`12 × 11 / 2 = 66 porovnání`\n\
\n\
Pro 100 prvků je to 4 950 porovnání a pro 1 000 prvků už 499 500 porovnání.\n\
\n\
S rostoucím počtem prvků proto roste potřebný čas přibližně kvadraticky.\n\
\n\
# Paměťová složitost – O(1)\n\
\n\
Bubble sort má pomocnou paměťovou složitost **O(1)**, tedy konstantní.\n\
\n\
K řazení nepotřebuje vytvářet další pole. Pracuje přímo s původním polem a používá jen několik pomocných proměnných, například indexy a dočasnou proměnnou pro výměnu.\n\
\n\
Takový způsob řazení označujeme jako **in-place algoritmus**.\n\
\n\
# Další vlastnosti algoritmu\n\
\n\
Bubble sort je **stabilní řadicí algoritmus**, pokud prohazuje pouze hodnoty, u kterých je levá striktně větší než pravá. Prvky se stejnou hodnotou si tak zachovávají své vzájemné pořadí.\n\
\n\
Je také **porovnávací algoritmus**, protože o pořadí rozhoduje porovnáváním jednotlivých hodnot.\n\
\n\
Mezi jeho výhody patří jednoduchá implementace, malá spotřeba pomocné paměti a snadné pochopení. Nevýhodou je pomalé zpracování rozsáhlých polí.\n\
\n\
# Možná optimalizace\n\
\n\
Základní Bubble sort provádí předem daný počet průchodů, i když se pole seřadí dříve.\n\
\n\
Efektivnější varianta využívá pomocnou proměnnou, která zaznamenává, zda během aktuálního průchodu proběhla nějaká výměna.\n\
\n\
Pokud během celého průchodu nedojde k žádné výměně, znamená to, že je pole již seřazené. Algoritmus může okamžitě skončit.\n\
\n\
Tato optimalizace zlepšuje nejlepší případ na O(n), ale průměrná a nejhorší časová složitost zůstávají O(n²).\n\
\n\
# Na co si dát pozor?\n\
\n\
Při implementaci si zkontrolujte především správné hranice cyklů. Při porovnávání sousedních hodnot nesmíte přistupovat k indexu mimo pole.\n\
\n\
Při výměně nezapomeňte na dočasnou proměnnou. Bez ní můžete jednu z původních hodnot přepsat a ztratit.\n\
\n\
Také se ujistěte, že po každém průchodu správně zkracujete neseřazenou část pole. Není nutné znovu procházet prvky, které už jsou na svém konečném místě.\n\
\n\
# Živý canvas\n\
\n\
Canvas automaticky sleduje čtení a zápisy do vašeho vstupního pole.\n\
\n\
**Modré zvýraznění** označuje čtení hodnoty z pole. **Oranžová animace** ukazuje změnu hodnoty při zápisu.\n\
\n\
Číslo nad sloupcem představuje hodnotu prvku a číslo pod sloupcem jeho index.\n\
\n\
Počítadla ukazují celkový počet čtení a zápisů. Můžete tak sledovat, kolik operací vaše implementace provádí, a porovnat základní verzi algoritmu s optimalizovanou.\n\
\n\
Po každém průchodu si všimněte, jak se největší zbývající hodnota přesune do pravé části pole a postupně vzniká seřazená oblast.\n\
\n\
# Dokončení úlohy\n\
\n\
Úroveň je splněna po skončení programu, pokud je původní pole vzestupně seřazeno a zachová všechny vstupní hodnoty v původních počtech.\n\
\n\
Vstupní hodnoty neměňte. Používejte pouze standardní Javu. Zdrojový kód musí být přeložitelný i mimo hru.\n\
\n\
# Ovládání\n\
\n\
**F5** spustí nebo pozastaví program.\n\
\n\
**F6** provede další operaci nad polem.\n\
\n\
Posuvník upravuje rychlost animace.\n\
\n\
**Ctrl+R** obnoví vstupní pole a zachová váš kód.\n\
\n\
**Reset kódu** obnoví pouze třídu Main a deklaraci vstupního pole.\n\
\n\
# Výzva navíc\n\
\n\
Po úspěšném dokončení zkuste algoritmus optimalizovat tak, aby se okamžitě zastavil, jakmile zjistí, že je pole seřazené.\n\
\n\
Pozorujte rozdíl v počtu operací a zamyslete se, proč optimalizace výrazně pomáhá již seřazeným polím, ale nemění nejhorší časovou složitost algoritmu.
